<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>语音电话 · 功能测试</title>
    <style>
        /* ===== 主题变量 ===== */
        :root {
            --theme: #B34A6A;
            --bg: #1F1A2A;
            --card: #2E2540;
            --text: #E8DDE6;
            --sub: #A084A0;
            --line: #3D2F4A;
            --call-bg-start: rgba(20, 16, 28, 0.92);
            --call-bg-end: rgba(10, 8, 16, 0.96);
            --transcript-bg: rgba(0, 0, 0, 0.35);
            --transcript-text: #f0f0f0;
            --avatar-size: 80px;
            --btn-size: 50px;
        }
        [data-theme="light"] {
            --theme: #DDB6C9;
            --bg: #F9F4F7;
            --card: #FFFFFF;
            --text: #261D22;
            --sub: #4A3640;
            --line: #D5C5CC;
            --call-bg-start: rgba(245, 240, 243, 0.92);
            --call-bg-end: rgba(235, 228, 232, 0.96);
            --transcript-bg: rgba(255, 255, 255, 0.6);
            --transcript-text: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            margin: 0;
        }

        #phone {
            width: 400px;
            max-width: 100vw;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 32px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: background 0.4s ease;
            max-height: 95vh;
        }
        @media (max-width: 420px) {
            #phone { width: 100vw; border-radius: 0; border: none; max-height: 100vh; }
        }

        /* ===== 顶部状态栏 ===== */
        #statusbar {
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 0 16px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,.4);
            flex-shrink: 0;
            z-index: 50;
            position: relative;
            pointer-events: none;
        }
        #statusbar.dark { color: var(--theme); text-shadow: none; }
        #island {
            position: absolute;
            left: 50%;
            top: 12px;
            transform: translateX(-50%);
            width: 80px;
            height: 18px;
            background: #000;
            border-radius: 12px;
            z-index: 60;
            pointer-events: none;
        }
        .sb-right { display: flex; align-items: center; gap: 4px; font-size: 11px; }
        .batt {
            width: 20px;
            height: 10px;
            border: 1px solid currentColor;
            border-radius: 2px;
            position: relative;
            padding: 1px;
            opacity: .9;
        }
        .batt::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 5px; background: currentColor; border-radius: 0 1px 1px 0; }
        .batt i { display: block; height: 100%; background: currentColor; border-radius: 1px; }

        /* ===== 配置区域 ===== */
        #configArea {
            padding: 10px 14px 8px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        #configArea input, #configArea select {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            flex: 1;
            min-width: 80px;
        }
        #configArea input::placeholder { color: var(--sub); opacity: 0.6; }
        #configArea .btn-sm {
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            background: var(--theme);
            color: #fff;
            flex-shrink: 0;
            transition: 0.2s;
            white-space: nowrap;
        }
        #configArea .btn-sm:active { transform: scale(0.94); }
        #configArea .btn-sm.gray { background: rgba(255,255,255,0.08); color: var(--sub); }

        /* ===== 通话界面 ===== */
        #callView {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 12px 12px;
            background: linear-gradient(160deg, var(--call-bg-start), var(--call-bg-end));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.5s ease;
            min-height: 300px;
            position: relative;
        }
        #callView::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, var(--theme) 0%, transparent 60%);
            opacity: 0.06;
            pointer-events: none;
        }

        .call-avatar-wrap {
            position: relative;
            z-index: 2;
            margin-bottom: 2px;
        }
        .call-avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            background: var(--theme);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 300;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,255,255,0.06);
            transition: box-shadow 0.3s ease;
            flex-shrink: 0;
        }
        .call-avatar .initials { text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .call-avatar-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid var(--theme);
            opacity: 0.3;
            pointer-events: none;
            animation: ringPulse 2.4s ease-in-out infinite;
        }
        @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: 0.2; } 50% { transform: scale(1.08); opacity: 0.6; } }

        .call-name {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
            margin-top: 2px;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .call-status {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255,255,255,0.7);
            margin-top: 1px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 24px;
        }
        .call-status .timer { font-variant-numeric: tabular-nums; font-weight: 300; letter-spacing: 1px; }
        .call-status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4caf50;
            animation: dotPulse 1.4s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes dotPulse { 0%,100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1); opacity: 1; } }

        /* ===== 字幕区域 ===== */
        .call-transcript {
            flex: 1;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            margin: 4px 0 4px;
            padding: 8px 12px;
            background: var(--transcript-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            z-index: 2;
            scroll-behavior: smooth;
            color: var(--transcript-text);
            font-size: 14px;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 80px;
        }
        .call-transcript::-webkit-scrollbar { width: 3px; }
        .call-transcript::-webkit-scrollbar-thumb { background: var(--theme); border-radius: 4px; }

        .call-transcript .msg-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .call-transcript .msg-line:last-child { border-bottom: none; }
        .call-transcript .msg-label { font-weight: 500; flex-shrink: 0; opacity: 0.9; font-size: 13px; }
        .call-transcript .msg-text { word-break: break-word; flex: 1; font-size: 14px; }
        .call-transcript .msg-line.user .msg-label { color: #8ab4f8; }
        .call-transcript .msg-line.ai .msg-label { color: var(--theme); }
        .call-transcript .msg-line.system {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            border-bottom: none;
            justify-content: center;
        }

        .call-transcript .msg-line.voice .voice-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--transcript-text);
            background: rgba(255,255,255,0.06);
            padding: 2px 12px 2px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .call-transcript .msg-line.voice .voice-bubble .wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 16px;
        }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar {
            width: 2.5px;
            border-radius: 2px;
            background: currentColor;
            opacity: 0.5;
        }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(1) { height: 7px; }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(2) { height: 12px; }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(3) { height: 15px; }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(4) { height: 10px; }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(5) { height: 6px; }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(6) { height: 13px; }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(7) { height: 17px; }
        .call-transcript .msg-line.voice .voice-bubble .wave .bar:nth-child(8) { height: 8px; }
        .call-transcript .msg-line.voice .voice-bubble .dur {
            font-size: 10px;
            opacity: 0.5;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            font-weight: 300;
        }

        .call-transcript .msg-line.ai.streaming .msg-text::after {
            content: '▌';
            animation: blink 0.8s step-end infinite;
            color: var(--theme);
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        /* ===== 底部操作栏 ===== */
        .call-actions {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            z-index: 5;
            padding: 6px 0 0;
            margin-top: 2px;
        }
        .call-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .call-btn:active { transform: scale(0.88); }
        .call-btn.mic {
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 24px;
        }
        .call-btn.mic.recording {
            background: rgba(76,175,80,0.4);
            box-shadow: 0 0 30px rgba(76,175,80,0.3);
            animation: pulseGlow 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 20px rgba(76,175,80,0.2); }
            to { box-shadow: 0 0 40px rgba(76,175,80,0.6); }
        }
        .call-btn.hangup {
            width: 56px;
            height: 56px;
            background: #e34;
            color: #fff;
            box-shadow: 0 4px 24px rgba(238,51,68,0.4);
            font-size: 22px;
        }
        .call-btn.hangup:active { transform: scale(0.84); background: #c22; }
        .call-btn.hangup svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .call-btn.speaker.active { background: rgba(50,200,255,0.15); color: #4dd0e1; }

        .call-hint {
            font-size: 10px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
            z-index: 2;
            padding: 4px 0 0;
            text-align: center;
        }

        /* ===== 日志区域 ===== */
        #logArea {
            background: rgba(0,0,0,0.4);
            border-top: 1px solid var(--line);
            padding: 6px 12px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 11px;
            font-family: "SF Mono", "Menlo", monospace;
            color: var(--sub);
            line-height: 1.6;
            flex-shrink: 0;
            min-height: 40px;
        }
        #logArea::-webkit-scrollbar { width: 3px; }
        #logArea::-webkit-scrollbar-thumb { background: var(--theme); border-radius: 4px; }
        #logArea .log-item { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        #logArea .log-item .time { color: #666; font-size: 10px; margin-right: 6px; }
        #logArea .log-item .tag {
            display: inline-block;
            font-size: 9px;
            padding: 0 5px;
            border-radius: 3px;
            margin-right: 4px;
            font-weight: 600;
        }
        .tag.ok { background: #1a4a2a; color: #66bb7a; }
        .tag.err { background: #5a2a2a; color: #ef6b6b; }
        .tag.info { background: #2a4a6a; color: #8ab4f8; }
        .tag.sys { background: #3a3a3a; color: #888; }
        .tag.send { background: #4a4a2a; color: #c8d87a; }
        .tag.recv { background: #2a4a4a; color: #66bbbb; }
        .tag.warn { background: #5a4a2a; color: #d8b87a; }

        .flex-row { display: flex; align-items: center; gap: 6px; width: 100%; flex-wrap: wrap; }
        .flex-row .grow { flex: 1; min-width: 60px; }
        .flex-row .shrink { flex-shrink: 0; }
        .text-muted { color: var(--sub); opacity: 0.6; font-size: 11px; }
        .mt-1 { margin-top: 4px; }

        /* ===== 主题切换（演示） ===== */
        #themeToggle {
            position: absolute;
            top: 44px;
            right: 12px;
            z-index: 30;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 2px 10px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: 0.2s;
            user-select: none;
        }
        #themeToggle:active { transform: scale(0.94); }
        #phone { position: relative; }
    </style>
</head>
<body>

<div id="phone">

    <!-- 状态栏 -->
    <div id="statusbar" class="dark">
        <span id="sbTime">12:00</span>
        <div id="island"></div>
        <span class="sb-right">
            <span>5G</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="14" width="3" height="6" rx="1" fill="currentColor"/>
                <rect x="7" y="10" width="3" height="10" rx="1" fill="currentColor"/>
                <rect x="12" y="5" width="3" height="15" rx="1" fill="currentColor"/>
                <rect x="17" y="1" width="3" height="19" rx="1" fill="currentColor"/>
            </svg>
            <span class="batt"><i id="battLvl" style="width:68%"></i></span>
        </span>
    </div>

    <!-- 配置区域 -->
    <div id="configArea">
        <input id="apiUrl" type="text" value="https://ai.liaobots.work/v1" placeholder="API地址" class="grow" style="min-width:120px;flex:2;" />
        <input id="apiKey" type="password" placeholder="登录码/Key" class="grow" style="min-width:100px;" />
        <button class="btn-sm" id="fetchModelsBtn">📥 拉取模型</button>
        <select id="modelSelect" style="min-width:100px;flex:1.5;">
            <option value="">先拉取模型</option>
        </select>
        <button class="btn-sm gray" id="themeToggle" onclick="toggleTheme()" style="font-size:11px;">🌙</button>
    </div>

    <!-- 通话界面 -->
    <div id="callView">
        <!-- 头像 -->
        <div class="call-avatar-wrap">
            <div class="call-avatar"><span class="initials">🎭</span></div>
            <div class="call-avatar-ring"></div>
        </div>
        <div class="call-name">AI 测试员</div>
        <div class="call-status">
            <span class="dot"></span>
            <span id="statusText">就绪</span>
            <span class="timer" id="callTimer"></span>
        </div>

        <!-- 字幕 -->
        <div class="call-transcript" id="callTranscript">
            <div class="msg-line system">📞 配置API后，按住下方按钮测试</div>
        </div>

        <!-- 操作按钮 -->
        <div class="call-actions">
            <button class="call-btn mic" id="btnMic" title="按住说话">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <button class="call-btn hangup" id="btnHangup">
                <svg viewBox="0 0 24 24">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                    <path d="M18.5 9.5a8 8 0 0 1 0 5"/>
                    <path d="M5.5 9.5a8 8 0 0 0 0 5"/>
                    <path d="M21 7.5a12 12 0 0 1 0 9"/>
                    <path d="M3 7.5a12 12 0 0 0 0 9"/>
                </svg>
            </button>
            <button class="call-btn speaker" id="btnSpeaker" title="扬声器">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
            </button>
        </div>
        <div class="call-hint">按住🎤说话 · 松开自动发送</div>
    </div>

    <!-- 日志区域 -->
    <div id="logArea">
        <div class="log-item"><span class="time">系统</span><span class="tag sys">⏳</span> 准备就绪，请配置API并拉取模型</div>
    </div>

</div>

<script>
    // ============================================================
    // 语音电话测试页面 - 完整功能
    // 使用 Liaobots API (兼容 OpenAI 格式)
    // 支持 Gemini 等多模态模型处理音频
    // ============================================================

    // ---------- DOM 引用 ----------
    const apiUrlInput = document.getElementById('apiUrl');
    const apiKeyInput = document.getElementById('apiKey');
    const modelSelect = document.getElementById('modelSelect');
    const fetchBtn = document.getElementById('fetchModelsBtn');
    const btnMic = document.getElementById('btnMic');
    const btnHangup = document.getElementById('btnHangup');
    const btnSpeaker = document.getElementById('btnSpeaker');
    const transcript = document.getElementById('callTranscript');
    const logArea = document.getElementById('logArea');
    const statusText = document.getElementById('statusText');
    const callTimer = document.getElementById('callTimer');

    // ---------- 状态 ----------
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let stream = null;
    let isStreaming = false;
    let currentStreamController = null;
    let callTimerInterval = null;
    let callSeconds = 0;
    let isCallActive = false;

    // ---------- 工具函数 ----------
    function addLog(tag, msg, tagClass = 'sys') {
        const div = document.createElement('div');
        div.className = 'log-item';
        const now = new Date();
        const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
        div.innerHTML = `<span class="time">${time}</span><span class="tag ${tagClass}">${tag}</span>${msg}`;
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
        // 限制日志数量
        while (logArea.children.length > 50) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    function addTranscript(who, text, type = 'text') {
        const line = document.createElement('div');
        line.className = 'msg-line';
        if (who === 'user') {
            line.classList.add('user');
            line.innerHTML = `<span class="msg-label">我：</span><span class="msg-text">${text}</span>`;
        } else if (who === 'ai') {
            line.classList.add('ai');
            if (type === 'streaming') line.classList.add('streaming');
            line.innerHTML = `<span class="msg-label">TA：</span><span class="msg-text">${text}</span>`;
        } else if (who === 'voice') {
            line.classList.add('voice');
            line.innerHTML = `
                <span class="msg-label">我：</span>
                <span class="voice-bubble">
                    <span>🎤</span>
                    <span class="wave">
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        <span class="bar"></span><span class="bar"></span>
                    </span>
                    <span class="dur">${text}</span>
                </span>
            `;
        } else {
            line.classList.add('system');
            line.textContent = text;
        }
        transcript.appendChild(line);
        transcript.scrollTop = transcript.scrollHeight;
    }

    function setStatus(text) {
        statusText.textContent = text;
    }

    function startTimer() {
        callSeconds = 0;
        callTimer.textContent = '00:00';
        if (callTimerInterval) clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            callSeconds++;
            const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
            const s = String(callSeconds % 60).padStart(2, '0');
            callTimer.textContent = m + ':' + s;
        }, 1000);
    }

    function stopTimer() {
        if (callTimerInterval) {
            clearInterval(callTimerInterval);
            callTimerInterval = null;
        }
    }

    // ---------- 拉取模型 ----------
    async function fetchModels() {
        const url = apiUrlInput.value.trim().replace(/\/$/, '');
        const key = apiKeyInput.value.trim();
        if (!url || !key) {
            addLog('⚠️', '请先填写 API 地址和登录码', 'warn');
            return;
        }

        fetchBtn.textContent = '⏳ 拉取中…';
        fetchBtn.disabled = true;
        addLog('📥', '正在拉取模型列表...', 'info');

        try {
            const response = await fetch(url + '/models', {
                headers: { 'Authorization': 'Bearer ' + key }
            });
            if (!response.ok) throw new Error('HTTP ' + response.status);

            const data = await response.json();
            const models = data.data || data.models || [];
            if (!models.length) throw new Error('没有返回模型列表');

            // 过滤出可用的模型（包含 gemini、gpt-4o、claude 等）
            const filtered = models.filter(m => {
                const id = m.id || m.name || '';
                return id.includes('gemini') || id.includes('gpt-4o') || id.includes('claude');
            });

            // 如果没有过滤出，就全部显示
            const list = filtered.length ? filtered : models;

            modelSelect.innerHTML = '<option value="">请选择模型</option>';
            list.forEach(m => {
                const id = m.id || m.name || '';
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = id;
                modelSelect.appendChild(opt);
            });

            addLog('✅', '拉取成功，共 ' + list.length + ' 个模型可用', 'ok');
            if (filtered.length) {
                addLog('💡', '建议选择 gemini 或 gpt-4o 用于语音测试', 'info');
            }

        } catch (e) {
            addLog('❌', '拉取失败: ' + e.message, 'err');
        } finally {
            fetchBtn.textContent = '📥 拉取模型';
            fetchBtn.disabled = false;
        }
    }

    // ---------- 录音 ----------
    async function startRecording() {
        if (isRecording) return;

        // 检查配置
        const url = apiUrlInput.value.trim().replace(/\/$/, '');
        const key = apiKeyInput.value.trim();
        const model = modelSelect.value;
        if (!url || !key) {
            addLog('⚠️', '请先填写 API 地址和登录码', 'warn');
            return;
        }
        if (!model) {
            addLog('⚠️', '请先拉取并选择模型', 'warn');
            return;
        }

        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const duration = Math.round(blob.size / 16000);
                const durStr = duration + '″';
                addTranscript('voice', durStr);
                addLog('🎤', '录音完成，大小: ' + (blob.size / 1024).toFixed(1) + 'KB，时长: ' + durStr, 'send');
                // 发送音频
                sendAudioToAI(blob);
                // 释放流
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
            };

            mediaRecorder.start();
            isRecording = true;
            btnMic.classList.add('recording');
            setStatus('录音中…');
            addLog('🎤', '开始录音...', 'info');

            // 如果通话未激活，激活它
            if (!isCallActive) {
                isCallActive = true;
                startTimer();
                addTranscript('system', '📞 通话已接通');
                setStatus('通话中');
            }

        } catch (e) {
            addLog('❌', '录音启动失败: ' + e.message, 'err');
            if (e.message.includes('permission') || e.message.includes('denied')) {
                addLog('💡', '请到手机设置 → 应用权限 → 允许麦克风', 'warn');
            }
        }
    }

    function stopRecording() {
        if (!isRecording || !mediaRecorder) return;
        mediaRecorder.stop();
        isRecording = false;
        btnMic.classList.remove('recording');
        setStatus('处理中…');
    }

    // ---------- 发送音频到 AI ----------
    async function sendAudioToAI(audioBlob) {
        const url = apiUrlInput.value.trim().replace(/\/$/, '');
        const key = apiKeyInput.value.trim();
        const model = modelSelect.value;

        if (!url || !key || !model) {
            addLog('❌', '配置不完整，无法发送', 'err');
            return;
        }

        // 将音频转为 base64
        const reader = new FileReader();
        reader.onload = async () => {
            const base64Audio = reader.result.split(',')[1];
            addLog('📤', '音频已编码，准备发送到 ' + model, 'send');

            // 构造多模态消息
            const messages = [
                {
                    role: 'user',
                    content: [
                        { type: 'text', text: '请听这段语音，然后用中文回复我。用口语化的方式，像打电话一样简短自然。' },
                        { type: 'audio', audio: 'data:audio/webm;base64,' + base64Audio }
                    ]
                }
            ];

            // 获取之前的对话上下文（最近3条）
            const existingLines = transcript.querySelectorAll('.msg-line:not(.system)');
            const context = [];
            let count = 0;
            for (let i = existingLines.length - 1; i >= 0 && count < 6; i--) {
                const line = existingLines[i];
                const label = line.querySelector('.msg-label');
                const text = line.querySelector('.msg-text');
                if (label && text) {
                    const role = label.textContent.includes('我') ? 'user' : 'assistant';
                    context.unshift({ role: role, content: text.textContent });
                    count++;
                }
            }
            // 如果有上下文，加入消息中
            if (context.length) {
                messages.unshift({ role: 'system', content: '这是之前的对话上下文，请据此理解并回复。' });
                messages.unshift(...context);
            }

            try {
                const response = await fetch(url + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages,
                        stream: true,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error('HTTP ' + response.status + ': ' + errText.slice(0, 200));
                }

                // 处理流式响应
                isStreaming = true;
                setStatus('AI 正在回复…');
                addLog('📥', '开始接收流式回复...', 'recv');

                const reader2 = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let aiLine = null;

                while (true) {
                    const { done, value } = await reader2.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(l => l.trim());

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                const json = JSON.parse(data);
                                const delta = json.choices?.[0]?.delta?.content;
                                if (delta) {
                                    fullText += delta;
                                    // 更新或创建 AI 回复行
                                    if (!aiLine) {
                                        aiLine = document.createElement('div');
                                        aiLine.className = 'msg-line ai streaming';
                                        aiLine.innerHTML = `<span class="msg-label">TA：</span><span class="msg-text">${fullText}</span>`;
                                        transcript.appendChild(aiLine);
                                    } else {
                                        const textSpan = aiLine.querySelector('.msg-text');
                                        if (textSpan) textSpan.textContent = fullText;
                                    }
                                    transcript.scrollTop = transcript.scrollHeight;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

                // 流式完成
                if (aiLine) {
                    aiLine.classList.remove('streaming');
                    addLog('✅', 'AI 回复完成，共 ' + fullText.length + ' 字', 'ok');
                } else {
                    addLog('⚠️', 'AI 没有返回内容', 'warn');
                }

                isStreaming = false;
                setStatus('通话中');

            } catch (e) {
                addLog('❌', '发送失败: ' + e.message, 'err');
                isStreaming = false;
                setStatus('通话中');
            }
        };

        reader.readAsDataURL(audioBlob);
    }

    // ---------- 挂断 ----------
    function hangup() {
        if (isRecording) {
            stopRecording();
        }
        if (isStreaming) {
            // 中断流式请求
            if (currentStreamController) {
                currentStreamController.abort();
                currentStreamController = null;
            }
            isStreaming = false;
        }
        isCallActive = false;
        stopTimer();
        callTimer.textContent = '00:00';
        setStatus('已挂断');
        addTranscript('system', '📞 通话已结束');
        addLog('📞', '通话已挂断', 'sys');
        // 重置麦克风状态
        btnMic.classList.remove('recording');
        // 释放流
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }
        // 2秒后重置状态
        setTimeout(() => {
            setStatus('就绪');
        }, 1500);
    }

    // ---------- 主题切换 ----------
    let themeDark = true;
    function toggleTheme() {
        themeDark = !themeDark;
        const root = document.documentElement;
        const btn = document.getElementById('themeToggle');
        if (themeDark) {
            root.removeAttribute('data-theme');
            btn.textContent = '🌙';
        } else {
            root.setAttribute('data-theme', 'light');
            btn.textContent = '☀️';
        }
    }

    // ---------- 事件绑定 ----------
    // 拉取模型
    fetchBtn.addEventListener('click', fetchModels);

    // 麦克风：按住录音，松开停止并发送
    btnMic.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        startRecording();
    });
    btnMic.addEventListener('pointerup', (e) => {
        e.preventDefault();
        if (isRecording) stopRecording();
    });
    btnMic.addEventListener('pointerleave', () => {
        if (isRecording) stopRecording();
    });

    // 挂断
    btnHangup.addEventListener('click', hangup);

    // 扬声器（只是 UI 反馈）
    btnSpeaker.addEventListener('click', () => {
        btnSpeaker.classList.toggle('active');
        addLog('🔊', btnSpeaker.classList.contains('active') ? '扬声器已开启' : '扬声器已关闭', 'info');
    });

    // 回车快捷拉取
    apiKeyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') fetchModels();
    });

    // ---------- 初始化 ----------
    addLog('💡', '填写 API 地址和登录码，点击「拉取模型」', 'info');
    addLog('💡', '选择 gemini 或 gpt-4o 后，按住 🎤 说话测试', 'info');

    // 时钟
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('sbTime').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // 电池
    function updateBattery() {
        const lvl = document.getElementById('battLvl');
        if (lvl) {
            const pct = 60 + Math.floor(Math.random() * 25);
            lvl.style.width = pct + '%';
        }
    }
    setInterval(updateBattery, 30000);
    updateBattery();

    console.log('📞 语音电话测试页面已加载');
    console.log('💡 填写API信息 → 拉取模型 → 选择Gemini → 按住🎤说话');
</script>
