<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>查手机</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{--hud:#35f0c0;--hud2:#00d4ff;--warn:#ff5c7a;}
  html,body{height:100%;background:#000;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}
  #app{position:relative;width:100vw;height:100vh;height:100dvh;max-width:400px;max-height:880px;margin:0 auto;overflow:hidden;background:#05080c;}
  @media(min-width:421px){#app{border:1px solid rgba(53,240,192,.22);top:50%;transform:translateY(-50%);border-radius:12px;}}
  #screen{position:absolute;inset:0;}

  /* ============ 通用动画 ============ */
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  @keyframes scan{to{top:110%;}}

  /* ============ 选人页（终端扫描风） ============ */
  .term{--t-acc:#35f0c0;--t-acc2:#00d4ff;--t-warn:#ff5c7a;--t-bg:#05080c;
    --t-panel:rgba(20,32,38,.55);--t-line:rgba(53,240,192,.22);--t-dim:#5a7a78;
    position:absolute;inset:0;display:flex;flex-direction:column;padding:0 18px 18px;overflow:hidden;
    color:var(--t-acc);font-family:"SF Mono",Consolas,"Roboto Mono",monospace;
    background:radial-gradient(120% 80% at 50% -10%,rgba(53,240,192,.10),transparent 60%),
      radial-gradient(100% 60% at 50% 110%,rgba(0,212,255,.08),transparent 60%),var(--t-bg);animation:fade .3s;}
  .term::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(53,240,192,.04) 0,rgba(53,240,192,.04) 1px,transparent 1px,transparent 3px);}
  .term::after{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;z-index:6;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(53,240,192,.09),transparent);animation:scan 6s linear infinite;}
  .term>*{position:relative;z-index:8;}
  .term .sysbar{display:flex;align-items:center;justify-content:center;gap:9px;min-height:38px;flex-shrink:0;
  padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;
  font-size:10.5px;letter-spacing:1px;color:var(--t-dim);border-bottom:1px solid var(--t-line);white-space:nowrap;}
    font-size:10.5px;letter-spacing:1px;color:var(--t-dim);border-bottom:1px solid var(--t-line);white-space:nowrap;}
  .term .sysbar b{color:var(--t-acc);font-weight:600;}
  .term .sep{color:rgba(53,240,192,.3);}
  .term .tdot{width:6px;height:6px;border-radius:50%;background:var(--t-acc);box-shadow:0 0 8px var(--t-acc);animation:blink 1.4s infinite;display:inline-block;}
  .term .pwr{display:inline-flex;align-items:center;gap:4px;}
  .term .pwr .cells{display:inline-flex;gap:1.5px;}
  .term .pwr .cells i{width:3px;height:9px;background:rgba(53,240,192,.15);}
  .term .pwr .cells i.on{background:var(--t-acc);box-shadow:0 0 4px var(--t-acc);}
  .term .navrow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0;font-size:11px;color:var(--t-dim);letter-spacing:1px;flex-shrink:0;}
  .term .navrow .back{color:var(--t-acc);cursor:pointer;}
  .term .thead{padding:16px 4px;flex-shrink:0;}
  .term .thead .kicker{font-size:11px;color:var(--t-acc2);letter-spacing:4px;margin-bottom:10px;}
  .term .thead h1{font-size:26px;letter-spacing:3px;color:#eafff8;font-weight:700;text-shadow:0 0 14px rgba(53,240,192,.5);}
  .term .thead h1 span{color:var(--t-acc);}
  .term .tdesc{font-size:11.5px;color:var(--t-dim);line-height:1.8;margin-top:12px;letter-spacing:.5px;}
  .term .tdesc b{color:var(--t-acc);}
  .term .typed{border-right:2px solid var(--t-acc);animation:caret 1s step-end infinite;padding-right:2px;}
  @keyframes caret{50%{border-color:transparent;}}
  .term .tlabel{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--t-dim);letter-spacing:2px;margin:4px 4px 14px;flex-shrink:0;}
  .term .tlabel::after{content:"";flex:1;height:1px;background:var(--t-line);}
  .term .tlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px;}
  .term .tlist::-webkit-scrollbar{width:0;}
  .term .target{position:relative;display:flex;align-items:center;gap:14px;padding:15px;
    background:var(--t-panel);border:1px solid var(--t-line);border-radius:4px;cursor:pointer;overflow:hidden;transition:.18s;}
  .term .target::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--t-acc);box-shadow:0 0 10px var(--t-acc);}
  .term .target:active{transform:translateX(3px);background:rgba(53,240,192,.08);}
  .term .target.disabled{opacity:.5;cursor:not-allowed;}
  .term .target.disabled::before{background:var(--t-warn);box-shadow:0 0 10px var(--t-warn);}
  .term .corner{position:absolute;top:6px;right:9px;font-size:9px;color:var(--t-dim);letter-spacing:1px;}
  .term .avatar{width:52px;height:52px;flex-shrink:0;border-radius:4px;position:relative;
    background:linear-gradient(135deg,rgba(53,240,192,.25),rgba(0,212,255,.15));
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#eafff8;border:1px solid var(--t-line);overflow:hidden;}
  .term .avatar img{width:100%;height:100%;object-fit:cover;}
  .term .avatar .frame{position:absolute;inset:3px;}
  .term .avatar .frame::before,.term .avatar .frame::after{content:"";position:absolute;width:7px;height:7px;border:1.5px solid var(--t-acc);}
  .term .avatar .frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0;}
  .term .avatar .frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0;}
  .term .info{flex:1;min-width:0;}
  .term .info .name{font-size:16px;color:#eafff8;letter-spacing:1px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
  .term .info .name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .term .info .id{font-size:9px;color:var(--t-dim);letter-spacing:1px;padding:1px 5px;border:1px solid var(--t-line);border-radius:2px;flex-shrink:0;}
  .term .info .rel{font-size:11px;color:var(--t-acc2);margin-top:6px;letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .term .info .bar{margin-top:8px;height:3px;background:rgba(53,240,192,.12);border-radius:2px;overflow:hidden;}
  .term .info .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t-acc2),var(--t-acc));box-shadow:0 0 6px var(--t-acc);}
  .term .right{flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .term .heart{font-size:11px;color:var(--t-dim);letter-spacing:1px;}
  .term .heart b{color:var(--t-acc);font-size:14px;}
  .term .cost{font-size:10px;letter-spacing:1px;padding:6px 10px;border-radius:3px;white-space:nowrap;}
  .term .cost.ok{color:var(--t-bg);background:var(--t-acc);box-shadow:0 0 12px rgba(53,240,192,.5);font-weight:700;}
  .term .cost.no{color:var(--t-warn);border:1px solid var(--t-warn);}
  .term .tfoot{padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:9px;color:var(--t-dim);letter-spacing:1px;text-align:center;opacity:.6;flex-shrink:0;}
  .term .empty{color:var(--t-dim);text-align:center;padding:50px 0;font-size:12px;letter-spacing:1px;}

  /* ============ 开场解码 ============ */
  .boot{position:absolute;inset:0;z-index:200;background:#03060a;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;font-family:"SF Mono",Consolas,monospace;color:var(--hud);animation:fade .2s;}
  .boot .ring{width:70px;height:70px;border:2px solid rgba(53,240,192,.18);border-top-color:var(--hud);
    border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 20px rgba(53,240,192,.3);}
  .boot .pct{font-size:30px;font-weight:200;letter-spacing:2px;}
  .boot .log{font-size:11px;letter-spacing:1px;text-align:center;line-height:1.9;min-height:20px;text-shadow:0 0 6px rgba(53,240,192,.5);}
  .boot .who{font-size:10px;color:#5a7a78;letter-spacing:2px;margin-top:6px;}

  /* ============ 黑客桌面 ============ */
  .deskwrap{position:absolute;inset:0;overflow:hidden;background:linear-gradient(165deg,#1a1730,#231d3e 45%,#12101f);animation:fade .3s;}
  .hud-scan{position:absolute;inset:0;z-index:40;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(53,240,192,.045) 0,rgba(53,240,192,.045) 1px,transparent 1px,transparent 3px);}
  .hud-sweep{position:absolute;left:0;right:0;height:150px;top:-150px;z-index:41;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(53,240,192,.09),transparent);animation:scan 7s linear infinite;}
  .hud-glitch{position:absolute;inset:0;z-index:43;pointer-events:none;mix-blend-mode:screen;opacity:0;
    background:linear-gradient(90deg,rgba(255,0,80,.5),transparent 30%,transparent 70%,rgba(0,240,255,.5));animation:glitch 18s steps(1) infinite;}
  @keyframes glitch{0%,97%,100%{opacity:0;transform:translateX(0);}97.5%{opacity:.5;transform:translateX(-3px);}
    98%{opacity:0;}98.5%{opacity:.4;transform:translateX(3px);}99%{opacity:0;}}
  .hud-corner{position:absolute;width:26px;height:26px;z-index:45;pointer-events:none;border-color:var(--hud);filter:drop-shadow(0 0 4px rgba(53,240,192,.6));}
  .hud-corner.tl{top:50px;left:12px;border-top:2px solid;border-left:2px solid;}
  .hud-corner.tr{top:50px;right:12px;border-top:2px solid;border-right:2px solid;}
  .hud-corner.bl{bottom:12px;left:12px;border-bottom:2px solid;border-left:2px solid;}
  .hud-corner.br{bottom:12px;right:12px;border-bottom:2px solid;border-right:2px solid;}
  .deskwrap .edge{position:absolute;inset:0;z-index:42;pointer-events:none;box-shadow:inset 0 0 70px rgba(53,240,192,.15);}
  .hud-top{position:absolute;top:0;left:0;right:0;height:auto;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:calc(22px + env(safe-area-inset-top,0px)) 28px 0;font-family:"SF Mono",Consolas,monospace;font-size:10px;letter-spacing:1px;color:var(--hud);text-shadow:0 0 6px rgba(53,240,192,.6);}
    padding:12px 16px 0;font-family:"SF Mono",Consolas,monospace;font-size:10px;letter-spacing:1px;color:var(--hud);text-shadow:0 0 6px rgba(53,240,192,.6);}
  .hud-top .rec{display:flex;align-items:center;gap:5px;}
  .hud-top .rec b{width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 6px var(--warn);animation:blink 1.2s infinite;}
  .hud-back{position:absolute;top:44px;left:14px;z-index:55;font-family:"SF Mono",monospace;font-size:11px;letter-spacing:1px;
    color:var(--hud);cursor:pointer;padding:4px 8px 4px 0;text-shadow:0 0 6px rgba(53,240,192,.5);}
  .hud-owner{position:absolute;top:calc(42px + env(safe-area-inset-top,0px));right:24px;z-index:55;font-family:"SF Mono",monospace;font-size:10px;letter-spacing:1px;color:var(--hud2);text-align:right;line-height:1.6;}
  .hud-owner b{color:#eafff8;font-size:12px;}
  .desk{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:80px;animation:deskIn .5s ease both;}
  @keyframes deskIn{from{opacity:0;transform:scale(1.04);}to{opacity:1;transform:scale(1);}}
  .clock{text-align:center;color:#fff;margin-bottom:6px;}
  .clock .t{font-size:58px;font-weight:200;line-height:1;letter-spacing:3px;font-family:"SF Mono",monospace;text-shadow:0 0 22px rgba(53,240,192,.4),0 2px 12px rgba(0,0,0,.5);}
  .clock .d{font-size:12px;opacity:.8;margin-top:6px;letter-spacing:2px;font-family:"SF Mono",monospace;color:var(--hud);}
  .grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:22px 18px 8px;align-content:start;overflow-y:auto;}
  .grid::-webkit-scrollbar{width:0;}
  .capp{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative;}
  .ico{width:52px;height:52px;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,rgba(28,38,46,.9),rgba(10,16,20,.92));
    border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
    box-shadow:inset 0 0 12px color-mix(in srgb,var(--c) 12%,transparent),0 3px 10px rgba(0,0,0,.45);transition:.14s;}
  .capp:active .ico{transform:scale(.9);box-shadow:inset 0 0 18px color-mix(in srgb,var(--c) 30%,transparent),0 0 16px color-mix(in srgb,var(--c) 45%,transparent);}
  .ico svg{width:30px;height:30px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--c) 60%,transparent));}
  .an{font-size:11px;color:#cfe6df;letter-spacing:.5px;font-family:"SF Mono",monospace;}
  .dbadge{position:absolute;top:-3px;right:6px;z-index:2;font-family:"SF Mono",monospace;font-size:8px;color:#03060a;background:var(--c);
    padding:1px 4px;border-radius:3px;letter-spacing:.5px;font-weight:700;box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent);}
  .capp.lock .an{color:#c98a97;}
  .capp.lock .dbadge{color:#fff;}
  .dock{margin:0 14px calc(26px + env(safe-area-inset-bottom,0px));padding:12px 8px;border-radius:22px;background:rgba(12,20,24,.5);backdrop-filter:blur(14px);
  border:1px solid rgba(53,240,192,.3);box-shadow:inset 0 0 20px rgba(53,240,192,.06);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    border:1px solid rgba(53,240,192,.3);box-shadow:inset 0 0 20px rgba(53,240,192,.06);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .dock .an{display:none;}.dock .ico{width:50px;height:50px;}
  .home{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:3px;
  background:rgba(53,240,192,.6);box-shadow:0 0 10px rgba(53,240,192,.6);z-index:48;cursor:pointer;}
    background:rgba(53,240,192,.6);box-shadow:0 0 10px rgba(53,240,192,.6);z-index:48;cursor:pointer;}

  /* ============ App 内容占位弹层 ============ */
  .modal{position:absolute;inset:0;z-index:120;background:rgba(3,6,10,.82);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:32px;animation:fade .2s;
    font-family:"SF Mono",monospace;color:var(--hud);}
  .modal .box{border:1px solid rgba(53,240,192,.3);border-radius:6px;background:rgba(14,22,26,.95);
    padding:26px 22px;text-align:center;max-width:280px;width:100%;box-shadow:0 0 30px rgba(53,240,192,.15);}
  .modal .box h3{font-size:15px;color:#eafff8;letter-spacing:1px;margin-bottom:12px;}
  .modal .box p{font-size:12px;color:#8fb;line-height:1.8;letter-spacing:.5px;opacity:.8;}
  .modal .box .warnc{color:var(--warn);}
  .modal .box button{margin-top:20px;font-family:"SF Mono",monospace;font-size:12px;letter-spacing:1px;color:#03060a;
    background:var(--hud);border:0;border-radius:4px;padding:9px 22px;cursor:pointer;font-weight:700;box-shadow:0 0 12px rgba(53,240,192,.4);}

  /* ===== 模型选择器（HUD）===== */
.hud-model{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:56;
  display:flex;gap:4px;font-family:"SF Mono",monospace;font-size:9px;letter-spacing:1px;
  background:rgba(12,20,24,.6);border:1px solid rgba(53,240,192,.25);border-radius:4px;padding:3px;backdrop-filter:blur(6px);}
  display:flex;gap:4px;font-family:"SF Mono",monospace;font-size:9px;letter-spacing:1px;
  background:rgba(12,20,24,.6);border:1px solid rgba(53,240,192,.25);border-radius:4px;padding:3px;backdrop-filter:blur(6px);}
    display:flex;gap:4px;font-family:"SF Mono",monospace;font-size:9px;letter-spacing:1px;
    background:rgba(12,20,24,.6);border:1px solid rgba(53,240,192,.25);border-radius:4px;padding:3px;backdrop-filter:blur(6px);}
  .hud-model .mlab{color:#5a7a78;padding:3px 5px;align-self:center;}
  .hud-model .mopt{color:var(--hud);padding:3px 8px;border-radius:3px;cursor:pointer;opacity:.5;transition:.15s;}
  .hud-model .mopt.on{background:var(--hud);color:#03060a;opacity:1;font-weight:700;box-shadow:0 0 8px rgba(53,240,192,.5);}

  /* ===== App 窗口 ===== */
  .win{position:absolute;inset:0;z-index:130;display:flex;flex-direction:column;
    background:linear-gradient(165deg,#0a0e16,#0d1420);animation:winIn .28s ease;font-family:"SF Mono",Consolas,monospace;}
  @keyframes winIn{from{opacity:0;transform:scale(1.03);}to{opacity:1;transform:scale(1);}}
  .win::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:repeating-linear-gradient(0deg,rgba(53,240,192,.04) 0,rgba(53,240,192,.04) 1px,transparent 1px,transparent 3px);}
  .win-bar{flex-shrink:0;height:52px;display:flex;align-items:center;gap:10px;padding:14px 14px 0;
    border-bottom:1px solid rgba(53,240,192,.2);position:relative;z-index:4;}
  .win-bar .wt{flex:1;min-width:0;}
  .win-bar .wt .wn{font-size:14px;color:#eafff8;letter-spacing:1px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .win-bar .wt .ws{font-size:9px;color:#5a7a78;letter-spacing:1px;margin-top:3px;}
  .win-bar .wdot{width:7px;height:7px;border-radius:50%;background:var(--hud);box-shadow:0 0 8px var(--hud);animation:blink 1.4s infinite;flex-shrink:0;}
  .win-bar .wclose{color:var(--hud);font-size:11px;letter-spacing:1px;cursor:pointer;padding:6px 10px;
    border:1px solid rgba(53,240,192,.3);border-radius:4px;flex-shrink:0;}
  .win-bar .wclose:active{background:rgba(53,240,192,.15);}
  .win-body{flex:1;overflow-y:auto;position:relative;z-index:4;padding:16px 14px 24px;}
    /* 窗口顶部数据流装饰 */
  .win-bar .wt .ws::before{content:"◉ DECRYPTED · ";color:#35f0c0;}
  .win .win-body{position:relative;}
  /* 内容外再包一层"取证报告"头 */
  .win-forensic{font-family:"SF Mono",monospace;font-size:9px;color:#5a7a78;letter-spacing:1px;
    border:1px solid rgba(53,240,192,.2);border-radius:4px;padding:8px 10px;margin-bottom:14px;
    background:rgba(53,240,192,.04);line-height:1.7;}
  .win-forensic b{color:#35f0c0;}
  .win-forensic .blink{animation:blink 1.2s infinite;}
  /* 内容逐行浮现 */
  @keyframes lineIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:none;}}
  .win-body .pk-content>*{animation:lineIn .35s ease both;}
  .win-body .pk-content>*:nth-child(2){animation-delay:.08s;}
  .win-body .pk-content>*:nth-child(3){animation-delay:.16s;}
  .win-body .pk-content>*:nth-child(4){animation-delay:.24s;}
  .win-body .pk-content>*:nth-child(5){animation-delay:.32s;}

  .win-body::-webkit-scrollbar{width:0;}

  /* 加载态 */
  .win-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;}
  .win-load .ring{width:56px;height:56px;border:2px solid rgba(53,240,192,.18);border-top-color:var(--hud);border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 18px rgba(53,240,192,.3);}
  .win-load .lt{font-size:11px;color:var(--hud);letter-spacing:1px;text-shadow:0 0 6px rgba(53,240,192,.5);min-height:16px;}
  .win-load .lsub{font-size:9px;color:#5a7a78;letter-spacing:1px;}

  /* 错误态 */
  .win-err{padding:30px 10px;text-align:center;color:var(--warn);font-size:12px;line-height:1.9;letter-spacing:.5px;}
  .win-err button{margin-top:16px;font-family:"SF Mono",monospace;font-size:11px;color:#03060a;background:var(--hud);border:0;border-radius:4px;padding:8px 18px;cursor:pointer;font-weight:700;}

  /* ===== AI 生成内容的统一皮肤（字号已调大）===== */
  .pk-content{color:#c8e6df;font-size:14.5px;line-height:1.75;letter-spacing:.3px;
    font-family:-apple-system,"PingFang SC",sans-serif;animation:fade .4s;}
  .pk-content .sec{margin-bottom:20px;}
  .pk-content .sec-t{font-family:"SF Mono",monospace;font-size:11px;color:#35f0c0;letter-spacing:2px;
    margin-bottom:11px;display:flex;align-items:center;gap:8px;text-shadow:0 0 6px rgba(53,240,192,.4);}

/* ==================== 桌面 4 套自适应黑客主题 ==================== */
.deskwrap.theme-matrix {
  --hud: #35f0c0;
  --hud-rgb: 53, 240, 192;
  --desk-bg: linear-gradient(180deg, #08141e 0%, #050d14 45%, #020508 100%);
  --card-bg: rgba(53, 240, 192, 0.05);
  --card-border: rgba(53, 240, 192, 0.2);
}
.deskwrap.theme-gold {
  --hud: #fbbf24;
  --hud-rgb: 251, 191, 36;
  --desk-bg: linear-gradient(180deg, #191209 0%, #100b05 45%, #050301 100%);
  --card-bg: rgba(251, 191, 36, 0.05);
  --card-border: rgba(251, 191, 36, 0.2);
}
.deskwrap.theme-blue {
  --hud: #00d4ff;
  --hud-rgb: 0, 212, 255;
  --desk-bg: linear-gradient(180deg, #071728 0%, #040f1a 45%, #02060b 100%);
  --card-bg: rgba(0, 212, 255, 0.05);
  --card-border: rgba(0, 212, 255, 0.2);
}
.deskwrap.theme-purple {
  --hud: #c084fc;
  --hud-rgb: 192, 132, 252;
  --desk-bg: linear-gradient(180deg, #180a26 0%, #0f0518 45%, #050208 100%);
  --card-bg: rgba(192, 132, 252, 0.05);
  --card-border: rgba(192, 132, 252, 0.2);
}

/* ==================== 桌面容器（防贴边超安全边距） ==================== */
.deskwrap {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--desk-bg);
  /* 🌟 防遮挡核心：上下预留充足安全区 */
  padding: calc(env(safe-area-inset-top, 24px) + 12px) 16px calc(env(safe-area-inset-bottom, 20px) + 12px);
  box-sizing: border-box;
  overflow: hidden;
  font-family: -apple-system, "SF Mono", Consolas, "PingFang SC", monospace;
  transition: background 0.4s ease;
}

/* 四角定位标（内缩防遮挡） */
.hud-corner.tl { top: 38px; left: 14px; }
.hud-corner.tr { top: 38px; right: 14px; }
.hud-corner.bl { bottom: 30px; left: 14px; }
.hud-corner.br { bottom: 30px; right: 14px; }

/* 顶部状态栏与操作条 */
.hud-status-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  color: var(--hud);
  letter-spacing: 1px;
  margin-bottom: 8px;
  padding: 0 4px;
}
.hud-status-line .rec b {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--hud);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--hud);
  animation: blink 1.2s infinite;
  margin-right: 5px;
}

/* 目标角色面板卡 */
.target-panel {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  backdrop-filter: blur(12px);
}
.target-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.target-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid var(--hud);
  box-shadow: 0 0 8px rgba(var(--hud-rgb), 0.35);
  flex-shrink: 0;
  background: #000;

  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.target-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* 模型选择胶囊 */
.hud-model {
  display: flex;
  align-items: center;

  border-radius: 6px;

function _openStore(){return new Promise(function(res,rej){
  if(_store)return res(_store);

  q.onerror=function(e){rej(e);};});}
function loadDB(){return new Promise(function(res){
  _openStore().then(function(db){
    var r=db.transaction('kv','readonly').objectStore('kv').get('DB');
    r.onsuccess=function(){try{DB=JSON.parse(r.result)||{};}catch(e){DB={};}res();};
    r.onerror=function(){DB={};res();};
  }).catch(function(){DB={};res();});});}
function saveDB(){return new Promise(function(res,rej){
  _openStore().then(function(db){
    var tx=db.transaction('kv','readwrite');

/* ================= 精简 callAI（复刻主程序）================= */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function callAI(messages, model, _retry){
  var s=DB.settings||{};
  if(!s.apiUrl||!s.apiKey) throw new Error('请先在主程序设置里填写 API');
  _retry=_retry||0;
  try{
    var ctrl=new AbortController();
    var to=setTimeout(function(){ctrl.abort();},90000);
    var res;
    try{
      res=await fetch(s.apiUrl+'/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
        body:JSON.stringify({model:model||s.chatModel,messages:messages,temperature:0.9}),
        signal:ctrl.signal
      });
    }finally{clearTimeout(to);}
    var raw=''; try{raw=await res.text();}catch(e){}
    if(!res.ok){
      if((res.status>=500||res.status===429)&&_retry<2){await sleep(1500*(_retry+1));return callAI(messages,model,_retry+1);}
      throw new Error('HTTP '+res.status+(raw?'：'+raw.slice(0,200):''));
    }
    var d=JSON.parse(raw);
    if(!d.choices||!d.choices[0]) throw new Error('返回格式异常');
    return d.choices[0].message.content;
  }catch(e){
    if(_retry<2&&/fetch|network|timeout|Failed/i.test(e.message||'')){await sleep(1500*(_retry+1));return callAI(messages,model,_retry+1);}
    throw e;
  }
}

function peekValidPriv(c){
  if(!c.peekPriv||!c.peekPriv.apps)return null;

  return c.peekPriv;

function parsePrivateApp(raw){
  if(!raw)return null;
  raw=raw.replace(/```html/gi,'').replace(/```/g,'').trim();
  function pick(tag){var m=raw.match(new RegExp('【'+tag+'】\\s*([^\\n【]*)'));return m?m[1].trim():'';}
  var app=pick('APP')||pick('应用'),icon=pick('ICON')||pick('图标'),tag=pick('说明');
  var html='',i=raw.indexOf('【界面】');
  if(i>=0)html=raw.slice(i+4).trim();
  else{var j=raw.indexOf('<');if(j>=0)html=raw.slice(j);}
  html=html.replace(/<script[\s\S]*?<\/script>/gi,'')
           .replace(/\son\w+\s*=\s*"[^"]*"/gi,'')
           .replace(/\son\w+\s*=\s*'[^']*'/gi,'');
  if(!html)return null;
  return {app:app||'未知应用',icon:icon||'📱',tag:tag,html:html};
}

function renderPrivate(c, win) {

    peekHackLoad(root, '正在破解手机隐藏分区...');

  if (box.idx >= box.apps.length) box.idx = box.apps.length - 1;
  if (box.idx < 0) box.idx = 0;

  var total = box.total || 6;

  var isCachedNext = box.idx < box.apps.length - 1;
  var isLastLimit = (box.idx >= total - 1);

  var nextLabel = '查看下一个 ›';
  if (isCachedNext) {
    nextLabel = '下一个 ›';

    nextLabel = '↻ 重新扫描';
  } else {
    nextLabel = '🔍 挖掘下一个应用 ›';

  });

  root.innerHTML =
    '<div class="priv-found" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +

        '</span>' +
        '<span id="pvFavBtn" style="cursor:pointer; font-size:11px; padding:3px 8px; border-radius:4px; background:' + (isFaved ? '#ffd70033' : 'rgba(255,255,255,0.08)') + '; color:' + (isFaved ? '#ffd700' : '#8fb8ae') + '; border:1px solid ' + (isFaved ? '#ffd700' : 'rgba(255,255,255,0.15)') + ';">' +
          (isFaved ? '★ 已收藏' : '☆ 收藏') +
        '</span>' +
      '</div>' +
    '</div>' +
    '<div class="priv-head">' +
      '<span class="priv-ic">' + pkEsc(data.icon || '📱') + '</span>' +
      '<div class="priv-hi">' +
        '<div class="priv-name">' + pkEsc(data.app || '未知应用') + '</div>' +
        (data.tag ? '<div class="priv-tag">' + pkEsc(data.tag) + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="priv-screen">' + data.html + '</div>' +
    '<div class="priv-nav" style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">' +
      (hasPrev ? '<span class="priv-btn" id="pvPrev">‹ 上一个</span>' : '<span style="width:70px;"></span>') +
      '<span style="font-size:11px; opacity:0.6; color:#8fb8ae;">' + (box.idx + 1) + ' / ' + box.apps.length + '</span>' +
      '<span class="priv-btn main" id="pvNext">' + nextLabel + '</span>' +
    '</div>';

  // 绑定：打开收藏库
  root.querySelector('#pvFavListBtn').onclick = function() {
    openPrivateFavs(c);
  };

  // 绑定：收藏 / 取消收藏
  root.querySelector('#pvFavBtn').onclick = function() {
    toggleFavPrivApp(c, data);
    renderPrivate(c, win);
  };

  // 绑定：上一个
  var prevBtn = root.querySelector('#pvPrev');
  if (prevBtn) {
    prevBtn.onclick = function() {
      if (box.idx > 0) {
        box.idx--;
        saveDB();
        renderPrivate(c, win);
      }
    };
  }

  // 绑定：下一个 / 重新扫描
  root.querySelector('#pvNext').onclick = function() {
    if (isCachedNext) {
      box.idx++;
      saveDB();
      renderPrivate(c, win);
    } else if (isLastLimit) {
      c.peekPriv = { apps: [], idx: 0, total: peekPrivRandCount(), time: Date.now() };
      win._pv = c.peekPriv;

      peekHackLoad(root, '正在重新扫描隐藏应用...');
      loadPrivateApp(c, win);
    } else {
      peekHackLoad(root, '正在破解下一个隐藏应用...');
      loadPrivateApp(c, win);
    }
  };

/* 小工具：转义，防止聊天内容里的尖括号破坏布局 */
function pkEsc(s){s=(s==null?'':String(s));return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* 按消息类型渲染气泡内容 */
function pkMsgContent(m){
  var t=m.content;
  switch(m.type){
    case 'voice':   return pkVoiceBar(m);
    case 'image':   return '<span class="cv-img">🖼 [图片]</span>';
    case 'sticker': return '<span class="cv-img">😀 [表情]</span>';
    case 'transfer':return '<span class="cv-tr">💰 [转账]'+(t?' '+pkEsc(t):'')+'</span>';
    default:        return t?pkEsc(typeof t==='string'?t:''):'['+pkEsc(m.type||'消息')+']';
  }
}

/* 语音条：波形+时长，点击展开转文字（终端风） */
function pkVoiceBar(m){
  var txt=(m.content||'').toString();
  var dur=Math.max(1,Math.min(60,Math.round(txt.length/2.2)))+'″';
  var bars='';for(var i=0;i<8;i++)bars+='<span class="pkb"></span>';
  return '<span class="pk-voice" onclick="event.stopPropagation();this.classList.toggle(\'exp\')">'+
    '<span class="pkv-top"><span class="pkv-play">▶</span>'+
    '<span class="pkv-wave">'+bars+'</span>'+
    '<span class="pkv-dur">'+dur+'</span></span>'+
    '<span class="pkv-txt">'+pkVoiceText(txt)+'</span></span>';
}

/* 语音转文字：（）和*..*渲染成斜体旁白 */
function pkVoiceText(text){
  var out=pkEsc(text);
  out=out.replace(/（([^）]+)）/g,' <span class="pkv-i">$1</span> ');
  out=out.replace(/\*([^*]+)\*/g,' <span class="pkv-i">$1</span> ');
  return out;
}

/* 容错 JSON 解析：去围栏 + 直接parse + 截取对象/数组再parse */
function parseJsonFromAI(raw){
  if(!raw)return null;
  raw=raw.replace(/```json/gi,'').replace(/```/g,'').trim();
  try{return JSON.parse(raw);}catch(e){}
  var s=raw.search(/[\[{]/);
  var e=Math.max(raw.lastIndexOf(']'),raw.lastIndexOf('}'));
  if(s>=0&&e>s){try{return JSON.parse(raw.slice(s,e+1));}catch(err){}}
  return null;
}

/* 取真实聊天记录：过滤系统/天气，取最近15条 */
function peekRealMsgs(c){
  var arr=(DB.chats&&DB.chats[c.id])||[];
  return arr.filter(function(m){
    return m && m.type!=='system' && m.role!=='system';
  }).slice(-15);
}
/* NPC缓存时效：超过则重生成（毫秒）。12小时。想改间隔改这数字 */
var PEEK_NPC_TTL=12*3600*1000;
function peekValidNpc(c){
  if(!c.peekNpcChats||!c.peekNpcChats.length)return [];
  if(c.peekNpcTime&&(Date.now()-c.peekNpcTime)>PEEK_NPC_TTL)return [];
  return c.peekNpcChats;
}

/* 组装联系人列表：你（真实记录）+ NPC（AI生成）*/
function buildContactList(c){
  return new Promise(function(res){
    var contacts=[];
    /* 1. 你自己（真实聊天记录，过滤系统/天气消息，取最近15条）*/
    var raw=(DB.chats&&DB.chats[c.id])||[];
    var real=raw.filter(function(m){return m.type!=='system'&&m.role!=='system';}).slice(-15);
    var myNick=c.peekMyNick||'（解密中…）';
    if(!c.peekMyNick) genPetName(c);
    var lastMsg=real.length?real[real.length-1]:null;
    contacts.push({
      name:myNick,
      isReal:true,
      msgs:real.map(function(m){return {me:(m.role==='user'),text:realMsgText(m)};}),
      last:lastMsg?realMsgText(lastMsg).slice(0,16):'（暂无消息）',
      time:lastMsg?fmtHM(lastMsg.time):''
    });
    /* 2. NPC（AI生成3~4个）*/
    var sys=buildPeekSystem(c)+'\n\n请只输出JSON，不要任何解释、不要markdown、不要反引号。';
    var usr='列出 TA 手机里除了「'+myNick+'」之外的 3~4 个聊天联系人，'+
      '优先用 TA 社交圈里真实存在的人，也可以合理新增。'+
      '为每个联系人生成一段 6~10 条的真实对话（要符合双方关系、藏一点信息量）。'+
      '严格输出如下JSON数组：'+
      '[{"name":"联系人备注名","msgs":[{"me":true,"text":"TA发的"},{"me":false,"text":"对方发的"}]}]。'+
      'me为true表示这条是 TA（机主）发的，false表示对方发的。只输出JSON。';
    callAI([{role:'system',content:sys},{role:'user',content:usr}],peekModelName()).then(function(out){
      try{
        var j=out.replace(/```json/gi,'').replace(/```/g,'').trim();
        var i=j.indexOf('['),k=j.lastIndexOf(']');
        if(i>=0&&k>=0)j=j.slice(i,k+1);
        var arr=JSON.parse(j);
        arr.forEach(function(t){
          if(!t.name||!t.msgs)return;
          var lm=t.msgs[t.msgs.length-1];
          contacts.push({name:t.name,isReal:false,msgs:t.msgs,
            last:lm?String(lm.text).slice(0,16):'',time:''});
        });
      }catch(e){console.warn('NPC解析失败',e);}
      res(contacts);
    }).catch(function(){res(contacts);});
  });
}

    '，好感度'+((c.status&&c.status.好感度)||0)+'。';
  var usr='你在手机通讯录里给对方起的备注名是什么？只回一个称呼，2到4个字，不要标点不要解释。';
  callAI([{role:'system',content:sys},{role:'user',content:usr}],peekModelName()).then(function(out){

function openWallet(c){

function peekValidWallet(c){
  if(!c.peekWallet)return null;
  if(c.peekWalletTime&&(Date.now()-c.peekWalletTime)>PEEK_WALLET_TTL)return null;
  return c.peekWallet;
}

function loadWallet(c, win) {

    },
    { 
      role: 'user', 
      content:
        '根据 TA 的真实身份、职业、性格反差与秘密，生成 TA 的钱包与银行流水数据。\n\n' +
        '【核心要求·必须有反差和故事感】：\n' +
        '1. 严禁千篇一律的柴米油盐！必须结合 TA 的物种、身份或暗地里的秘密（如：表面高冷/神魔/总裁/大佬，暗地里却在买奇奇怪怪的小玩意、冷门爱好氪金、暗网交易、偷偷给某人打钱、封口费、赔偿金等）。\n' +

        '3. 账单流水（bill）：生成 10~15 条。备注（note）是大精髓！要像真实转账备注（如"水晶球尾款-要求极度真圆""封口费""别再联系了""奶茶去冰多加波霸""违约赔偿"）。\n' +
        '4. 标记可疑：其中 2~4 条特别离谱或涉及隐私秘密的账单，标记 `"warn": true`。\n\n' +
        '严格只输出 JSON 格式，禁止任何 Markdown 标记和废话：\n' +
        '{"accounts":[{"bank":"银行/平台名","no":"尾号xxxx","balance":"¥金额/单位","tag":"主卡/小金库/暗网账户"}],' +
        '"summary":{"in":"¥本月收入","out":"¥本月支出"},' +
        '"sections":[{"title":"资产分区名","rows":[{"l":"资产名","r":"估值/数量","sub":"备注说明","warn":false}]}],' +
        '"bill":[{"name":"交易对方/商户","amt":"±¥金额","time":"时间","note":"转账备注/具体买了啥","warn":false}]}'
    }
  ];

  callAI(msgs, peekModelName()).then(function(out) {
    var data = parseJsonFromAI(out);
    var r = win.querySelector('#pkWalletRoot');
    if (!data) {
      if (r) r.innerHTML = '<div class="win-err">未能提取到银行数据，点下方重试。</div><div class="wal-foot"><span class="wal-refresh" id="pkWalErrRe">↻ 重新扫描</span></div>';
      var errRe = win.querySelector('#pkWalErrRe');
      if (errRe) errRe.onclick = function() { loadWallet(c, win); };
      return;
    }
    c.peekWallet = data;
    c.peekWalletTime = Date.now();
    saveDB();
    if (win.querySelector('#pkWalletRoot')) renderWallet(c, win, data);

    var r = win.querySelector('#pkWalletRoot');

// ==================== 钱包主页面渲染 ====================
function renderWallet(c, win, data) {
  var root = win.querySelector('#pkWalletRoot');
  if (!root || !data) return;
  var html = '';
  
  // 银行卡/账户卡片
  var accs = data.accounts || [];
  if (accs.length) {
    html += '<div class="wal-cards">';
    accs.forEach(function(a) {
      html += '<div class="wal-card">' +
        '<div class="wal-bank">' + pkEsc(a.bank || '账户') +
        (a.tag ? ' <span class="wal-tag">' + pkEsc(a.tag) + '</span>' : '') + '</div>' +
        '<div class="wal-bal">' + pkEsc(a.balance || '0.00') + '</div>' +
        '<div class="wal-no">' + pkEsc(a.no || '') + '</div></div>';
    });
    html += '</div>';
  }
  
  // 本月收支汇总
  var sm = data.summary || {};
  if (sm.in || sm.out) {
    html += '<div class="wal-sum">' +
      '<div class="wal-si"><span>本月流入</span><b>' + pkEsc(sm.in || '—') + '</b></div>' +
      '<div class="wal-so"><span>本月流出</span><b>' + pkEsc(sm.out || '—') + '</b></div></div>';
  }
  
  // 账单入口按钮
  var bill = data.bill || [];
  var sus = bill.filter(function(b) { return b.warn; }).length;
  html += '<div class="wal-entry" id="pkBillEntry">' +
    '<div class="wal-el"><div class="wal-en">💳 账单明细流水</div>' +
    '<div class="wal-es">共 ' + bill.length + ' 笔' + (sus ? ' · <span class="wal-esw">🚨 ' + sus + ' 笔可疑交易</span>' : '') + '</div></div>' +
    '<div class="msg-ar">›</div></div>';
  
  // 资产类分区
  (data.sections || []).forEach(function(sec) {
    html += '<div class="wal-sec"><div class="wal-sect">' + pkEsc(sec.title || '名下资产') + '</div>';
    (sec.rows || []).forEach(function(r) {
      html += '<div class="wal-row' + (r.warn ? ' warn' : '') + '">' +
        '<div class="wal-l"><div class="wal-ln">' + pkEsc(r.l || '') + '</div>' +
        (r.sub ? '<div class="wal-ls">' + pkEsc(r.sub) + '</div>' : '') + '</div>' +
        '<div class="wal-r">' + pkEsc(r.r || '') + '</div></div>';
    });
    html += '</div>';
  });
  
  // 底部刷新
  html += '<div class="wal-foot" style="margin-top:16px;"><span class="wal-refresh" id="pkWalRe">↻ 重新渗透资金库</span></div>';
  root.innerHTML = html;

  // 点击进入账单明细
  root.querySelector('#pkBillEntry').onclick = function() {
    renderWalletBill(c, win, data);
  };
  
  // 点击重新扫描
  root.querySelector('#pkWalRe').onclick = function() {
    c.peekWallet = null;
    c.peekWalletTime = 0;
    saveDB();
    peekHackLoad(root, '正在破解银行网关与加密货币节点...');
    loadWallet(c, win);
  };
}

// ==================== 账单明细页面（支持收藏奇葩账单） ====================
function renderWalletBill(c, win, data) {
  var root = win.querySelector('#pkWalletRoot');
  if (!root) return;
  var bill = data.bill || [];
  if (!c.peekFavBills) c.peekFavBills = [];

  var html = '<div class="msg-back" id="pkBillBack" style="cursor:pointer; color:#35f0c0; font-size:13px; margin-bottom:12px;">‹ 返回钱包总览</div>' +
    '<div class="wal-sect" style="margin-top:4px">账单明细 · ' + bill.length + ' 笔</div>';

  if (!bill.length) {
    html += '<div class="msg-empty">（暂无账单记录）</div>';
  } else {
    bill.forEach(function(b, idx) {
      var amt = (b.amt || '').toString();
      var isIn = /^\+|^＋/.test(amt.trim());
      var isFaved = c.peekFavBills.some(function(fb) { return fb.name === b.name && fb.time === b.time && fb.amt === b.amt; });
      
      html += '<div class="bill-row' + (b.warn ? ' warn' : '') + '" style="position:relative; padding-right:32px;">' +
        '<div class="bill-l">' +
          '<div class="bill-nm">' + pkEsc(b.name || '') + (b.warn ? ' <span class="wal-warn" style="color:#ff5c7a;font-size:10px;border:1px solid #ff5c7a;border-radius:3px;padding:0 3px;">可疑</span>' : '') + '</div>' +
          '<div class="bill-tm">' + pkEsc(b.time || '') + (b.note ? ' · <span style="color:#eafff8;">' + pkEsc(b.note) + '</span>' : '') + '</div>' +
        '</div>' +
        '<div class="bill-amt ' + (isIn ? 'in' : 'out') + '">' + pkEsc(amt) + '</div>' +
        '<span class="bill-fav" data-idx="' + idx + '" style="position:absolute; right:4px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:14px; color:' + (isFaved ? '#ffd700' : '#5a7a78') + ';">' +
          (isFaved ? '★' : '☆') +
        '</span>' +
      '</div>';
    });
  }

  root.innerHTML = html;

  // 返回主页
  root.querySelector('#pkBillBack').onclick = function() { renderWallet(c, win, data); };

  // 绑定每条账单的收藏事件
  root.querySelectorAll('.bill-fav').forEach(function(btn) {
    btn.onclick = function() {
      var idx = parseInt(this.dataset.idx, 10);
      var target = bill[idx];
      var fIndex = c.peekFavBills.findIndex(function(fb) { return fb.name === target.name && fb.time === target.time && fb.amt === target.amt; });
      if (fIndex > -1) {
        c.peekFavBills.splice(fIndex, 1);
      } else {
        c.peekFavBills.push(target);
      }
      saveDB();
      renderWalletBill(c, win, data); // 刷新
    };
  });

  var body = win.querySelector('.win-body');
  if (body) body.scrollTop = 0;
}
function realMsgText(m){
  if(m.recalled)return '（撤回了一条消息）';
  if(m.type==='image')return '[图片]';
  if(m.type==='voice')return '[语音]';
  if(m.type==='sticker')return '[表情]';
  if(m.type==='transfer')return '[转账 ¥'+(m.amount||'')+']';
  return m.content||'';
}

  c.peekApps = c.peekApps || {};

/* 真正去问 AI 拿数据 */
function fetchWin(c, win, a){
  var body=win.querySelector('.win-body');
  if(body){
    body.innerHTML='<div class="win-load"><div class="ring"></div>'+
      '<div class="lt" id="loadT">CONNECTING...</div><div class="lsub">正在破解并提取数据</div></div>';
  }
  var steps=['CONNECTING...','DECRYPTING '+a.name.toUpperCase()+'...','EXTRACTING DATA...','RENDERING...'];
  var si=0;
  var lt=win.querySelector('#loadT');
  var timer=setInterval(function(){si=(si+1)%steps.length;if(lt)lt.textContent=steps[si];},700);

  var messages=[
    {role:'system',content:buildPeekSystem(c)+
      '\n【最近聊天记录（仅供参考 TA 的近期状态之一，不是全部）】\n'+recentChatText(c)+
      '\n\n【极重要·内容平衡原则】\n'+
      '1. 上面的聊天记录只反映"最近几天"的一件事，绝不能让它（比如一次吵架、一时情绪）主导你生成的全部内容。\n'+
      '2. 生成内容要以 TA 的【身份、职业、长期生活方式、性格】为主体。先想：以 TA 这个身份的人，手机里本该有什么？再自然带一点近期状态。\n'+
      '3. 严禁整篇都在抒情、自怨自艾、写散文。TA 是有事业、有社会身份的人，不是只会伤春悲秋。\n'+
      '\n'+HTML_RULE},
    {role:'user',content:APP_TASK[a.id]}
  ];

  callAI(messages,peekModelName()).then(function(out){
    clearInterval(timer);
    var html=cleanHtml(out);
    if(html){
      c.peekApps = c.peekApps || {};
      c.peekApps[a.id] = { html: html, time: Date.now() };   // ← 存缓存
      saveDB();
      renderWin(c, win, a, html);
    }else{
      var b=win.querySelector('.win-body');
      if(b) b.innerHTML='<div class="win-err">未能提取到数据（AI 返回为空）</div>';
    }
  }).catch(function(e){
    clearInterval(timer);
    var b=win.querySelector('.win-body');
    if(b) b.innerHTML='<div class="win-err">⚠ ACCESS FAILED<br>'+((e&&e.message)||'连接失败')+
      '<br><button onclick="this.closest(\'.win\').remove()">返回</button></div>';
  });
}

/* ===== 清洗 AI 输出：去掉 markdown 围栏和多余解释 ===== */
function cleanHtml(t){
  if(!t)return '';
  t=t.replace(/```html/gi,'').replace(/```/g,'').trim();
  var i=t.indexOf('<div');
  if(i>0)t=t.slice(i);
  return t;
}
