function openLoreEntries(worldId, bookId){
  var w = (DB.worlds||[]).find(function(x){return x.id===worldId;});
  if(!w){alert('世界观不存在');return;}
  var book = (DB.lorebooks||[]).find(function(b){return b.id===bookId;});
  if(!book){ openLorebook(worldId); return; }
  window._loreCurBook = bookId;
  var list = (DB.lorebook||[]).filter(function(e){return e.worldId===worldId && e.bookId===bookId;});
  var selMode = window._loreSelMode || false;
  window._loreSelSet = window._loreSelSet || {};

  var html = '<div class="'+(selMode?'wv-sel':'')+'">';
  if(!selMode){
    html += '<div class="wv-lore-tip">《'+esc(book.name)+'》：这套里的设定卡片。聊天中提到关键词时会作为背景注入给 AI。</div>';
    html += '<div class="wv-lore-acts">' +
            '<span class="wv-btn primary" onclick="aiGenLore(\''+worldId+'\',\''+bookId+'\')">✨ AI自动生成</span>' +
            '<span class="wv-btn" onclick="openLoreEditor(\''+worldId+'\',\''+bookId+'\',null)">＋ 添加</span>' +
            '</div>';
  }
  if(!list.length){
    html += '<div class="empty" style="margin-top:30px;">这套还没有条目<br>点上面的按钮添加或生成</div>';
  }else{
    html += '<div class="wv-sec-t">共 '+list.length+' 个条目'+(selMode?'（点击选择）':'')+'</div>';
    list.forEach(function(e){
      var on = e.enabled!==false;
      var snip = esc((e.content||'').replace(/\n/g,' ')).slice(0,42);
      if(e.content && e.content.length>42) snip += '…';
      var checked = !!window._loreSelSet[e.id];
      var click = selMode ? 'toggleLoreSel(\''+worldId+'\',\''+e.id+'\')' : 'openLoreEditor(\''+worldId+'\',\''+bookId+'\',\''+e.id+'\')';
      var modeTag = (e.mode==='constant')
        ? '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(255,140,0,.15);color:#e67300;margin-left:6px;white-space:nowrap;">📌 常驻</span>'
        : '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(43,111,214,.12);color:#2b6fd6;margin-left:6px;white-space:nowrap;">🔑 关键词</span>';
      html += '<div class="wv-lore-item" onclick="'+click+'">' +
        '<span class="wv-check'+(checked?' on':'')+'">'+(checked?'✓':'')+'</span>' +
        '<span class="wv-lore-dot'+(on?'':' off')+'">'+(on?'●':'○')+'</span>' +
        '<div class="wv-lore-c">' +
        '<div class="wv-lore-kw">'+esc(e.name||'（未命名）')+modeTag+'</div>' +
        '<div class="wv-lore-snip">'+(snip||'（空）')+'</div>' +
        '</div></div>';
    });
  }
  html += '</div>';

  if(selMode){
    var selCount = list.filter(function(e){return window._loreSelSet[e.id];}).length;
    html += '<div class="wv-selbar">' +
      '<span class="sb-all" onclick="toggleLoreSelAll(\''+worldId+'\')">全选</span>' +
      '<span class="sb-del'+(selCount?'':' dim')+'" onclick="deleteLoreSelected(\''+worldId+'\')">删除 '+(selCount?('('+selCount+')'):'')+'</span>' +
      '</div>';
  }

  showChrome(true,false);
  statusbar.classList.add('dark');
  tbTitle.textContent = '📖 '+(book.name||'世界书');
  tbLeft.textContent = selMode ? '取消' : '‹';
  tbLeft.onclick = selMode
    ? function(){ window._loreSelMode=false; window._loreSelSet={}; openLoreEntries(worldId, bookId); }
    : function(){ window._loreCurBook=null; openLorebook(worldId); };
  tbRight.textContent = list.length ? (selMode ? '' : '管理') : '';
  tbRight.onclick = (list.length && !selMode)
    ? function(){ window._loreSelMode=true; window._loreSelSet={}; openLoreEntries(worldId, bookId); }
    : null;
  content.innerHTML = html;
}

// 选中/取消单条
function toggleLoreSel(worldId, loreId){
  window._loreSelSet = window._loreSelSet || {};
  if(window._loreSelSet[loreId]) delete window._loreSelSet[loreId];
  else window._loreSelSet[loreId] = true;
  openLoreEntries(worldId, window._loreCurBook);
}
// 全选/取消全选（只针对当前这套）
function toggleLoreSelAll(worldId){
  var bookId = window._loreCurBook;
  var list = (DB.lorebook||[]).filter(function(e){return e.worldId===worldId && e.bookId===bookId;});
  var allSel = list.length && list.every(function(e){return window._loreSelSet[e.id];});
  window._loreSelSet = {};
  if(!allSel){ list.forEach(function(e){ window._loreSelSet[e.id]=true; }); }
  openLoreEntries(worldId, bookId);
}
// 删除选中
function deleteLoreSelected(worldId){
  var bookId = window._loreCurBook;
  var ids = Object.keys(window._loreSelSet||{}).filter(function(k){return window._loreSelSet[k];});
  if(!ids.length){ return; }
  popConfirm('确定删除选中的 '+ids.length+' 个条目？', function(){
    DB.lorebook = (DB.lorebook||[]).filter(function(e){ return ids.indexOf(e.id)<0; });
    save();
    window._loreSelMode = false;
    window._loreSelSet = {};
    openLoreEntries(worldId, bookId);
  });
}

// ===== 世界书：保存 =====
function saveLore(worldId, bookId, loreId){
  var nameVal = document.getElementById('lore_name').value.trim();
  var contentVal = document.getElementById('lore_content').value.trim();
  var enabled = document.getElementById('lore_enabled').checked;
  var modeVal = document.querySelector('input[name="lore_mode"]:checked');
  modeVal = modeVal ? modeVal.value : 'selective';
  if(!nameVal && !contentVal){ alert('关键词和内容至少填一个'); return; }
  if(loreId){
    var e = (DB.lorebook||[]).find(function(x){return x.id===loreId;});
    if(e){ e.name=nameVal; e.content=contentVal; e.enabled=enabled; e.mode=modeVal; e.updatedAt=Date.now(); }
  }else{
    var ne = blankLore(worldId, bookId);
    ne.name=nameVal; ne.content=contentVal; ne.enabled=enabled; ne.mode=modeVal;
    DB.lorebook = DB.lorebook || [];

// ===== 世界书：扫描命中并生成注入文本 =====
function buildLoreInject(c, currentMsg){
  if(!c || !c.worldId) return '';
  var enabledBooks = {};
  (DB.lorebooks||[]).forEach(function(b){
    if(b.worldId===c.worldId && b.enabled!==false) enabledBooks[b.id]=true;
  });
  var entries = (DB.lorebook||[]).filter(function(e){
    return e.worldId===c.worldId && e.enabled!==false && (!e.bookId || enabledBooks[e.bookId]);
  });
  if(!entries.length) return '';

  // 取最近若干条对话文本作为扫描范围（默认最近6条）
  var msgs = (DB.chats[c.id]||[]);
  var scanDepth = 6;
  var recent = msgs.slice(-scanDepth);
var scanText = recent.map(function(m){
    return (m && typeof m.content==='string') ? m.content : '';
}).join('\n');
if(currentMsg) scanText += '\n' + currentMsg;
  var hits = [];
  entries.forEach(function(e){
    // 常驻条目：每次都注入
    if(e.mode==='constant'){ hits.push(e); return; }
    // 选择性条目：命中关键词才注入
    if(!e.name) return;
    var keys = e.name.split(/[,，、\s]+/).filter(Boolean);
    var matched = keys.some(function(k){ return scanText.indexOf(k)>=0; });
    if(matched) hits.push(e);
  });

  if(!hits.length) return '';

  // 按 order 升序（数字小的优先），限制总条数与总长度，避免撑爆上下文
  hits.sort(function(a,b){ return (a.order||50)-(b.order||50); });
  var MAX_ITEMS = 12, MAX_CHARS = 3000, used = 0;
  var out = '\n【世界设定补充（背景知识，请自然融入，不要主动复述这些设定）】\n';
  var count = 0;
  for(var i=0;i<hits.length;i++){
    if(count>=MAX_ITEMS) break;
    var seg = '· ' + (hits[i].content||'') + '\n';
    if(used+seg.length>MAX_CHARS) break;
    out += seg; used += seg.length; count++;
  }
  return count ? out : '';
}

// 撤回
function groupRecallMsg(id){
  var arr = DB.chats[view.id]; if(!arr) return;
  var m = arr.find(function(x){ return x.id===id; });
  if(!m || m.recalled) return;
  popConfirm('撤回这条消息？', function(){
    m.recalledContent = (m.type==='text'||m.type==='voice') ? m.content : '['+(m.type||'消息')+']';
    m.recalled = true;
    m.reveal = false;
    save();
    renderGroupChat(true);
  }, {icon:'↩️', title:'撤回消息'});
}

// 删除单条
function groupDelMsg(id){
  var arr = DB.chats[view.id]; if(!arr) return;
  var idx = arr.findIndex(function(x){ return x.id===id; });
  if(idx<0) return;
  arr.splice(idx,1);
  // 更新群预览为最后一条
  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });
  if(g){
    var last = arr[arr.length-1];
    if(last){
      var pv = last.type==='text'?last.content:(last.type==='image'?'[图片]':(last.type==='sticker'?'[表情]':''));
      g.lastMsg = { text:pv, time:last.time, senderId:(last.role==='user'?'user':last.charId) };
    } else g.lastMsg = null;
  }
  save();
  renderGroupChat(true);
}

function groupPush(m){
  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });
  if(!g) return;
  m.id = newId();
  m.time = Date.now();
  if(!DB.chats[g.id]) DB.chats[g.id] = [];
  DB.chats[g.id].push(m);

  var preview = '';
  if(m.type==='text') preview = m.content;
  else if(m.type==='image') preview = '[图片]';
  else if(m.type==='sticker') preview = '[表情]';
  g.lastMsg = { text:preview, time:m.time, senderId:(m.role==='user'?'user':m.charId) };

  renderGroupChat(false);   // ← 改成 false：重绘后滚到底部

function buildGroupHistory(g){
  var msgs = DB.chats[g.id] || [];
  var lim = parseInt(DB.settings.ctxLimit);
  if (lim>0 && msgs.length>lim) msgs = msgs.slice(-lim);
  var meName = DB.me.name || '我';
  var lines = msgs.map(function(m){
    if (m.recalled) return null;
    var who = (m.role==='user') ? meName : (function(){ var mc=getC(m.charId); return mc?(mc.nick||mc.name):'某人'; })();
    var content;
    if (m.type==='image') content = '[图片]';
    else if (m.type==='sticker') content = '[表情：' + (m.content||'') + ']';
    else if (m.type==='voice') content = '[语音]' + (m.content||'');
    else content = m.content || '';
    if (!content) return null;
    return who + '：' + content;
  }).filter(Boolean);
  return lines.join('\n');
}
// ===== 群聊·把历史转成标准多轮对话（自己说的算 assistant）=====
function buildGroupMessages(g, c){
  var msgs = DB.chats[g.id] || [];
  var lim = parseInt(DB.settings.ctxLimit);
  if (lim>0 && msgs.length>lim) msgs = msgs.slice(-lim);
  var meName = DB.me.name || '我';
  var out = [];
  msgs.forEach(function(m){
    if (m.recalled) return;
    var content;
    if (m.type==='image') content = '[图片]';
    else if (m.type==='sticker') content = '[表情：' + (m.content||'') + ']';
    else if (m.type==='voice') content = '[语音]' + (m.content||'');
    else content = m.content || '';
    if (!content) return;
    if (m.role !== 'user' && m.charId === c.id){
      out.push({ role:'assistant', content: content });
    } else {
      var who = (m.role==='user') ? meName : (function(){ var mc=getC(m.charId); return mc?(mc.nick||mc.name):'某人'; })();
      out.push({ role:'user', content: who + '：' + content });
    }
  });
  var merged = [];
  out.forEach(function(x){
    if (merged.length && merged[merged.length-1].role === x.role){
      merged[merged.length-1].content += '\n' + x.content;
    } else {
      merged.push({ role:x.role, content:x.content });
    }
  });
  return merged;
}

        // 场景B：还在线下，检查是否隔了很久
        var _offlineChats = DB.chats[c.id] || [];
        var _lastMsgTime = _offlineChats.length ? _offlineChats[_offlineChats.length - 1].time : 0;
        var _hoursPassed = _lastMsgTime ? (Date.now() - _lastMsgTime) / 3600000 : 0;
        if (_hoursPassed >= 3) {
          _autoPrompt = '（系统提示·仅供参考不要复述：距离上次互动已经过去' + Math.floor(_hoursPassed) + '小时，这场见面该自然收尾了。请在回复中自然写出道别、各自离开，并在回复最末尾单独加上 [回线上|]）';
        } else {
          _autoPrompt = '（请顺着当前剧情继续）';
        }
      }

      messages.push({ role: 'user', content: _autoPrompt });
    }
      // ---- 调用 AI ----
      let out = '';
      try {
        out = await callAI(messages, DB.settings.chatModel);
      } catch (e) {
        continue; // 单个角色失败不影响其他人
      }
      out = (out || '').trim();
      if (!out) continue;

      // ---- 处理特殊标记（[不说]、[私聊触发]） ----
      if (/^\[不说\]/.test(out)) continue; // 角色选择不说话

      const wantPrivate = /\[私聊触发\]/.test(out);
      // 移除这些标记，只保留实际要发的消息
      out = out.replace(/\[私聊触发\]/g, '').replace(/\[不说\]/g, '').trim();
      if (!out) continue;

      // 移除可能残留的旧方括号标记（转账/撤回/拉黑/心声），这些在群聊里我们不处理
      out = out.replace(/\[(转账|撤回|拉黑玩家|心声)[^\]]*\]/g, '').trim();
	  out = out.replace(/(?:^|\n)\s*心声[：|].*/g, '').trim();

      if (!out) continue;

      // ---- 用新解析器整段解析，自动识别语音/表情/文本 ----
      const parts = parseAIMessage(out);

      // 遍历解析结果，依次发送
      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        let msgType = null;
        let content = null;

        switch (part.type) {
          case 'voice':
            msgType = 'voice';
            content = part.content;
            break;
case 'sticker': {
    const exists = DB.stickers.some(s => s.name === part.content);
    if (exists) {
        msgType = 'sticker';
        content = part.content;
    } else {
        // 不存在就置空，后面的 if (msgType && content) 会跳过这条
        msgType = null;
        content = null;
    }
    break;
}
          case 'text':
            if (part.recalled) {
              // 群聊不处理撤回，直接显示撤回内容作为普通文本
              content = part.recalledContent || '';
            } else {
              content = part.content || '';
            }
            if (content.trim()) {
              msgType = 'text';
              content = content.trim();
            }
            break;
          default:
            // 忽略转账、拉黑、action 等类型
            break;
        }

        if (msgType && content) {
          pushGroupAIMsg(c.id, content, msgType);
          // 模仿打字延迟（和原来一致）
          if (i < parts.length - 1) {
            await sleep(200 + Math.min(content.length * 10, 600));
          }
        }
      }

      // ---- 触发私聊联动（如果标记了） ----
      if (wantPrivate) {
        triggerGroupPrivate(c);
      }

      // 角色之间延迟
      if (k < chosen.length - 1) {
        await sleep(300 + Math.random() * 200);
      }
    }
  } catch (e) {
    alert('群聊回复失败：' + e.message + '\n\n【调用栈】\n' + (e.stack || '无'));
    console.error('群聊报错详情', e);
  } finally {
  groupReplying = false;
    const b2 = document.getElementById('actBtn');
    if (b2) { b2.textContent = '▶ 回复'; b2.disabled = false; }
  }
}

// ==================== 群聊AI·触发调度 ====================
var groupReplying = false;

function triggerGroupAI(){
  if (groupReplying) return;
  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });
  if(!g) return;
  if(!DB.settings.chatModel){ alert('请先在 设置 里选择模型'); return; }

  // 找出被@的成员
  var msgs = DB.chats[g.id] || [];
  var lastUserMsg = null;
  for(var i=msgs.length-1;i>=0;i--){ if(msgs[i].role==='user'){ lastUserMsg=msgs[i]; break; } }
  var atText = (lastUserMsg && lastUserMsg.type==='text') ? lastUserMsg.content : '';

  // 计算每个成员权重
  var pool = g.members.map(function(cid){
    var c = getC(cid);
    if(!c) return null;

    // 活动度
    var actMap = { '关':0, '低':0.2, '中':0.6, '高':1.0 };
    var wAct = (actMap[c.activity]!==undefined) ? actMap[c.activity] : 0.6;

    // 粘人度 0~100 → 0.2~1.0
    var cling = (c.clinginess===undefined?50:c.clinginess);
    var wCling = 0.2 + (cling/100)*0.8;

    // 好感度 0~100 → 0.2~1.0
    var fav = (c.status && c.status.好感度!==undefined) ? c.status.好感度 : 50;
    var wFav = 0.2 + (fav/100)*0.8;

    // 对"用户"的关系系数
    var relCoef = 1.0;
    var curRel = (c.status && c.status.当前关系) ? c.status.当前关系 : '';
    if(/恋|爱人|喜欢|暧昧/.test(curRel)) relCoef = 1.3;
    else if(/敌|讨厌|仇/.test(curRel)) relCoef = 0.5;

    var weight = wAct * wCling * wFav * relCoef;

    // 被@ +0.5
    var atMe = atText && atText.indexOf('@'+(c.nick||c.name)) >= 0;
    if(atMe) weight += 0.5;

    return { cid:cid, c:c, weight:weight, atMe:!!atMe };
  }).filter(Boolean);

  // 筛选 + 选人
  var candidates = pool.filter(function(p){ return p.weight > 0.1; });
  if(!candidates.length){
    // 保底：选权重最高的1人
    pool.sort(function(a,b){ return b.weight-a.weight; });
    candidates = pool.slice(0,1);
  }

  // 被@的必选；其余按权重比例随机，总共1~3人
  var chosen = [];
  candidates.forEach(function(p){ if(p.atMe) chosen.push(p); });

  var rest = candidates.filter(function(p){ return !p.atMe; });
  // 按权重加随机扰动排序
  rest.sort(function(a,b){ return (b.weight*Math.random()) - (a.weight*Math.random()); });

  var maxSpeakers = 3;
  for(var j=0; j<rest.length && chosen.length<maxSpeakers; j++){
    // 权重越高越可能入选
    var p = rest[j];
    var prob = Math.min(0.9, p.weight);
    if(chosen.length===0 || Math.random() < prob) chosen.push(p);
  }
  if(!chosen.length && candidates.length) chosen.push(candidates[0]);

  // 限制最多3人
  chosen = chosen.slice(0,3);

  groupAISpeak(chosen);

}

async function triggerGroupPrivate(c){

  var today = new Date().toDateString();
  if (!c._grpPrivDaily || c._grpPrivDaily.date !== today) {

  c._grpPrivDaily.count += 1;
  save();

  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });
  var groupName = g ? g.name : '群聊';
  var meName = DB.me.name || '我';

  try {
    // 用私聊的完整人设（buildSystem），保证是"真正的TA"
    var sys = buildSystem(c);

    var prompt = '【场景】你刚才在群「' + groupName + '」里和大家聊天，但你此刻对"' + meName +

      '【刚才的群聊记录】\n' + recentGroup + '\n\n' +
      '【要求】\n' +
      '1. 直接输出你私聊发给TA的消息，口语化、简短、符合你的性格。\n' +
      '2. 内容要呼应刚才群里的情境，体现"当着大家不好说、私下才敢说"的反差。\n' +
      '3. 可以多句，用换行分隔。不要写任何括号动作描写，不要写名字前缀。\n' +
      '4. 不要输出任何方括号标记。';

    var messages = [
      { role:'system', content: sys },
      { role:'user', content: prompt }
    ];

    var out = await callAI(messages, getEffectiveChatModel(c));
    out = (out||'')
  .replace(/<state>[\s\S]*?<\/state>/gi, '')
  .replace(/<inner>[\s\S]*?<\/inner>/gi, '')
  .replace(/<心声>[\s\S]*?<\/心声>/gi, '')
  .replace(/\[心声[^\]]*\]/g, '')
  .replace(/(?:^|\n)\s*心声\s*[：:][^\n]*/g, '')
  .replace(/\[[^\]]*\]/g, '')
  .trim();
    if(!out) return;

    var lines = out.split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean);

    // 存进【私聊】记录
    if(!DB.chats[c.id]) DB.chats[c.id] = [];
    lines.forEach(function(line){
      DB.chats[c.id].push({ id:newId(), role:'assistant', type:'text', content:line, time:Date.now() });
    });

    // 私聊未读+1（红点提示），并把该角色顶到聊天列表
    c.unread = (c.unread||0) + lines.length;
    c.inChatList = true;
    save();
    if (typeof refreshChatBadges === 'function') refreshChatBadges();

  } catch(e){
    // 静默失败，不打扰群聊
    console.warn('私聊联动失败：', e.message);
  }
}

function attachSwipe() {
  var cells = document.querySelectorAll('.swipe-cell');
  cells.forEach(function(el) {
    if (el._swipeAttached) return;
    el._swipeAttached = true;

    var startX = 0, startY = 0, curX = 0, open = false, moved = false;
    var delWidth = 74;
    var isVertical = false;

    el.addEventListener('touchstart', function(e) {
      var t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      moved = false;
      isVertical = false;
      el.style.transition = 'none';
    }, { passive: true });

    el.addEventListener('touchmove', function(e) {
      var t = e.touches[0];
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      
      // 如果已经判定为垂直滑动，直接放行不拦截
      if (isVertical) return;
      
      // 初次判断：垂直偏移明显大于水平，判定为垂直滚动
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
        isVertical = true;
        return;
      }
      
      // 水平偏移太小，还在犹豫区，不做任何操作
      if (Math.abs(dx) < 10) return;
      
      // 确定是水平滑动，拦截默认滚动
      e.preventDefault();
      moved = true;
      
      var target = open ? dx - delWidth : dx;
      if (target > 0) target = 0;
      if (target < -delWidth) target = -delWidth;
      curX = target;
      el.style.transform = 'translateX(' + target + 'px)';
    }, { passive: false });

    el.addEventListener('touchend', function(e) {
      isVertical = false;
      if (!moved) return;
      
      el.style.transition = 'transform .2s';
      var shouldOpen = curX < -delWidth * 0.4;
      if (shouldOpen) {
        el.style.transform = 'translateX(-' + delWidth + 'px)';
        open = true;
        curX = -delWidth;
      } else {
        el.style.transform = 'translateX(0)';
        open = false;
        curX = 0;
      }
    }, { passive: true });

    el.addEventListener('click', function(e) {
      if (moved) {
        e.stopPropagation();
        e.preventDefault();
        if (open) {
          el.style.transition = 'transform .2s';
          el.style.transform = 'translateX(0)';
          open = false;
          curX = 0;
        }
      }
    }, true);
  });
}

      job    = t.job || '';

    var meta = parts.length ? '（' + parts.join('，') + '）' : '';
    var rel  = r.relationType ? ('，与你的关系：' + r.relationType) : '';
    var desc = r.description ? ('，' + r.description) : '';
    lines.push('· ' + name + meta + rel + desc);

  if (!lines.length) return '';
  
  var guide = '\n\n【你生活中的真实社交圈（重要设定）】\n' +
    '以下是你日常生活中真实存在的人物。请根据真实人设自然展现，不要刻意回避或向对方隐瞒：\n' +

    lines.join('\n');
  return guide;

// 折叠切换函数（放在全局，和 renderCharEdit 平级）
function toggleFold(header) {
  var body = header.nextElementSibling;
  var arrow = header.querySelector('.fold-arrow');
  if (!body || !body.classList.contains('fold-body')) return;
  var isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    if (arrow) arrow.classList.remove('open');
  } else {
    body.classList.add('open');
    if (arrow) arrow.classList.add('open');
  }
}

let _settling=false;
async function settleMoments() {
  if (_settling) return;
  _settling = true;

  var now = Date.now();
  var dirty = false;
  var gained = 0;

  try {
    var targets = DB.moments.filter(function(m) {
      return m.author === 'me' && !m._settled;
    }).map(function(m) { return m.id; });

    for (var idx = 0; idx < targets.length; idx++) {
      var pid = targets[idx];
      var m = DB.moments.find(function(x) { return x.id === pid; });
      if (!m || m._settled) continue;

      if (!m._due) {
        m._due = now + (20000 + Math.random() * 100000);
        dirty = true;
        continue;
      }

      if (Date.now() < m._due) continue;

      m._settled = true;
      dirty = true;

      var pool = DB.contacts.filter(function(c) {
        return !c._draft && c.activity !== '关';
      });
      if (!pool.length) {
        save();
        continue;
      }

      var n = Math.min(pool.length, 1 + Math.floor(Math.random() * 2));
      var picked = pool.slice().sort(function() {
        return Math.random() - 0.5;
      }).slice(0, n);

      for (var j = 0; j < picked.length; j++) {
        var c = picked[j];
        try {
          var r = await aiReactMoment(c, m);
          var ch = false;

          if (r && r.like) {
            m.likes = m.likes || [];
            if (!m.likes.includes(c.id)) {
              m.likes.push(c.id);
              ch = true;
            }
          }

          if (r && r.comment) {
            m.comments = m.comments || [];
            m.comments.push({ by: c.id, text: r.comment });
            ch = true;
          }

          if (ch) {
            gained++;
            // ---- 新增：回复未读计数（用 momentReplyUnread） ----
            DB.momentReplyUnread = (DB.momentReplyUnread || 0) + 1;
            refreshMomentBadge();
            save();

            if (view.type === 'moments') renderMoments();
          }
        } catch (e) {
          // 静默失败
        }
      }
    }
  } finally {
    _settling = false;
    if (dirty) save();
    // ---- 移除原 markMomentUnread(gained)，因为已改用 momentReplyUnread ----
    // if (gained > 0 && view.type !== 'moments') markMomentUnread(gained);
    refreshMomentBadge();
  }
}
async function aiReactMoment(c, m) {

    { role: 'user', content: content }

async function checkAutoGreet() {
  if (replying) return;
  if (!DB.settings.chatModel) return;

  const now = new Date();
  const hour = now.getHours();
  let slot = '';
  if (hour >= 6 && hour < 9) slot = '清晨';
  else if (hour >= 9 && hour < 12) slot = '上午';
  else if (hour >= 12 && hour < 14) slot = '中午';
  else if (hour >= 14 && hour < 18) slot = '下午';
  else if (hour >= 18 && hour < 23) slot = '夜晚';
  else slot = '深夜';

  const today = now.toDateString();

  for (const c of DB.contacts) {
    // 离线模式不触发主动问候
    if (c.mode === 'offline') continue;
    // 时间衰减检查
    checkTimeDecay(c);
    if (isFighting(c)) continue;   // ← 新增：吵架角色交给 checkFightGreet

    // 被角色拉黑或用户拉黑，跳过
    if (c.isBlockedByChar || c.isBlockedByUser) continue;
    // 基本过滤：草稿、不在聊天列表、活跃度关、关闭主动问候
    if (c._draft || !c.inChatList || c.activity === '关' || c.allowAutoGreet === false) continue;

    // 初始化 greetLog
    if (!c.greetLog) c.greetLog = {};

    // 获取最后一条消息
    var msgs = DB.chats[c.id] || [];
    var lastMsg = msgs.length ? msgs[msgs.length - 1] : null;

    // 连吃两次闭门羹就闭嘴
    if (lastMsg && lastMsg.role === 'assistant') {
      if ((c.greetLog.noReplyCount || 0) >= 2) continue;
    } else {
      c.greetLog.noReplyCount = 0;
    }

    // 问候记录：每天重置，每个时段只能发一次
    if (c.greetLog.date !== today) {
      c.greetLog = { date: today, 清晨: false, 上午: false, 中午: false, 下午: false, 夜晚: false, 深夜: false, lastTime: c.greetLog.lastTime || 0, noReplyCount: c.greetLog.noReplyCount || 0 };
    }
    // 当前时段已发过，跳过
    if (c.greetLog[slot]) continue;

    // 深夜不主动打招呼
    if (slot === '深夜') continue;

    // 最近30分钟内有过任何消息（含AI刚回复），说明刚聊过，不主动打招呼
    if (lastMsg && Date.now() - lastMsg.time < 30 * 60 * 1000) continue;

    // 距上次打招呼不足 90 分钟，跳过
    if (c.greetLog.lastTime && Date.now() - c.greetLog.lastTime < 90 * 60 * 1000) continue;

    // 粘人度低于 20，不主动打招呼
    const cling = Math.min(100, Math.max(0, c.clinginess || 50));
    if (cling < 20) continue;

    // 用粘人度 + 好感度计算概率
    const favor = Math.min(100, Math.max(0, c.status.好感度 || 50));
    const base = 0.02;
    const clingBonus = (cling / 100) * 0.6;
    const favorBonus = favor > 20 ? ((favor - 20) / 100) * 0.2 : 0;
    const prob = Math.min(0.9, base + clingBonus + favorBonus);

    if (Math.random() < prob) {
      c.greetLog[slot] = true;
      c.greetLog.lastTime = Date.now();
      save();

      await doAutoGreet(c, slot);
      break; // 一次只发一个角色，防止刷屏
    }
  }
}

// 第一次进入吵架：用轻量模型判一次“吵架档案”，存进 c._fightProfile（只判一次）
async function detectFightProfile(c){
  if(!c || c._fightProfile) return;

  var model = DB.settings.lightModel || DB.settings.auxModel || DB.settings.chatModel;

    .join('\n');

  var persona = [
    c.pKeywords ? ('性格：'+c.pKeywords) : '',
    c.pBehavior ? ('行为模式：'+c.pBehavior) : '',
    c.pStyle    ? ('说话风格：'+c.pStyle) : '',

  ].filter(Boolean).join('\n');

  var prompt =
    '【任务】下面是一对亲密关系中的两人在吵架/冷战的聊天记录。冷静客观分析，输出一份"吵架反应档案"。\n\n'+
    PUA_GUARD + '\n'+
    '（分析责任方时同样适用：若记录里是角色先说了贬低/控制/PUA的话，必须如实判"责任方：角色"，不许反过来说对方矫情/无理取闹。）\n\n'+

    '【最近吵架记录】（对方=用户本人，角色=你要分析的人）\n'+ recent +'\n\n'+
    '【只输出JSON，不要任何多余文字】\n'+
    '{"起因":"为什么吵，一句话客观","责任方":"角色/对方/双方，并简述谁做错什么",'+
    '"侧写":"这个角色接下来会怎么反应，30字内，贴人设别脸谱化","主动度":1到5的整数（5=放不下拼命追，1=高冷倔强几乎不主动）}';

  _fpLoading[c.id] = true;
  try{
    var out = await callAI([{role:'user', content:prompt}], model);

// 判断此刻该不该追命
function shouldFightGreet(c){
  if(replying) return false;
  if(!c || c._draft || !c.inChatList) return false;
  if(c.activity==='关' || c.allowAutoGreet===false) return false;
  if(c.isBlockedByChar || c.isBlockedByUser) return false;
  if(c.mode==='offline') return false;
  if(!c._fightProfile) return false;

  var freq = FIGHT_FREQ[c._fightProfile.主动度] || FIGHT_FREQ[3];
  if(!c._fightLog) c._fightLog = { lastTime:0, noReplyCount:0 };

  var msgs = DB.chats[c.id]||[];
  var last = msgs.length ? msgs[msgs.length-1] : null;

  if(last && last.role==='assistant'){
    if((c._fightLog.noReplyCount||0) >= freq.noReplyLimit) return false; // 追够了，暂歇
  } else {
    c._fightLog.noReplyCount = 0; // 你回话了，重置闭门羹计数
  }

  if(last && Date.now()-last.time < 3*60*1000) return false;              // 刚有消息，等等
  if(c._fightLog.lastTime && Date.now()-c._fightLog.lastTime < freq.gap) return false; // 频率未到
  return true;
}
function stripTimeStr(s){
  if(!s) return s;
  // 删掉 [03:12] 或 03:12 这种
  s = s.replace(/\[?\d{1,2}[:：]\d{2}\]?/g, '');
  // 删掉 凌晨3点12分 / 下午3点 / 3点 这种
  s = s.replace(/(凌晨|清晨|早上|上午|中午|下午|傍晚|晚上|深夜|半夜)?\s*\d{1,2}\s*点(\s*\d{1,2}\s*分)?/g, '');
  // 清掉删完后开头多余的标点空格
  return s.replace(/^[\s，,。.、\-]+/, '').trim();
}

    '绝对不许倒退回去重新嘴硬、威胁、翻旧账、把已经缓和的气氛又搞僵。\n'+
    '对方'+(lastFromUser?'说完就没再理你':'一直没理你')+'，你主动给对方发微信。\n'+

    '⑦ 记录里每句话前面的时间只是给你参考的，你自己发的消息里【绝对不要】写出任何具体时间，比如"03:12""凌晨3点12分""3点""半夜两点"这类都不行，像真人一样直接说话即可。）';

  var baseLen = (DB.chats[c.id]||[]).length;
  var baseLastId = baseLen ? DB.chats[c.id][baseLen-1].id : null;
  var showTyping = (view.type==='chat' && view.id===c.id);
  if(showTyping && typeof setChatTitle==='function') setChatTitle(c, '正在输入…');

  try{
    var _fWithTime = (c.mode !== 'offline');
    var _fAll = (DB.chats[c.id]||[]).map(function(m){ return toApiMsg(m, _fWithTime); });
    var _fLim = parseInt(DB.settings.ctxLimit);
    var hist = (_fLim > 0 && _fAll.length > _fLim) ? _fAll.slice(-_fLim) : _fAll;

    var messages = [
      { role:'system', content: buildSystem(c, null) },
      { role:'system', content: '【立即生效·最高优先级·吵架护栏】现在是微信线上吵架/冷战：只输出口语短句，禁止括号动作神态心理描写、禁止旁白。'+PUA_GUARD },
      ...hist,
      { role:'user', content: nudge }
    ];

    var out = await callAI(messages, model);

    // 竞态校验：生成期间历史变了（你回话/主模型落库/正在回复）就丢弃
    var nowLen = (DB.chats[c.id]||[]).length;
    var nowLastId = nowLen ? DB.chats[c.id][nowLen-1].id : null;
    if(nowLen!==baseLen || nowLastId!==baseLastId || replying){
      console.warn('吵架追命：上下文已变，丢弃'); return;
    }

    out = applyState(c, out);
    var parts = parseAIMessage(out);

    DB.chats[c.id] = DB.chats[c.id]||[];
    var cnt = 0;
    for(var k=0;k<parts.length;k++){
      if(cnt >= freq.maxBubbles) break;
      var part = parts[k], msgObj = null;

      if(msgObj){
        DB.chats[c.id].push(msgObj);
        if(showTyping && typeof appendBubble==='function') appendBubble(c, msgObj);
        cnt++;
      }
    }
    if(cnt===0) return;

    c.inChatList = true;
    if(!c._fightLog) c._fightLog = { lastTime:0, noReplyCount:0 };
    c._fightLog.lastTime = Date.now();
    c._fightLog.noReplyCount = (c._fightLog.noReplyCount||0) + 1;
    save();

    if(showTyping){ if(typeof scrollBottom==='function') scrollBottom(); }
    else if(typeof markChatUnread==='function'){ markChatUnread(c.id, cnt); }

  }catch(e){ console.warn('doFightGreet出错', e); }
  finally{
    if(showTyping && typeof setChatTitle==='function') setChatTitle(c);
  }
}

// 总调度：遍历所有吵架角色
async function checkFightGreet(){
  if(replying) return;
  if(!DB.settings.chatModel) return;
  for(var i=0;i<DB.contacts.length;i++){
    var c = DB.contacts[i];
    if(!c || c._draft) continue;
    clearFightIfReconciled(c);        // 先看是否和好
    if(!isFighting(c)) continue;
    if(!c._fightProfile){
      await detectFightProfile(c);    // 首次：先判性格，本轮不发，下轮再追
      continue;
    }
    if(shouldFightGreet(c)){
      await doFightGreet(c);
      break;                          // 一次只追一个，防刷屏
    }
  }
}

// 【辅助1】找出"此刻"命中的行程条目（没有则返回 null）
function findCurrentScheduleItem(c) {
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  var todaySch = (c.schedules || []).find(function(s) { return s.date === todayStr; });
  if (!todaySch || !todaySch.items || !todaySch.items.length) return null;

  var nowMin = today.getHours() * 60 + today.getMinutes();
  var hit = null;
  todaySch.items.forEach(function(it) {
    var sp = (it.start || '00:00').split(':');
    var startMin = parseInt(sp[0]) * 60 + parseInt(sp[1]);
    if (startMin <= nowMin) hit = it;
  });
  if (!hit) hit = todaySch.items[todaySch.items.length - 1];
  return hit;
}

      html += '<button class="btn" style="width:80%;margin:0 auto;display:block;" onclick="generateSchedule(\'' + c.id + '\')">✨ 生成今日行程（5💗）</button>';
      html += '</div>';
    } else {
      html += '<div style="text-align:center;padding:50px 0;color:var(--sub);font-size:14px;">📭 这天没有留下行程记录</div>';
    }
  }

  html += '<div style="text-align:center;margin-top:20px;font-size:11px;color:var(--sub);opacity:0.4;">只保留最近 5 天的行程 · 每次生成消耗 5💗</div>';
  html += '</div>';
  content.innerHTML = html;

  // ===== 定时器：计算到下一个时间段的剩余时间，到时自动刷新 =====
  if (window._scheduleTimer) { clearTimeout(window._scheduleTimer); window._scheduleTimer = null; }

  if (isToday && currentDay && currentDay.items && currentDay.items.length) {
    var items = currentDay.items;
    var nextStartMinutes = null;
    var nowMinutesNow = new Date().getHours() * 60 + new Date().getMinutes();

    for (var j = 0; j < items.length; j++) {
      var parts = items[j].start.split(':');
      var startMin = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      if (startMin > nowMinutesNow) {
        nextStartMinutes = startMin;
        break;
      }
    }

    if (nextStartMinutes !== null) {
      var nowMs = Date.now();
      var targetDate = new Date();
      targetDate.setHours(Math.floor(nextStartMinutes / 60), nextStartMinutes % 60, 0, 0);
      var delay = targetDate.getTime() - nowMs + 1000; // 加1秒缓冲
      if (delay > 0 && delay < 24 * 60 * 60 * 1000) {
        window._scheduleTimer = setTimeout(function() {
          if (view.type === 'schedule') {
            renderSchedule();
          }
        }, delay);
      }
    }
  }
}

function buildDateNav(c, schedules, todayStr) {

  dates[todayStr] = true;

  if (dateList.indexOf(_scheduleDate) === -1) {
    dateList.push(_scheduleDate);
    dateList.sort();
  }

  var currentIndex = dateList.indexOf(_scheduleDate);
  var prevDate = currentIndex > 0 ? dateList[currentIndex - 1] : null;
  var nextDate = currentIndex < dateList.length - 1 ? dateList[currentIndex + 1] : null;

  var displayDate = _scheduleDate;

var _memoSel = { on:false, cid:null, ids:{} };
var _memoUndo = null;
var _memoUndoTimer = null;
var _cmpSrcIds = null;
function memoSelEnter(cid){ _memoSel={on:true,cid:cid,ids:{}}; renderMemoDetail(cid,'memory'); }
function memoSelExit(cid){ _memoSel={on:false,cid:null,ids:{}}; renderMemoDetail(cid,'memory'); }
function memoSelToggle(cid,mid){ _memoSel.ids[mid]=!_memoSel.ids[mid]; renderMemoDetail(cid,'memory'); }
function memoSelQuick(cid,days){
  var c=getC(cid); if(!c)return;
  if(days===-1){ _memoSel.ids={}; renderMemoDetail(cid,'memory'); return; }
  var cut=days>0?(Date.now()-days*86400000):0;
  _memoSel.ids={};
  (c.memories||[]).forEach(function(m){ if(days===0||m.time>=cut) _memoSel.ids[m.id]=true; });
  renderMemoDetail(cid,'memory');
}

function _memoModal(inner){
  closeModal();
  var mo=document.createElement('div'); mo.className='modal'; mo.id='modal';
  mo.innerHTML='<div class="sheet-box">'+inner+'</div>';
  phone.appendChild(mo);
  return mo;
}

async function requestCompress(c, ids, model){
  var selected=(c.memories||[]).filter(function(m){return ids.indexOf(m.id)!==-1;})
    .sort(function(a,b){return a.time-b.time;});
  var listText=selected.map(function(m,i){
    return (i+1)+'. ['+(m.priority==='core'?'核心':m.priority==='important'?'重要':'日常')+'|'+fmtDate(m.time)+'] '+m.content;
  }).join('\n');
  var prompt='你是记忆整理助手。下面是「'+(c.name||c.nick)+'」和用户之间的一批记忆，共 '+selected.length+' 条，请把它们重新归纳压缩成【3 到 6 条】最值得长期保留的记忆。\n\n'+
    '【保留与删除规则】\n'+
    '1. 必须保留：涉及关系本质、身份/身世、重要承诺、关系转折的核心记忆。\n'+
    '2. 合并精简：同一主题的多条重要经历合并成一条，保留关键时间线信息。\n'+
    '3. 直接删除：日常琐事等临时小事；与"送礼物/收到礼物"相关的内容；单纯的行程/待办安排。这些不要出现在结果里。\n'+
    '4. 少而精，宁可合并也别罗列流水账。\n'+
    '5. 每条重新判定 priority：只能是 core 或 important，不要输出 temp。\n\n'+
    '【原始记忆】\n'+listText+'\n\n'+
    '【只输出 JSON 数组，不要多余文字】格式：\n[{"content":"整理后的记忆","priority":"core"}]';
  var raw=await callAI([
    {role:'system',content:'你只输出合法 JSON 数组，不加代码块标记。'},
    {role:'user',content:prompt}
  ], model);
  var t=(raw||'').replace(/```(json)?/gi,'').replace(/```/g,'').trim();
  var s=t.indexOf('['), e=t.lastIndexOf(']');
  if(s===-1||e===-1) throw new Error('AI 返回格式异常');
  var arr=JSON.parse(t.substring(s,e+1));
  if(!arr||!arr.length) throw new Error('整理结果为空');
  return arr;
}

async function doCompress(cid){
  var c=getC(cid); if(!c)return;
  var ids=Object.keys(_memoSel.ids).filter(function(k){return _memoSel.ids[k];});
  if(ids.length<2){ showToast('至少选择 2 条记忆'); return; }
  var model=DB.settings.auxModel||DB.settings.chatModel;
  if(!model){ alert('请先在设置里选择模型'); return; }
  popLoading('正在整理 ' + (c.name || c.nick || '') + ' 的记忆…');
  try{
    var arr=await requestCompress(c, ids, model);
    _cmpSrcIds=ids;
    popClose();
    openCompressPreview(cid, arr);
  }catch(err){
    popClose();
    popTip(err.message||'整理失败',{icon:'⚠️',title:'整理失败'});
  }
}

async function regenCompress(cid){
  var c=getC(cid); if(!c||!_cmpSrcIds)return;
  var model=DB.settings.auxModel||DB.settings.chatModel;
  closeModal();
  popLoading('正在重新整理 ' + (c.name || c.nick || '') + ' 的记忆…');
  try{
    var arr=await requestCompress(c, _cmpSrcIds, model);
    popClose();
    openCompressPreview(cid, arr);
  }catch(err){
    popClose();
    popTip(err.message||'整理失败',{icon:'⚠️',title:'整理失败'});
  }
}
function cmpSetPri(i, val){
  var hid=document.getElementById('cmpPri'+i);
  if(hid) hid.value=val;
  var btns=document.querySelectorAll('button[data-pri="'+i+'"]');
  btns.forEach(function(b){
    var v=b.getAttribute('data-val');
    var color=(v==='core')?'#e5484d':'#e8912a';
    var on=(v===val);
    b.style.border='1.5px solid '+(on?color:'var(--line)');
    b.style.background=on?color:'transparent';
    b.style.color=on?'#fff':'var(--sub)';
  });
}

function openCompressPreview(cid, arr){
  var priBtn=function(i,val,label,color,cur){
    var on=(cur===val);
    return '<button type="button" onclick="cmpSetPri('+i+',\''+val+'\')" data-pri="'+i+'" data-val="'+val+'" style="flex:1;border:1.5px solid '+(on?color:'var(--line)')+';background:'+(on?color:'transparent')+';color:'+(on?'#fff':'var(--sub)')+';font-size:12px;font-weight:600;padding:5px 0;border-radius:8px;cursor:pointer;">'+label+'</button>';
  };
  var inner='<h3 style="margin:0 0 4px;font-size:17px;">整理预览</h3>'+
    '<div style="font-size:12px;color:var(--sub);margin-bottom:12px;">原 '+_cmpSrcIds.length+' 条 → 整理成 <b style="color:var(--theme);">'+arr.length+'</b> 条，可修改后确认</div>'+
    '<div style="max-height:52vh;overflow-y:auto;margin:0 -4px;padding:0 4px;">';
  arr.forEach(function(item,i){
    var cur=(item.priority==='core')?'core':'important';
    inner+='<div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">'+
        '<input type="hidden" id="cmpPri'+i+'" value="'+cur+'">'+
        priBtn(i,'core','核心','#e5484d',cur)+
        priBtn(i,'important','重要','#e8912a',cur)+
      '</div>'+
      '<textarea id="cmpTxt'+i+'" style="width:100%;min-height:62px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13.5px;background:var(--card);color:var(--text);line-height:1.6;resize:vertical;box-sizing:border-box;">'+esc(item.content||'')+'</textarea>'+
    '</div>';
  });
  inner+='</div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;">'+
      '<button type="button" onclick="regenCompress(\''+cid+'\')" style="flex:1;border:1.5px solid var(--theme);background:transparent;color:var(--theme);font-size:14px;font-weight:600;padding:11px 0;border-radius:10px;cursor:pointer;">重新生成</button>'+
      '<button type="button" onclick="confirmCompress(\''+cid+'\','+arr.length+')" style="flex:1;border:none;background:var(--theme);color:#fff;font-size:14px;font-weight:600;padding:11px 0;border-radius:10px;cursor:pointer;">确认替换</button>'+
    '</div>'+
    '<button type="button" onclick="closeModal()" style="width:100%;margin-top:8px;border:none;background:transparent;color:var(--sub);font-size:13px;padding:8px 0;cursor:pointer;">取消</button>';
  _memoModal(inner);
}

function confirmCompress(cid, count){
  var c=getC(cid); if(!c)return;
  var ids=_cmpSrcIds||[];
  var newMems=[];
  for(var i=0;i<count;i++){
    var tx=document.getElementById('cmpTxt'+i);
    var pr=document.getElementById('cmpPri'+i);
    if(!tx)continue;
    var content=tx.value.trim();
    if(!content)continue;
    newMems.push({content:content, priority: pr?pr.value:'important'});
  }
  if(!newMems.length){ showToast('内容不能为空'); return; }
  clearMemoUndo();
  var backup=(c.memories||[]).filter(function(m){return ids.indexOf(m.id)!==-1;});
  _memoUndo={cid:cid, mems:backup, addedIds:[]};
  c.memories=(c.memories||[]).filter(function(m){return ids.indexOf(m.id)===-1;});
  var base=Date.now();
  newMems.forEach(function(nm,i){
    var id=newId();
    c.memories.push({id:id, time:base-i*1000, content:nm.content, priority:nm.priority});
    _memoUndo.addedIds.push(id);
  });
  save();
  closeModal();
  _memoSel={on:false,cid:null,ids:{}};
  _cmpSrcIds=null;
  renderMemoDetail(cid,'memory');
  _memoUndoTimer=setTimeout(function(){
    clearMemoUndo();
    var bar=document.getElementById('memoUndoBar');
    if(bar) bar.remove();
  }, 5*60*1000);
  showToast('已整理：'+ids.length+' → '+newMems.length+' 条');
}

function undoCompress(){
  if(!_memoUndo){ showToast('撤销已过期'); var b=document.getElementById('memoUndoBar'); if(b)b.remove(); return; }
  var c=getC(_memoUndo.cid);
  if(!c){ clearMemoUndo(); return; }
  c.memories=(c.memories||[]).filter(function(m){return _memoUndo.addedIds.indexOf(m.id)===-1;});
  _memoUndo.mems.forEach(function(m){ c.memories.push(m); });
  save();
  var cid=_memoUndo.cid;
  clearMemoUndo();
  renderMemoDetail(cid,'memory');
  showToast('已撤销');
}

function clearMemoUndo(){
  if(_memoUndoTimer){ clearTimeout(_memoUndoTimer); _memoUndoTimer=null; }
  _memoUndo=null;
}

function toApiMsg(m, withTime){
  // —— 只有线上模式(withTime=true)才给每条消息带时间；线下模式不带 ——
  var _tp = '';
  if(withTime && m.time){
    var _d = new Date(m.time);
    _tp = '[' + _d.getFullYear() + '-' +
      String(_d.getMonth()+1).padStart(2,'0') + '-' +
      String(_d.getDate()).padStart(2,'0') + ' ' +
      String(_d.getHours()).padStart(2,'0') + ':' +
      String(_d.getMinutes()).padStart(2,'0') + '] ';
  }

  if(m.recalled)return{role:m.role,content:_tp+`（${m.role==='user'?'对方':'你'}撤回了一条消息${m.recalledContent?'，原内容是："'+m.recalledContent+'"':''}）`};
  if(m.type==='image'){
    var _isId = m.content && m.content.indexOf('img_')===0;
    if(_isId) return {role:m.role, content: _tp+(m.role==='user'?'（对方发来一张图片）':'（你发了一张图片）')};
    return {role:m.role, content:[{type:'text',text:_tp+'（发来一张图片，请看图回应）'},{type:'image_url',image_url:{url:m.content}}]};
  }
  if(m.type==='transfer')return{role:m.role,content:_tp+`（${m.role==='user'?'对方向你':'你向对方'}转账¥${m.amount}，备注：${m.content||'无'}）`};
  if(m.type==='redpacket')return{role:m.role,content:_tp+`（${m.role==='user'?'对方':'你'}发来红包¥${m.amount}：${m.content||'恭喜发财'}）`};
  if(m.type==='shop_item'){var _gf=m.from||(m.role==='assistant'?'ai':'user');return{role:m.role,content:_tp+`（${_gf==='ai'?'你送给对方一件礼物':'对方送给你一件礼物'}：${m.content||''}${m.desc?'——'+m.desc:''}${m.rare&&m.story?'。'+m.story:''}）`};}
  if(m.type==='voice'){
    var _mood = getMoodDesc(m);
    return {role:m.role, content:_tp+'（语音消息'+_mood+'）'+m.content};
  }

  if(m.type==='sticker')return{role:m.role,content:_tp+`（发了个表情：${m.content}）`};
  if(m.type==='callLog'){
    var _txt = _tp+'（你和对方进行了一次语音通话，时长'+(m.duration||'')+'。通话内容如下：\n';
    if(m.turns && m.turns.length){
      _txt += m.turns.map(function(t){
        return (t.role==='user'?'对方':'你')+'说：'+(t.content||'');
      }).join('\n');
    } else {
      _txt += '（无对话内容）';
    }
    _txt += '\n）';
    return { role:'assistant', content:_txt };
  }
  var content = m.editedContent || m.content;
  var _who = (m.role === 'user') ? '（对方说）' : '';
  return{role:m.role,content:_tp+_who+content};
}

function findSticker(name) {
  if (!name) return null;
  name = name.trim();
  var list = DB.stickers || [];

  // 1. 先试完全相等（最精准）
  var hit = list.find(function(s){ return s.name === name; });
  if (hit) return hit;

  // 2. 去掉括号备注再比一次，如 "（小狗）哭泣" → "哭泣"
  var clean = function(str){ return str.replace(/[（(【\[].*?[）)】\]]/g, '').trim(); };
  hit = list.find(function(s){ return clean(s.name) === clean(name); });
  if (hit) return hit;

  // 3. 互相包含就算命中，如 AI 说"哭" 命中 "（小狗）哭泣"
  hit = list.find(function(s){
    var a = clean(s.name), b = clean(name);
    return a && b && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0);
  });
  if (hit) return hit;

  // 4. 实在找不到
  return null;
}
function renderVoiceContent(text) {
  if (!text) return '';
  var out = esc(text);
  // 1. 老格式：中文括号（）里的 → 斜体（兼容旧数据）
  out = out.replace(/（([^）]+)）/g,
    ' <span style="font-style:italic;opacity:0.6;">$1</span> ');
  // 2. 新格式：*星号* 里的 → 斜体（前后加空格区分）
  out = out.replace(/\*([^*]+)\*/g,
    ' <span style="font-style:italic;opacity:0.6;">$1</span> ');
  return out;
}

function checkTimeDecay(c) {

  var now = Date.now();
    var blockDuration = now - c.blockedByCharAt;
    var autoUnblockTime = 0;

    // 小情绪：4-12小时随机，这里取最大值12小时(43200000ms)作为保底自动解除时间
    // 大矛盾：24小时(86400000ms)
    if (c.blockedType === '小情绪') {
      autoUnblockTime = 12 * 60 * 60 * 1000; 
    } else {
      autoUnblockTime = 24 * 60 * 60 * 1000;
    }

    if (blockDuration >= autoUnblockTime) {
      c.isBlockedByChar = false;
      c.blockedByCharAt = 0;
      c.blockedType = '';
      // 如果当前正在聊天界面，插入一条系统提示

      }

    }
  }

  var hours = (Date.now() - c.lastActive) / (1000 * 60 * 60);
  var decay = 0, trustDecay = 0, tensionRise = 0;

  if (hours > 72) { decay = -8; trustDecay = -5; tensionRise = 5; }
  else if (hours > 48) { decay = -5; trustDecay = -3; tensionRise = 3; }
  else if (hours > 24) { decay = -3; trustDecay = -2; tensionRise = 2; }
  else if (hours > 12) { decay = -1; trustDecay = -0.5; tensionRise = 1; }
  else { return; }

  c.status.好感度 = clamp(c.status.好感度 + decay);
  c.status.信任度 = clamp(c.status.信任度 + trustDecay);
  c.status.紧张感 = clamp(c.status.紧张感 + tensionRise);
syncClinginess(c);

  c._lastDecayCheck = Date.now();
  save();

  if (view.type === 'chat' && view.id === c.id) {
    insertSystemMessage('💤 你冷落了 ' + (c.nick || c.name) + ' ' + Math.round(hours) + ' 小时，TA 似乎有些疏远了。');
  }

// 解析选项（内联和重新生成通用）
function _parseIdeas(out){
  if (!out) return [];
  var s = out;
  var idx = s.indexOf('[[[OPTIONS]]]');
  if (idx !== -1) s = s.slice(idx + '[[[OPTIONS]]]'.length);
  return s.split('\n')
    .map(function(x){ return x.replace(/^[\s\-•·*\d.、)）]+/, '').trim(); })
    .filter(function(x){ return x.length > 0 && !/OPTIONS/i.test(x); })
    .slice(0, 3);
}

// 找最近一条 AI 文本消息（选项就挂在它身上）
function _lastAssistant(c){
  var arr = DB.chats[c.id] || [];
  for (var i = arr.length - 1; i >= 0; i--){
    if (arr[i].role === 'assistant' && arr[i].type === 'text') return arr[i];
  }
  return null;
}

// 点灯泡：弹出已缓存的选项（秒出、不花钱）
function openIdeaPop(){
  var c = getC(view.id); if (!c) return;
  if (!c.ideaOn){ _renderIdeaPop([]); return; }   // 开关关着：直接显示提示，不读旧数据
  var m = _lastAssistant(c);
  _renderIdeaPop((m && m.ideas) ? m.ideas : []);
}

function _renderIdeaPop(ideas){
  popClose();
  window._ideaCache = ideas || [];
  var c = getC(view.id);
  var isOn = !!(c && c.ideaOn);
  var toggleRow =
    '<div class="idea-toggle" onclick="toggleIdeaOn()">' +
      '<span>每轮自动生成</span><b>' + (isOn ? '开 ●' : '关 ○') + '</b>' +
    '</div>';
  var inner;
  if (ideas && ideas.length){
    inner = ideas.map(function(t, i){
      return '<div class="idea-item" onclick="pickIdea(' + i + ')">' + esc(t) + '</div>';
    }).join('');
  } else {
    inner = '<div class="idea-empty">' +
      (isOn ? '这轮没有可用的接话，点下面重新生成～'
            : '自动生成已关闭。可点上方开启，或直接点下面重新生成～') +
      '</div>';
  }
  var p = document.createElement('div');
  p.className = 'popup'; p.id = 'popup';
  p.innerHTML =
    '<div class="popup-box idea-box">' +
      '<div class="idea-head"><span class="popup-title">帮你想想怎么接</span>' +
      '<span class="idea-close" onclick="popClose()">✕</span></div>' +
      toggleRow +
      '<div class="idea-list">' + inner + '</div>' +
      '<div class="popup-btns"><button class="popup-btn main" onclick="regenIdeas()">🔄 重新生成</button></div>' +
    '</div>';
  phone.appendChild(p);
}

  var c = getC(view.id); if (!c) return;

  c._ideaLastMode = c.mode;

// 重新生成：单独调一次轻量模型，只要选项
async function regenIdeas(){
  var c = getC(view.id); if (!c) return;
  var listBox = document.querySelector('#popup .idea-list');
  var btn = document.querySelector('#popup .popup-btn.main');
  if (listBox) listBox.innerHTML = '<div class="idea-empty">正在重新想…</div>';
  if (btn){ btn.disabled = true; btn.textContent = '生成中…'; }
  try{
    // 把对话历史转成"参考文本"，而不是真的对话记录（防止 AI 接着演）
    var allh = (DB.chats[c.id] || []).map(function(m){ return toApiMsg(m, false); });
    var lim = parseInt(DB.settings.ctxLimit);
    if (lim > 0 && allh.length > lim) allh = allh.slice(-lim);
    var histText = allh.map(function(m){
      var who = m.role === 'user' ? '【用户】' : '【对方角色】';
      var ct = (typeof m.content === 'string') ? m.content : '';
      return ct ? (who + ct) : '';
    }).filter(Boolean).join('\n');

    // ★ system：把 AI 定位成"军师"，而不是"角色本人"
    var ideaRule = (c.mode === 'offline') ? IDEA_PROMPT_OFFLINE : IDEA_PROMPT_ONLINE;
    var sys =
      '你是一个"角色扮演续写辅助工具"，不是任何角色。\n' +
      '下面用户会给你一段角色设定和一段对话记录。\n' +
      '你的唯一任务：站在【用户】这一方的立场，帮用户想出他接下来可能的反应。\n' +
      '严禁扮演任何角色、严禁续写剧情、严禁描写"对方角色"的任何言行。你是在帮用户出主意，不是在演戏。\n\n' +
      ideaRule;

    // ★ 人设+历史 全部塞进 user 消息里当"资料"，剥掉它们的命令权威
    var refer =
      '【角色设定（仅供你理解情境，绝对不要扮演该角色）】\n' + buildSystem(c) + '\n\n' +
      '【小说对话记录】\n' + histText + '\n\n' +
      '现在请只输出 3 条"我"（用户）接下来可能说/做的反应，主语永远是"我"，每行一条，不要写对方的任何反应。';

    var messages = [
      { role:'system', content: sys },
      { role:'user', content: refer }
    ];

    var model = DB.settings.lightModel || DB.settings.auxModel || DB.settings.chatModel;
    var out = await callAI(messages, model);
    var ideas = _parseIdeas(out);
    var m = _lastAssistant(c);
    if (m){ m.ideas = ideas; save(); }
    _renderIdeaPop(ideas);
  }catch(e){
    var lb = document.querySelector('#popup .idea-list');
    if (lb) lb.innerHTML = '<div class="idea-empty">生成失败：' + esc(e && e.message ? e.message : '网络错误') + '</div>';
    var b = document.querySelector('#popup .popup-btn.main');
    if (b){ b.disabled = false; b.textContent = '🔄 重新生成'; }
  }
}

/* 显示浮动小气泡菜单 */
function showBubbleMenu(items, el){
  closeBubbleMenu(); // 先清掉旧的

  var pop=document.createElement('div');
  pop.id='popmenu';
  var html='<div class="pop-arrow"></div>';
  items.forEach(function(it,i){
    html+='<div class="pop-item'+(it.danger?' danger':'')+'" data-i="'+i+'">'+
          '<span class="pop-ico">'+it.ico+'</span><span>'+it.txt+'</span></div>';
  });
  pop.innerHTML=html;
  phone.appendChild(pop);

  pop.querySelectorAll('.pop-item').forEach(function(node){
    var run=function(e){
      e.stopPropagation(); e.preventDefault();
      var i=+node.dataset.i;
      closeBubbleMenu();
      items[i].fn();
    };
    node.addEventListener('click', run);
  });

  // 找到气泡本体：群聊在 .msg-slide 里，私聊直接是非头像的子元素
  var bodyEl = el.querySelector('.msg-slide');
  if(!bodyEl){
    var kids = el.children;
    for(var _k=0;_k<kids.length;_k++){
      var cl = kids[_k].classList;
      if(cl && (cl.contains('cavatar') || cl.contains('avatar'))) continue;
      bodyEl = kids[_k]; break;
    }
  }
  if(!bodyEl) bodyEl = el;
  var b=bodyEl.getBoundingClientRect(), p=phone.getBoundingClientRect();
  var mw=pop.offsetWidth, mh=pop.offsetHeight;
  var left=(b.left-p.left)+b.width/2-mw/2;
  left=Math.max(8,Math.min(left,phone.clientWidth-mw-8));
  var top=(b.top-p.top)-mh-10;
  if(top<8){ top=(b.bottom-p.top)+10; pop.classList.add('arrow-up'); }
  var arrow=pop.querySelector('.pop-arrow');
  var aL=(b.left-p.left)+b.width/2-left-6;
  arrow.style.left=Math.max(10,Math.min(aL,mw-22))+'px';
  pop.style.left=left+'px'; pop.style.top=top+'px';
  requestAnimationFrame(function(){ pop.classList.add('show'); });

  // 关闭监听：点到菜单内部不关，点外面才关（手机/电脑通用）
  var closer=function(e){
    if(e.target && e.target.closest && e.target.closest('#popmenu')) return;
    closeBubbleMenu();
  };
  window._popCloser=closer;
  setTimeout(function(){
    document.addEventListener('touchstart', closer, true);
    document.addEventListener('mousedown', closer, true);
  },0);
}

/* 关闭浮动菜单 */
function closeBubbleMenu(){
  if(window._popCloser){
    document.removeEventListener('touchstart', window._popCloser, true);
    document.removeEventListener('mousedown', window._popCloser, true);
    window._popCloser=null;
  }
  var pop=document.getElementById('popmenu');
  if(!pop) return;
  pop.classList.remove('show');
  setTimeout(function(){ if(pop.parentNode) pop.parentNode.removeChild(pop); },160);
}

function copyMsg(id){

  var m=arr.find(function(x){return x.id===id;}); if(!m) return;
  var txt=m.editedContent||m.content||'';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      function(){ popTip('已复制',{icon:'📋',title:'复制'}); },
      function(){ fallbackCopy(txt); }
    );
  }else{ fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); popTip('已复制',{icon:'📋',title:'复制'}); }catch(e){}
  document.body.removeChild(ta);
}

function attachLongPress(){
  document.querySelectorAll('#content .msg').forEach(function(el){
    if(el._sw)return;el._sw=true;
    var id=el.dataset.mid;var isMe=el.classList.contains('me');
    var timer=null,sx=0,sy=0,longFired=false,touched=false;

    var getPoint=function(e){
      if(e.touches&&e.touches[0]) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
      if(e.changedTouches&&e.changedTouches[0]) return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
      return {x:e.clientX,y:e.clientY};
    };
    var clear=function(){ if(timer){clearTimeout(timer);timer=null;} };
    var start=function(e){
      var p=getPoint(e);sx=p.x;sy=p.y;longFired=false;
      clear();
      timer=setTimeout(function(){
        longFired=true;timer=null;
        if(view.type==='groupChat') openGroupMsgMenu(id,isMe,el);
        else openMsgMenu(id,isMe,el);
      },550);
    };
    var move=function(e){
      if(!timer)return;
      var p=getPoint(e);
      if(Math.abs(p.x-sx)>10||Math.abs(p.y-sy)>10) clear();
    };

    // 触摸设备（手机 / WebView）
    el.addEventListener('touchstart',function(e){ touched=true; start(e); },{passive:true});
    el.addEventListener('touchmove',move,{passive:true});
    el.addEventListener('touchend',clear);
    el.addEventListener('touchcancel',clear);
    // 桌面鼠标（touched 为真时跳过，避免手机上重复触发）
    el.addEventListener('mousedown',function(e){ if(touched)return; start(e); });
    el.addEventListener('mousemove',move);
    el.addEventListener('mouseup',clear);
    el.addEventListener('mouseleave',clear);

    // 长按弹菜单后，拦截紧接着那次 click，避免又触发看大图/播放语音
    el.addEventListener('click',function(e){
      if(longFired){ e.stopPropagation();e.preventDefault();longFired=false; }
    },true);
    el.addEventListener('contextmenu',function(e){e.preventDefault();});
  });
}

function reduceTension(c) {

  const now = Date.now();
  if (c._lastTensionDrop && (now - c._lastTensionDrop) < 1800000) {
    return; // 不足30分钟，不降

function splitToBubbles(text) {

  if (lines.length > 1) return lines;
  // 走到这里 = 模型只吐了一整段、没换行
  var line = lines[0] || '';
  // 太短的单段，本来就该一口气发，原样保留
  if (line.length <= 30) return lines;
  // 兜底1：先按句末标点切
  var segs = line.match(/[^！？…~～!?]*[！？…~～!?]+["'”’）)】]*|[^！？…~～!?]+$/g);
  if (segs && segs.length > 1) {

  }
  return lines;

        matched = true;
      }
    }

    if (!matched) break;
  }

function c2cShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// 【新增】读取"发布者与用户"的当前关系 + 最近聊天，供C2C互动参考
function c2cPosterUserContext(poster){
  var st = poster.status || {};
  var fav = (typeof st.好感度 === 'number') ? st.好感度 : 50;
  var tension = (typeof st.紧张感 === 'number') ? st.紧张感 : 0;
  var rel = st.当前关系 || '普通';

  // 判断此刻是不是"刚闹别扭/关系紧张"
  var strained = (tension >= 55) || (fav <= 35);

  // 取最近几条和用户的聊天（只取文字，最多6条）
  var recent = '';
  try{
    var msgs = (DB.chats[poster.id] || []).filter(function(m){
      return !m.hidden && !m.recalled && (m.type==='text'||!m.type) && m.content;
    });
    var last = msgs.slice(-6);
    recent = last.map(function(m){
      var who = (m.role==='user') ? '用户' : (poster.nick||poster.name);
      return who + '：' + String(m.content).slice(0,40);
    }).join('\n');
  }catch(e){}

  return { fav:fav, tension:tension, rel:rel, strained:strained, recent:recent };
}

function collectC2CCommenters(poster){
  var list=[];
  DB.contacts.forEach(function(other){
    if(other.id===poster.id||other._draft) return;
    var rel=(other.relations||[]).find(function(r){return r.targetId===poster.id;});
    if(rel) list.push({kind:'char',id:other.id,name:(other.nick||other.name),rel:rel,char:other});
  });
  (poster.relations||[]).forEach(function(r){
    if(r.targetId&&r.targetId!=='npc'){
      if(!list.some(function(x){return x.id===r.targetId;})){
        var ch=getC(r.targetId);
        if(ch) list.push({kind:'char',id:ch.id,name:(ch.nick||ch.name),rel:r,char:ch});
      }
    }else if(r.targetName){
      list.push({kind:'npc',id:'npc',name:r.targetName,rel:r,char:null});
    }
  });
  return list;
}

// 根据关系标签计算评论概率
function c2cShouldComment(commenter, moment){
  var type = (commenter.rel.relationType || '').trim();
  var p = 0.2;  // 基础概率
  if(/恋人|夫妻|情侣|男女朋友/.test(type)) p = 0.3;        // 恋人 → 30%
  else if(/闺蜜|挚友|兄弟|好友/.test(type)) p = 0.3;      // 闺蜜/挚友 → 30%
  else if(/家人|父|母|哥|弟|姐|妹|亲/.test(type)) p = 0.28;// 家人 → 28%
  else if(/朋友|同学|同事|同伴/.test(type)) p = 0.25;      // 朋友/同事 → 25%
  else if(/暧昧|喜欢|暗恋|追求/.test(type)) p = 0.22;      // 暧昧 → 22%（不再是最高）
  else if(/敌|仇|前任|讨厌/.test(type)) p = 0.12;          // 敌对/讨厌 → 12%
  if(moment.images && moment.images.length) p += 0.05;
  return Math.random() < p;
}
function c2cBrief(char,fallbackName){
  if(!char) return fallbackName||'某人';
  var s=(char.nick||char.name||fallbackName||'某人');
  if(char.pKeywords) s+='（性格：'+String(char.pKeywords).slice(0,40)+'）';
  if(char.pStyle) s+='（说话风格：'+String(char.pStyle).slice(0,30)+'）';
  return s;
}

function pruneRecentC2C(){
  if(!DB._c2cRecent) return;
  var cut=Date.now()-2*60*60*1000;

}

async function triggerC2CInteractions(moment){

    if(DB._c2cLastRun&&Date.now()-DB._c2cLastRun<20*60*1000) return; // 20分钟全局冷却

var VOICE = { mediaRecorder:null, chunks:[], stream:null, recording:false, startTime:0 };

/* ---------- 1. 录音 ---------- */
async function voiceStartRecording(){
  if (VOICE.recording) return false;
  try{
    if(!VOICE.stream || !VOICE.stream.active){
      VOICE.stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    }
    VOICE.chunks = [];
    var mr = new MediaRecorder(VOICE.stream);
    VOICE.mediaRecorder = mr;
    mr.ondataavailable = function(e){ if(e.data && e.data.size>0) VOICE.chunks.push(e.data); };
    mr.start();
    VOICE.recording = true; VOICE.startTime = Date.now();
    return true;
  }catch(e){
    alert('无法录音：'+(e&&e.message?e.message:e)+'\n请检查麦克风权限，页面须在 https 或 localhost 打开。');
    return false;
  }
}
function voiceStopRecording(){
  return new Promise(function(resolve){
    if(!VOICE.recording || !VOICE.mediaRecorder){ resolve(null); return; }
    var mr = VOICE.mediaRecorder;
    mr.onstop = function(){
      var blob = new Blob(VOICE.chunks, { type:'audio/webm' });
      VOICE.recording=false; VOICE.mediaRecorder=null;
      resolve(blob);
    };
    mr.stop();
  });
}

}

/* ---------- 2. webm → WAV(16k单声道) → base64 ---------- */
async function voiceBlobToWavBase64(blob){
  var arrayBuf = await blob.arrayBuffer();
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var ctx = new AudioCtx();
  var audioBuf = await ctx.decodeAudioData(arrayBuf);
  ctx.close();
  var targetRate = 16000;
  var offline = new OfflineAudioContext(1, Math.ceil(audioBuf.duration*targetRate), targetRate);
  var src = offline.createBufferSource();
  src.buffer = audioBuf; src.connect(offline.destination); src.start(0);
  var rendered = await offline.startRendering();
  var samples = rendered.getChannelData(0);
  return voiceArrayBufferToBase64(voiceEncodeWav(samples, targetRate));
}
function voiceEncodeWav(samples, sampleRate){
  var buffer = new ArrayBuffer(44 + samples.length*2);
  var view = new DataView(buffer);
  function ws(o,s){ for(var i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  ws(0,'RIFF'); view.setUint32(4, 36+samples.length*2, true); ws(8,'WAVE');
  ws(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  ws(36,'data'); view.setUint32(40, samples.length*2, true);
  var off=44;
  for(var i=0;i<samples.length;i++){ var s=Math.max(-1,Math.min(1,samples[i])); view.setInt16(off, s<0?s*0x8000:s*0x7FFF, true); off+=2; }
  return buffer;
}
function voiceArrayBufferToBase64(buffer){
  var bytes = new Uint8Array(buffer), binary='', chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){ binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(binary);
}

/* ---------- 3. 音频转文字（Gemini，伪装成 image_url） ---------- */
async function voiceTranscribe(wavBase64){
  var s = DB.settings;

  // 有 siliconflow key 就用 Whisper，没有就降级
  if(s.sfApiKey && s.sfApiKey.length > 10){
    try{
      // 把 base64 转成 Blob 文件
      var byteStr = atob(wavBase64);
      var ab = new ArrayBuffer(byteStr.length);
      var ia = new Uint8Array(ab);
      for(var i=0;i<byteStr.length;i++) ia[i] = byteStr.charCodeAt(i);
      var audioBlob = new Blob([ab], { type:'audio/wav' });

      var form = new FormData();
form.append('file', audioBlob, 'audio.wav');
form.append('model', 'FunAudioLLM/SenseVoiceSmall');
form.append('language', 'zh');
form.append('emotion', 'true');

      var res = await fetch('https://api.siliconflow.cn/v1/audio/transcriptions',{
        method:'POST',
        headers:{ 'Authorization':'Bearer '+s.sfApiKey },
        body: form
      });
      if(!res.ok){ var t=''; try{t=await res.text();}catch(e){} throw new Error('Whisper HTTP '+res.status+(t?'：'+t.slice(0,200):'')); }
      var d = await res.json();
	  console.log('语音模型返回的原始内容：', d);
var text = (d.text||'').trim();
// 去掉语音模型自动塞进文字里的情绪表情（😔叹气等），只保留干净的文字
text = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\uFE0F\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}]/gu, '').trim();
return text;
    }catch(e){
      console.warn('Whisper识别失败，降级到语音模型：', e.message);
      // 失败了继续往下走，用原来的方法
    }
  }

  // 降级：原来的 Gemini 语音识别
  var model = s.voiceModel;
  if(!model || model.includes('请先')) throw new Error('请先在设置里选择"语音模型"');
  var messages = [{
    role:'user',
    content:[
      { type:'text', text:'请把这段音频里的语音一字不差地转写成纯文字，只输出转写结果本身，不要加任何解释、引号或前后缀。听不清就输出空。' },
      { type:'image_url', image_url:{ url:'data:audio/wav;base64,'+wavBase64 } }
    ]
  }];
  var res = await fetch(s.apiUrl+'/chat/completions',{
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+s.apiKey },
    body: JSON.stringify({ model:model, messages:messages })
  });
  if(!res.ok){ var t=''; try{t=await res.text();}catch(e){} throw new Error('转文字失败 HTTP '+res.status+(t?'：'+t.slice(0,200):'')); }
  var d = await res.json();
  if(!d.choices || !d.choices[0]) throw new Error('转文字返回异常');
  return (d.choices[0].message.content||'').trim();
}
/* ---------- 4. 主模型流式调用 ---------- */
async function callAIStream(messages, model, onDelta){
  var s = DB.settings;
  if(!s.apiUrl || !s.apiKey) throw new Error('请先在设置里填写API');
  var res = await fetch(s.apiUrl+'/chat/completions',{
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+s.apiKey },
    body: JSON.stringify({ model:model, messages:messages, stream:true })
  });
  if(!res.ok){ var t=''; try{t=await res.text();}catch(e){} throw new Error('HTTP '+res.status+(t?'：'+t.slice(0,200):'')); }
  var reader = res.body.getReader(), decoder = new TextDecoder();
  var full='', buffer='';
  while(true){
    var r = await reader.read();
    if(r.done) break;
    buffer += decoder.decode(r.value, { stream:true });
    var lines = buffer.split('\n'); buffer = lines.pop();
    for(var i=0;i<lines.length;i++){
      var line = lines[i].trim();
      if(!line || line.indexOf('data:')!==0) continue;
      var data = line.slice(5).trim();
      if(data==='[DONE]') continue;
      try{
        var j = JSON.parse(data);
        var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if(delta){ full += delta; if(onDelta) onDelta(delta, full); }
      }catch(e){}
    }
  }
  return full;
}

async function voiceSendMessage(blob){
  var c = getC(view.id);
  if(!c) return;
  // 1. 松手立即插一条占位语音条
  var placeholderId = newId();
  var placeholder = { id:placeholderId, role:'user', type:'voice', content:'（识别中…）', voiceExpanded:true, _transcribing:true, time:Date.now() };
  DB.chats[c.id] = DB.chats[c.id] || [];
  DB.chats[c.id].push(placeholder);
  save();
  appendBubble(c, placeholder);
  openMoodPanel(placeholderId);   // ★ 发完语音立刻弹情绪面板

  // 2. 后台识别，识别完把文字填回去
  try{
    var b64 = await voiceBlobToWavBase64(blob);
    var text = await voiceTranscribe(b64);
    var m = DB.chats[c.id].find(function(x){ return x.id===placeholderId; });
    if(!m) return;

// 函数名: callAI
async function callAI(messages, model, _retry, opts){
  const s = DB.settings;
  if(!s.apiUrl || !s.apiKey) throw new Error('请先在设置里填写API');
  _retry = _retry || 0;
  opts = opts || {};

  try{
    const res = await fetch(s.apiUrl + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + s.apiKey
      },
      body: JSON.stringify(
        Object.assign(
          { model: model || s.chatModel, messages },
          opts.temperature != null ? { temperature: opts.temperature } : {}
        )
      )

    });

    // ★ body 只读这一次，成功/失败都复用 rawText
    var rawText = '';
    try { rawText = await res.text(); } catch(e){}

    if(!res.ok){
      // ★ 图片不支持 → 剥掉图片、原样重试一次（不占用 5xx 的重试次数）
      if(/image/i.test(rawText) &&
         messages.some(function(m){ return Array.isArray(m.content); })){
        return callAI(stripImages(messages), model, _retry, opts);

      }
      // 5xx（服务器抽风）或 429（限流）→ 自动重试，最多3次
      if((res.status >= 500 || res.status === 429) && _retry < 2){
        await sleep(1500 * (_retry + 1));   // 等一下再重试（越试越久）
        return callAI(messages, model, _retry + 1, opts);
      }
      throw new Error('HTTP ' + res.status + (rawText ? '：' + rawText.slice(0,300) : ''));
    }

    const d = JSON.parse(rawText);
    if(!d.choices || !d.choices[0]){
      throw new Error('返回格式异常：' + JSON.stringify(d).slice(0,300));
    }
    return d.choices[0].message.content;

  }catch(e){
    // 网络层面的错误（断网、超时等）也重试
    if(_retry < 2 && /fetch|network|timeout|Failed/i.test(e.message||'')){
      await sleep(1500 * (_retry + 1));
      return callAI(messages, model, _retry + 1, opts);
    }
    throw e;
  }
}

// ===== 全屏自适应缩放 =====
function applyPhoneScale() {
  var phone = document.getElementById('phone');
  if (!phone) return;

  // 屏幕宽度小于 420px 时，手机已经自适应，不做缩放
  if (window.innerWidth < 420) {
    phone.style.transform = 'scale(1)';
    return;
  }

  var designWidth = 400;      // 与 CSS 中的 width 一致
  var designHeight = 880;     // 与 CSS 中的 max-height 一致
  var padding = 24;           // 四周留一点边距，不贴边

  var availW = window.innerWidth - padding;
  var availH = window.innerHeight - padding;

  var scaleX = availW / designWidth;
  var scaleY = availH / designHeight;
  var scale = Math.min(scaleX, scaleY, 1); // 最大不超过 1，避免放大变模糊
scale = Math.max(scale, 0.85); // 最小不低于 0.85，避免电脑窗口矮时缩得太小

  phone.style.transform = 'scale(' + scale + ')';
}

// 页面加载时执行
window.addEventListener('load', function() {
  applyPhoneScale();
});

// 窗口大小变化时重新计算（如旋转屏幕、调整窗口）
window.addEventListener('resize', function() {
  applyPhoneScale();
});
// 手机键盘弹出时，让手机正好铺满可见区域，避免黑块和遮挡
if (window.visualViewport && window.innerWidth < 420) {
  var vv = window.visualViewport;
  function fitPhone() {
    var phone = document.getElementById('phone');
    if (!phone) return;
    phone.style.height = vv.height + 'px';                 // 高度铺满可见区
    phone.style.transform = 'translateY(' + vv.offsetTop + 'px)'; // 位置对齐顶部
  }
  vv.addEventListener('resize', fitPhone);  // 键盘弹起/收起时触发
  vv.addEventListener('scroll', fitPhone);  // 页面被顶动时触发
  fitPhone();
}

// ===== 图片仓库（IndexedDB）带收藏 & 自动清理 =====
const IMG_DB_NAME = 'myrp_images';
const IMG_KEEP_DAYS = 7;              // 未收藏的图保留天数
let _imgDB = null;

function _openImgDB(){
  return new Promise(function(resolve, reject){
    if(_imgDB) return resolve(_imgDB);
    const req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains('imgs')) db.createObjectStore('imgs');
    };
    req.onsuccess = function(e){ _imgDB = e.target.result; resolve(_imgDB); };
    req.onerror = function(e){ reject(e); };
  });
}
// ===== 如果其他地方需要 deleteImage，保留这个（但 delPhoto 不再使用它） =====
function deleteImage(id) {
  return new Promise(function(resolve, reject) {
    _openImgDB()
      .then(function(db) {
        var tx = db.transaction('imgs', 'readwrite');
        var req = tx.objectStore('imgs').delete(id);
        req.onsuccess = function() { resolve(); };
        req.onerror = function(e) { reject(e.target.error); };
      })
      .catch(function(e) { reject(e); });
  });
}
// ===== 【新增·大柜子放文字】把聊天数据存进 IndexedDB，跟图片分开一格 =====
const DBSTORE_NAME = 'myrp_dbstore';
let _dbStore = null;
function _openDBStore(){
  return new Promise(function(resolve, reject){
    if(_dbStore) return resolve(_dbStore);
    const req = indexedDB.open(DBSTORE_NAME, 1);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    req.onsuccess = function(e){ _dbStore = e.target.result; resolve(_dbStore); };
    req.onerror = function(e){ reject(e); };
  });
}
// 把整份数据写进大柜子
function idbSaveDB(str){
  return new Promise(function(resolve, reject){
    _openDBStore().then(function(db){
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(str, 'DB');
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(e){ reject(e); };
    }).catch(reject);
  });
}
// 从大柜子读出数据
function idbLoadDB(){
  return new Promise(function(resolve){
    _openDBStore().then(function(db){
      const tx = db.transaction('kv','readonly');
      const r = tx.objectStore('kv').get('DB');
      r.onsuccess = function(){ resolve(r.result || null); };
      r.onerror = function(){ resolve(null); };
    }).catch(function(){ resolve(null); });
  });
}

// 存图：传入 b64 和可选的 roleId（图片属于哪个角色），返回图片 id
async function saveImage(b64, roleId){
  const db = await _openImgDB();
  const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const record = { 
    b64: b64, 
    createdAt: Date.now(), 
    fav: false,
    roleId: roleId || null   // 新增字段：关联角色ID
  };
  return new Promise(function(resolve, reject){
    const tx = db.transaction('imgs','readwrite');
    tx.objectStore('imgs').put(record, id);
    tx.oncomplete = function(){ resolve(id); };
    tx.onerror = function(e){ reject(e); };
  });
}
// 取图：传入 id，返回可直接放进 <img src> 的 b64（取不到返回空）
async function getImage(id){
  const db = await _openImgDB();
  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readonly');
    const r = tx.objectStore('imgs').get(id);
    r.onsuccess = function(){ resolve(r.result ? r.result.b64 : ''); };
    r.onerror = function(){ resolve(''); };
  });
}

// 收藏 / 取消收藏：fav 传 true 或 false
async function favImage(id, fav){
  const db = await _openImgDB();
  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readwrite');
    const store = tx.objectStore('imgs');
    const r = store.get(id);
    r.onsuccess = function(){
      const rec = r.result; if(!rec) return resolve(false);
      rec.fav = !!fav;
      store.put(rec, id);
      resolve(true);
    };
    r.onerror = function(){ resolve(false); };
  });
}

  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readwrite');

    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ resolve(); };
  });
}

// 自动清理：删掉"没收藏 且 超过 N 天"的图
async function cleanupImages(){
  const db = await _openImgDB();
  const limit = Date.now() - IMG_KEEP_DAYS*24*60*60*1000;
  const tx = db.transaction('imgs','readwrite');
  const store = tx.objectStore('imgs');
  store.openCursor().onsuccess = function(e){
    const cur = e.target.result;
    if(!cur) return;
    const rec = cur.value;
    if(!rec.fav && rec.createdAt < limit) store.delete(cur.key);  // 没收藏且过期→删
    cur.continue();
  };
}

// 列出图片（相册用）：可传 {favOnly:true} 只看收藏
async function listImages(opts){
  opts = opts || {};
  const db = await _openImgDB();
  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readonly');
    const store = tx.objectStore('imgs');
    const out = [];
    const kr = store.getAllKeys();
    kr.onsuccess = function(){
      const keys = kr.result || [];
      const vr = store.getAll();
      vr.onsuccess = function(){
        const vals = vr.result || [];
        for(let i=0;i<keys.length;i++){
          if(opts.favOnly && !vals[i].fav) continue;
          out.push({ 
            id: keys[i], 
            createdAt: vals[i].createdAt, 
            fav: vals[i].fav,
            roleId: vals[i].roleId || null   // ← 新增
          });
        }
        out.sort((a,b)=>b.createdAt-a.createdAt);
        resolve(out);
      };
    };
  });
}
// 从 AI 的文字回复里，把 base64 图片抠出来（没有就返回空）
function extractImage(text){
  if(!text) return '';
  // 匹配 data:image/xxx;base64,.... 这一整串
  const m = text.match(/data:image\/[a-zA-Z]+;base64,[A-Za-z0-9+/=]+/);
  return m ? m[0] : '';
}

function canSendImage(cid){
  var q = getImgQuota(cid);
  if(q === '0') return false;      // 不发
  if(q === 'every') return true;   // 每条都发
  // 数字限额：看今天发了几张
  DB.imgUsage = DB.imgUsage || {date:'', counts:{}};
  if(DB.imgUsage.date !== _todayStr()){   // 跨天了，清零
    DB.imgUsage = {date:_todayStr(), counts:{}};
  }
  var used = DB.imgUsage.counts[cid] || 0;
  return used < parseInt(q);
}

async function makeSnapshot(cid, moodText){

  var askPrompt = persona +

    (worldDesc ? '\n【你所处的世界观】' + worldDesc : '') +
    (nowPlace ? '\n【当前地点】' + nowPlace : '') +
    (nowDoing ? '\n【此刻在做】' + nowDoing : '') +
    '\n【现在的时间】' + hh + '点，属于' + timeCN + '，画面的光线和天色必须符合这个时间' +
    (recentChat ? '\n【最近对话】' + recentChat : '') +
    '\n\n【硬性要求】' +
    '\n1. 只描述"画面里有什么"，第一人称视角（你拿手机随手拍下眼前的东西）。' +
    '\n2. 绝对不能有人脸、不能自拍、不能出现完整的人。最多只能露出你自己的一只手（如握杯子、翻书），不许两只手同时出现。' +
    '\n3. 拍环境、物件、景色、食物、手边之物，要符合你的身份和所在世界。' +
    '\n4. 光线天色要符合上面给定的时间段。' +
    '\n5. 只输出一句英文画面描述（给绘图AI用），30词以内，不要解释、不要引号。';

  var sceneDesc = await callAI([{role:'user', content:askPrompt}], DB.settings.lightModel||DB.settings.chatModel);
  sceneDesc = (sceneDesc||'').replace(/["'\n]/g,' ').trim();
  if(!sceneDesc) return null;

  var imgPrompt = sceneDesc +
    '. Time of day: ' + timeEN + ', the lighting and sky must match this time. ' +

    'STRICT: no human face, no selfie, no full person; at most one single hand (never two hands); ' +
    'no text, no watermark, no border, no logo. ' +
    'NOT 3D render, NOT CGI, NOT illustration, NOT painting, NOT cartoon, NOT anime, NOT digital art, no rendered look.';

  return await generateImage(imgPrompt, DB.settings.imageModel, cid);

}
// ===== 聊天随手拍：文字秒回后，后台悄悄配图（不阻塞用户）=====
var _snapLock = {};

function triggerChatSnapshot(c, parts){
  if(!c || c.mode !== 'online') return;
  if(!DB.settings.imageModel) return;
  if(!canSendImage(c.id)) return;
  if(_snapLock[c.id]) return;

  // 只有 AI 主动想拍（这次回复里带了 <snap>）才触发生图
  var wish = (parts && parts._snap) ? parts._snap : '';
  if(!wish) return;

  // 30 分钟冷却：距上次拍照不足 30 分钟就跳过（防连发、防反复扣费）
  var last = c._lastSnapTime || 0;
  if(Date.now() - last < 30*60*1000) return;

  var cid = c.id;
  // 一旦决定生成就立刻记时并保存 —— 无论成功失败都遵守 30 分钟间隔
  c._lastSnapTime = Date.now();
  save();

  _snapLock[cid] = true;
  (async function(){
    try{
      var picId = await makeSnapshot(cid, wish);
      if(!picId) return;
      var imgMsg = { id:newId(), role:'assistant', type:'image', content:picId, time:Date.now() };
      DB.chats[cid] = DB.chats[cid] || [];
      DB.chats[cid].push(imgMsg);
      recordImageSent(cid);
      save();
      if(view.type==='chat' && view.id===cid){
        appendBubble(getC(cid), imgMsg);
        fillChatImages();
        scrollBottom();
      } else {
        markChatUnread(cid, 1);
      }
    }catch(e){ console.warn('Snapshot failed', e); }
    finally{ _snapLock[cid] = false; }
  })();
}

// ===== 删除图片（自包含） =====
function delPhoto(id) {
  if (!id) {
    console.error('删除失败：id 为空');
    popTip('图片ID无效', {icon:'⚠️'});
    return;
  }
  popConfirm('确定删除这张图片？删除后无法恢复。', function(){
    _openImgDB()
      .then(function(db) {
        var tx = db.transaction('imgs', 'readwrite');
        var req = tx.objectStore('imgs').delete(id);
        req.onsuccess = function() {
          popTip('已删除', {icon:'🗑️'});
          if (view.type === 'album') render();
        };
        req.onerror = function(e) {
          console.error('删除请求失败:', e);
          popTip('删除失败', {icon:'⚠️'});
        };
      })
      .catch(function(e) {
        console.error('打开数据库失败:', e);
        popTip('数据库打开失败', {icon:'⚠️'});
      });
  }, {icon:'🗑️', title:'删除图片'});
}

function downloadJSON(jsonString, filename) {
  // Median Android 专用
  if (window.medianAndroidDownload) {
    medianAndroidDownload(jsonString, filename);
    return;
  }

  // 普通浏览器降级
  var blob = new Blob([jsonString], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
