// ==================== 群聊AI·触发调度 ====================
var groupReplying = false;

function triggerGroupAI(){
  if (groupReplying) return;
  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });
  if(!g) return;
  if(!DB.settings.chatModel){ alert('请先在 设置 里选择模型'); return; }

  // 找出被@的成员
  var msgs = DB.chats[g.id] || [];
  var lastUserMsg = null;
  for(var i=msgs.length-1;i>=0;i--){ if(msgs[i].role==='user'){ lastUserMsg=msgs[i]; break; } }
  var atText = (lastUserMsg && lastUserMsg.type==='text') ? lastUserMsg.content : '';

  // 计算每个成员权重
  var pool = g.members.map(function(cid){
    var c = getC(cid);
    if(!c) return null;

    // 活动度
    var actMap = { '关':0, '低':0.2, '中':0.6, '高':1.0 };
    var wAct = (actMap[c.activity]!==undefined) ? actMap[c.activity] : 0.6;

    // 粘人度 0~100 → 0.2~1.0
    var cling = (c.clinginess===undefined?50:c.clinginess);
    var wCling = 0.2 + (cling/100)*0.8;

    // 好感度 0~100 → 0.2~1.0
    var fav = (c.status && c.status.好感度!==undefined) ? c.status.好感度 : 50;
    var wFav = 0.2 + (fav/100)*0.8;

    // 对"用户"的关系系数
    var relCoef = 1.0;
    var curRel = (c.status && c.status.当前关系) ? c.status.当前关系 : '';
    if(/恋|爱人|喜欢|暧昧/.test(curRel)) relCoef = 1.3;
    else if(/敌|讨厌|仇/.test(curRel)) relCoef = 0.5;

    var weight = wAct * wCling * wFav * relCoef;

    // 被@ +0.5
    var atMe = atText && atText.indexOf('@'+(c.nick||c.name)) >= 0;
    if(atMe) weight += 0.5;

    return { cid:cid, c:c, weight:weight, atMe:!!atMe };
  }).filter(Boolean);

  // 筛选 + 选人
  var candidates = pool.filter(function(p){ return p.weight > 0.1; });
  if(!candidates.length){
    // 保底：选权重最高的1人
    pool.sort(function(a,b){ return b.weight-a.weight; });
    candidates = pool.slice(0,1);
  }

  // 被@的必选；其余按权重比例随机，总共1~3人
  var chosen = [];
  candidates.forEach(function(p){ if(p.atMe) chosen.push(p); });

  var rest = candidates.filter(function(p){ return !p.atMe; });
  // 按权重加随机扰动排序
  rest.sort(function(a,b){ return (b.weight*Math.random()) - (a.weight*Math.random()); });

  var maxSpeakers = 3;
  for(var j=0; j<rest.length && chosen.length<maxSpeakers; j++){
    // 权重越高越可能入选
    var p = rest[j];
    var prob = Math.min(0.9, p.weight);
    if(chosen.length===0 || Math.random() < prob) chosen.push(p);
  }
  if(!chosen.length && candidates.length) chosen.push(candidates[0]);

  // 限制最多3人
  chosen = chosen.slice(0,3);

  groupAISpeak(chosen);

}

// ==================== 群聊→私聊联动：群里没说的话，私聊破功 ====================
async function triggerGroupPrivate(c){
  // 每日上限：每个角色每天最多因群聊触发2次私聊
  var today = new Date().toDateString();
  if (!c._grpPrivDaily || c._grpPrivDaily.date !== today) {

  }
  if (c._grpPrivDaily.count >= 2) return;
  c._grpPrivDaily.count += 1;
  save();

  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });
  var groupName = g ? g.name : '群聊';
  var meName = DB.me.name || '我';

  try {
    // 用私聊的完整人设（buildSystem），保证是"真正的TA"
    var sys = buildSystem(c);
    var recentGroup = g ? buildGroupHistory(g) : '';

    var prompt = '【场景】你刚才在群「' + groupName + '」里和大家聊天，但你此刻对"' + meName +
      '"产生了一种当着群里所有人不方便说出口的情绪（比如吃醋、心动、在意、委屈、想单独跟TA说的话）。\n' +
      '于是你现在**私下单独**给"' + meName + '"发微信，说那句在群里没说出口的话。\n\n' +
      '【刚才的群聊记录】\n' + recentGroup + '\n\n' +
      '【要求】\n' +
      '1. 直接输出你私聊发给TA的消息，口语化、简短、符合你的性格。\n' +
      '2. 内容要呼应刚才群里的情境，体现"当着大家不好说、私下才敢说"的反差。\n' +
      '3. 可以多句，用换行分隔。不要写任何括号动作描写，不要写名字前缀。\n' +
      '4. 不要输出任何方括号标记。';

    var messages = [
      { role:'system', content: sys },
      { role:'user', content: prompt }
    ];

    var out = await callAI(messages, getEffectiveChatModel(c));
    out = (out||'').replace(/<state>[\s\S]*?<\/state>/gi,'').replace(/\[[^\]]*\]/g,'').trim();
    if(!out) return;

    var lines = out.split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean);

    // 存进【私聊】记录
    if(!DB.chats[c.id]) DB.chats[c.id] = [];
    lines.forEach(function(line){
      DB.chats[c.id].push({ id:newId(), role:'assistant', type:'text', content:line, time:Date.now() });
    });

    // 私聊未读+1（红点提示），并把该角色顶到聊天列表
    c.unread = (c.unread||0) + lines.length;
    c.inChatList = true;
    save();
    if (typeof refreshChatBadges === 'function') refreshChatBadges();

  } catch(e){
    // 静默失败，不打扰群聊
    console.warn('私聊联动失败：', e.message);
  }
}

function removeGroupMember(mid){

// 邀请成员（复用建群的勾选）
function openGroupInvite(gid){
  var g = (DB.groups||[]).find(function(x){ return x.id===gid; });
  if(!g) return;
  var avail = DB.contacts.filter(function(c){
    return !c._draft && g.members.indexOf(c.id)<0;
  });
  if(!avail.length){ alert('没有可邀请的角色了'); return; }

  var names = avail.map(function(c,i){ return (i+1)+'. '+(c.nick||c.name); }).join('\n');
  var pick = prompt('输入要邀请的角色编号（多个用逗号隔开）：\n'+names);
  if(pick===null) return;
  var idxs = pick.split(/[,，\s]+/).map(function(s){ return parseInt(s.trim())-1; }).filter(function(n){ return n>=0 && n<avail.length; });
  if(!idxs.length) return;
  idxs.forEach(function(n){
    var cid = avail[n].id;
    if(g.members.indexOf(cid)<0) g.members.push(cid);
  });
  save();
  renderGroupSet();
}

function attachSwipe() {
  var cells = document.querySelectorAll('.swipe-cell');
  cells.forEach(function(el) {
    if (el._swipeAttached) return;
    el._swipeAttached = true;

    var startX = 0, startY = 0, curX = 0, open = false, moved = false;
    var delWidth = 74;
    var isVertical = false;

    el.addEventListener('touchstart', function(e) {
      var t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      moved = false;
      isVertical = false;
      el.style.transition = 'none';
    }, { passive: true });

    el.addEventListener('touchmove', function(e) {
      var t = e.touches[0];
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      
      // 如果已经判定为垂直滑动，直接放行不拦截
      if (isVertical) return;
      
      // 初次判断：垂直偏移明显大于水平，判定为垂直滚动
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
        isVertical = true;
        return;
      }
      
      // 水平偏移太小，还在犹豫区，不做任何操作
      if (Math.abs(dx) < 10) return;
      
      // 确定是水平滑动，拦截默认滚动
      e.preventDefault();
      moved = true;
      
      var target = open ? dx - delWidth : dx;
      if (target > 0) target = 0;
      if (target < -delWidth) target = -delWidth;
      curX = target;
      el.style.transform = 'translateX(' + target + 'px)';
    }, { passive: false });

    el.addEventListener('touchend', function(e) {
      isVertical = false;
      if (!moved) return;
      
      el.style.transition = 'transform .2s';
      var shouldOpen = curX < -delWidth * 0.4;
      if (shouldOpen) {
        el.style.transform = 'translateX(-' + delWidth + 'px)';
        open = true;
        curX = -delWidth;
      } else {
        el.style.transform = 'translateX(0)';
        open = false;
        curX = 0;
      }
    }, { passive: true });

    el.addEventListener('click', function(e) {
      if (moved) {
        e.stopPropagation();
        e.preventDefault();
        if (open) {
          el.style.transition = 'transform .2s';
          el.style.transform = 'translateX(0)';
          open = false;
          curX = 0;
        }
      }
    }, true);
  });
}

function toggleFold(header) {
  var body = header.nextElementSibling;
  var arrow = header.querySelector('.fold-arrow');
  if (!body || !body.classList.contains('fold-body')) return;
  var isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    if (arrow) arrow.classList.remove('open');
  } else {
    body.classList.add('open');
    if (arrow) arrow.classList.add('open');
  }
}

    const cling = Math.min(100, Math.max(0, c.clinginess || 50));
    const favor = Math.min(100, Math.max(0, c.status.好感度 || 50));

    // 基础 10%，粘人度加成 0~60%，好感度加成 0~20%（好感度低于20不加成）
    const base = 0.1;
    const clingBonus = (cling / 100) * 0.6;
    const favorBonus = favor > 20 ? ((favor - 20) / 100) * 0.2 : 0;
    const prob = Math.min(0.9, base + clingBonus + favorBonus);

    if (Math.random() < prob) {
      // ===== 记录日志，准备发送 =====
      c.greetLog[slot] = true;
      c.greetLog.lastTime = Date.now();
      // 碰壁计数+1（如果你回了，上面已经清零；这里发一条就+1，连着两条没回就会触发闭嘴）
      c.greetLog.noReplyCount = (c.greetLog.noReplyCount || 0) + 1;
      save();

      await doAutoGreet(c, slot);
      break; // 一次只发一个角色，防止刷屏
    }
  }
}
async function doAutoGreet(c, slot) {
  // ===== 1. 前置检查 =====
  if (c.isBlockedByChar || c.isBlockedByUser) return;
  const model = DB.settings.lightModel || DB.settings.auxModel || DB.settings.chatModel;
  if (!model) {
    console.warn('自动问候：没有可用模型，跳过');
    return;
  }

  const periodTxt = { '早': '早上', '中': '下午', '晚': '晚上', '深夜': '深夜' }[slot] || '现在';
  const nudge =
    `（现在是${periodTxt}，你主动给对方发微信。要求：\n` +
    `①必须用短句，像真人随手发微信，一次最多1~2句话，绝不长篇大论、不写小作文；\n` +

    `③口语化、自然，符合你的人设与当前作息心情；\n` +
    `④绝对禁止"早上好/晚上好/吃了吗/在吗"这类空洞客套模板。只输出要发的话本身。）`;

  try {
      let c2cHint = '';
    try {
      const _c2c = getC2CContextFor(c.id);

        c2cHint = '\n（另外：你最近在朋友圈有一些互动。如果其中有让你想吐槽、告状、分享或安利给对方的事'
                + '——比如和谁在评论区拌了嘴、被安利/发现了什么好东西、被夸得很开心——'
                + '你可以很自然地借这次消息说给对方听，就像朋友随口聊近况。若没什么特别的就别提。）';
      }
    } catch(e) {}

    // ===== 3. 构建历史 + 系统提示 =====
    const hist = (DB.chats[c.id] || []).slice(-10).map(toApiMsg);
    const messages = [
      { role: 'system', content: buildSystem(c) },
      { role: 'system', content: '【立即生效·最高优先级】现在是微信线上打字聊天：只输出口语短句，句子要短，禁止括号里的动作/神态/心理描写，禁止旁白，禁止长段落。多句用换行分隔，且总共不超过2句。' },
      ...hist,
      { role: 'user', content: nudge + c2cHint }

    ];

    // ===== 4. 调用 AI + 应用状态变化 =====
    let out = await callAI(messages, model);
    out = applyState(c, out);

    // ===== 5. 使用新解析器整段解析（不要自己 split 行） =====
    const parts = parseAIMessage(out);
    if (!parts.length) return;

    // ===== 6. 遍历解析结果，构造消息对象 =====
    DB.chats[c.id] = DB.chats[c.id] || [];
    let cnt = 0;

    for (const part of parts) {
      // ---- 主动问候中忽略的指令 ----
      if (part.type === 'heart') continue;                     // 不弹心声
      if (part.type === 'transfer_accept') continue;
      if (part.type === 'transfer_refund') continue;
      if (part.type === 'block_player') continue;              // 主动问候不拉黑

      let msgObj = null;

      switch (part.type) {
        case 'voice':
          msgObj = {
            id: newId(),
            role: 'assistant',
            type: 'voice',
            content: part.content,
            time: Date.now(),
            voiceExpanded: false
          };
          break;

case 'sticker': {
    const exists = DB.stickers.some(s => s.name === part.content);
    if (exists) {
        msgObj = { id: newId(), role: 'assistant', type: 'sticker', content: part.content, time: Date.now() };
    } else {
        msgObj = null; // 不存在就丢掉
    }
    break;
}
        case 'transfer':
          // 主动问候一般不会发转账，但保留处理（作为 AI 发起的转账）
          msgObj = {
            id: newId(),
            role: 'assistant',
            type: 'transfer',
            from: 'ai',
            amount: part.amount,
            content: part.content || '',
            status: 'pending',
            time: Date.now()
          };
          break;

        case 'text':
          // 普通文本（可能有撤回标记，但主动问候不会主动撤回，忽略 recalled）
          if (part.recalled) {
            // 若真的出现撤回，直接当普通文本显示“撤回了一条消息”？
            // 更合理的是把撤回内容当作普通文本显示（但主动问候极少），我们只发内容。

              msgObj = {

                role: 'assistant',
                type: 'text',
                content: txt.trim(),
                time: Date.now()
              };
            }
          } else if (part.content && part.content.trim()) {
            msgObj = {
              id: newId(),
              role: 'assistant',
              type: 'text',
              content: part.content.trim(),
              time: Date.now()
            };
          }
          break;

        default:
          // 其他类型（如 action）忽略
          break;
      }

      if (msgObj) {
        DB.chats[c.id].push(msgObj);
        // 如果用户正在看这个角色的聊天，实时追加消息，不刷新整个页面
        if (view.type === 'chat' && view.id === c.id) {
          appendBubble(c, msgObj);
        }
        cnt++;
      }
	  }

    if (cnt === 0) return;
    // ★★ 打招呼随手拍（30%概率 + 限额控制）★★
    if (canSendImage(c.id) && Math.random() < 0.15) {

        }
      } catch(e){ console.warn('打招呼配图失败', e); }
    }

    // ===== 7. 更新界面 / 未读 =====
    c.inChatList = true;
    save(); // 一次性保存所有消息

    if (view.type === 'chat' && view.id === c.id) {
      scrollBottom();
    } else {
      markChatUnread(c.id, cnt);
    }
  } catch (e) {
    console.warn('doAutoGreet 出错:', e);
  }
}

// ==================== 监控功能 ====================

// 【辅助1】找出"此刻"命中的行程条目（没有则返回 null）
function findCurrentScheduleItem(c) {
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  var todaySch = (c.schedules || []).find(function(s) { return s.date === todayStr; });
  if (!todaySch || !todaySch.items || !todaySch.items.length) return null;

  var nowMin = today.getHours() * 60 + today.getMinutes();
  var hit = null;
  todaySch.items.forEach(function(it) {
    var sp = (it.start || '00:00').split(':');
    var startMin = parseInt(sp[0]) * 60 + parseInt(sp[1]);
    if (startMin <= nowMin) hit = it;
  });
  if (!hit) hit = todaySch.items[todaySch.items.length - 1];
  return hit;
}

// 【辅助2】取最近聊天记录 + 距上次消息多久
function getRecentChatForWatch(cid) {
  var msgs = (DB.chats && DB.chats[cid]) ? DB.chats[cid] : [];
  var valid = msgs.filter(function(m) { return m && m.role !== 'system'; });
  var recent = valid.slice(-7);

  var lines = recent.map(function(m) {
    var who = (m.role === 'user') ? '用户' : 'TA';
    var body;
    if (m.type === 'text') body = m.content || '';
    else if (m.type === 'voice') body = '[语音]' + (m.content || '');
    else if (m.type === 'image') body = '[图片]';
    else if (m.type === 'sticker') body = '[表情]';
    else if (m.type === 'transfer') body = '[转账 ' + (m.amount || '') + ']';
    else body = m.content || '[消息]';
    if (m.recalled) body = '[撤回了一条消息]';
    return who + '：' + body;
  }).join('\n');

  var last = valid[valid.length - 1];
  var gapMin = last && last.time ? Math.round((Date.now() - last.time) / 60000) : null;

  return { lines: lines || '（最近没有聊天记录）', gapMin: gapMin };
}

// 【辅助3】清理录像：没收藏的最多留 10 条，收藏的永久保留
function trimWatchLogs(c) {
  var starred = c.watchLogs.filter(function(w) { return w.starred; });
  var normal  = c.watchLogs.filter(function(w) { return !w.starred; });
  normal.sort(function(a, b) { return b.time - a.time; });
  if (normal.length > 10) normal = normal.slice(0, 10);
  c.watchLogs = starred.concat(normal).sort(function(a, b) { return b.time - a.time; });
}

    out = out.replace(/```json/gi, '').replace(/```/g, '').trim();

    c.schedules.push({ date: todayStr, items: items });
    c.schedules.sort(function(a, b) { return b.date.localeCompare(a.date); });
    if (c.schedules.length > 5) c.schedules = c.schedules.slice(0, 5);

  var h = String(d.getHours()).padStart(2, '0');

    content: content,

  // 3. 互相包含就算命中，如 AI 说"哭" 命中 "（小狗）哭泣"
  hit = list.find(function(s){
    var a = clean(s.name), b = clean(name);
    return a && b && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0);
  });
  if (hit) return hit;

  // 4. 实在找不到
  return null;
}

function checkTimeDecay(c) {
  if (!c || !c.lastActive) return;
  
  // 【新增】自动解除角色拉黑逻辑
  if (c.isBlockedByChar && c.blockedByCharAt) {
    var now = Date.now();
    var blockDuration = now - c.blockedByCharAt;
    var autoUnblockTime = 0;

    // 小情绪：4-12小时随机，这里取最大值12小时(43200000ms)作为保底自动解除时间
    // 大矛盾：24小时(86400000ms)
    if (c.blockedType === '小情绪') {
      autoUnblockTime = 12 * 60 * 60 * 1000; 
    } else {
      autoUnblockTime = 24 * 60 * 60 * 1000;
    }

    if (blockDuration >= autoUnblockTime) {
      c.isBlockedByChar = false;
      c.blockedByCharAt = 0;
      c.blockedType = '';
      // 如果当前正在聊天界面，插入一条系统提示
      if (view.type === 'chat' && view.id === c.id) {
        insertSystemMessage('🔓 ' + (c.nick || c.name) + ' 气消了，解除了对你的拉黑。');
      }
      save();
    }
  }
  // 【新增结束】

  // 原有的衰减频率限制（每2小时检查一次数值衰减）
  if (c._lastDecayCheck && Date.now() - c._lastDecayCheck < 7200000) return;

  var hours = (Date.now() - c.lastActive) / (1000 * 60 * 60);
  var decay = 0, trustDecay = 0, tensionRise = 0;

  if (hours > 72) { decay = -8; trustDecay = -5; tensionRise = 5; }
  else if (hours > 48) { decay = -5; trustDecay = -3; tensionRise = 3; }
  else if (hours > 24) { decay = -3; trustDecay = -2; tensionRise = 2; }
  else if (hours > 12) { decay = -1; trustDecay = -0.5; tensionRise = 1; }
  else { return; }

  c.status.好感度 = clamp(c.status.好感度 + decay);
  c.status.信任度 = clamp(c.status.信任度 + trustDecay);
  c.status.紧张感 = clamp(c.status.紧张感 + tensionRise);
syncClinginess(c);

  c._lastDecayCheck = Date.now();
  save();

  if (view.type === 'chat' && view.id === c.id) {
    insertSystemMessage('💤 你冷落了 ' + (c.nick || c.name) + ' ' + Math.round(hours) + ' 小时，TA 似乎有些疏远了。');
  }
}

function actBtnClick(){
  var el = document.getElementById('chatInput');

    // 只发送用户消息，不触发 AI
    sendMsg();
  } else {
    // 输入框为空时，点击按钮才让 AI 回复

function onChatKey(e){

    e.preventDefault();

    var text = el ? el.value.trim() : '';

      // 回车只发送消息，不触发 AI
      sendMsg();
    }
  }
}

function pushMy(m){
  var c = getC(view.id);
  if (!c) return;

  m.id = newId();
  m.role = 'user';
  m.time = Date.now();
  
  // 新增：语音消息默认折叠
  if (m.type === 'voice') {
    m.voiceExpanded = false;
  }

  DB.chats[view.id].push(m);
  save();
  appendBubble(c, m);

  // 如果被拉黑，追加拒收提示
  if (c.isBlockedByChar) {
    var rejectMsg = '❌ ' + (c.nick || c.name) + ' 拒收了你的消息';
    var sysM = { id: 'sys_' + Date.now(), role: 'system', type: 'system', content: rejectMsg, time: Date.now() };
    DB.chats[view.id].push(sysM);
    save();
    appendBubble(c, sysM);
  }
  // ✅ 注意：这里不再自动调用 aiReply()
}
function askUnblock(){
  const c = getC(view.id);
  if (!c || !c.isBlockedByChar) return;
  var type = c.blockedType || '大矛盾';
  var cost = type === '小情绪' ? 10 : 50;
  popConfirm('消耗 ' + cost + '💗 解除 ' + (c.nick || c.name) + ' 的拉黑？', function() {
    if (spendHeart(c, cost, '解除 ' + (c.nick || c.name) + ' 的拉黑')) {
      c.isBlockedByChar = false;
      c.blockedByCharAt = 0;
      c.blockedType = '';
      save();
      renderChat();
      popTip('已解除拉黑，可以继续聊天了', { icon: '🔓', title: '解锁成功' });
    }
  }, { icon: '🔒', title: '解除拉黑', ok: '立即解锁', cancel: '算了' });
}

// ===== 统一弹窗系统 =====
function popClose(){var p=document.getElementById('popup');if(p)p.remove();}

// 提示框（替换 alert）
function popTip(msg, opts){
  opts = opts || {};
  popClose();
  var p = document.createElement('div');
  p.className = 'popup';
  p.id = 'popup';
  p.innerHTML = '<div class="popup-box">' +
    (opts.icon ? '<div class="popup-icon">' + opts.icon + '</div>' : '') +
    (opts.title ? '<div class="popup-title">' + esc(opts.title) + '</div>' : '') +
    '<div class="popup-msg">' + esc(msg) + '</div>' +
    '<div class="popup-btns"><button class="popup-btn main" onclick="popClose()">' + (opts.ok || '知道啦') + '</button></div>' +
    '</div>';
  phone.appendChild(p);
}

// 确认框（替换 confirm）：onYes 是点确定后执行的函数
function popConfirm(msg, onYes, opts){
  opts = opts || {};
  popClose();
  window._popYes = onYes;
  var p = document.createElement('div');
  p.className = 'popup';
  p.id = 'popup';
  p.innerHTML = '<div class="popup-box">' +
    (opts.icon ? '<div class="popup-icon">' + opts.icon + '</div>' : '') +
    (opts.title ? '<div class="popup-title">' + esc(opts.title) + '</div>' : '') +
    '<div class="popup-msg">' + esc(msg) + '</div>' +
    '<div class="popup-btns">' +
      '<button class="popup-btn sub" onclick="popClose()">' + (opts.cancel || '取消') + '</button>' +
      '<button class="popup-btn main" onclick="var f=window._popYes;popClose();if(f)f();">' + (opts.ok || '确定') + '</button>' +
    '</div></div>';
  phone.appendChild(p);
}

// 加载框（替换"正在倾听…"这种）：用 popClose() 关闭
function popLoading(msg){
  popClose();
  var p = document.createElement('div');
  p.className = 'popup';
  p.id = 'popup';
  p.innerHTML = '<div class="popup-box">' +
    '<div class="popup-spin"></div>' +
    '<div class="popup-msg" style="margin-bottom:4px">' + esc(msg || '请稍候…') + '</div>' +
    '</div>';
  phone.appendChild(p);
}
// ===== 让所有旧的 alert 自动变成漂亮弹窗 =====
window.alert = function(msg){
  msg = String(msg == null ? '' : msg);
  var icon = '';
  var title = '提示';
  // 自动识别开头的 emoji 当图标
  var m = msg.match(/^([\u2600-\u27BF\uD83C-\uDBFF\uDC00-\uDFFF]+)\s*/);
  if (m) { icon = m[1]; msg = msg.slice(m[0].length); }
  popTip(msg, { icon: icon, title: title });
};
// ===== 带输入框的自定义弹窗 =====
function popPrompt(msg, placeholder, onConfirm, opts) {
  opts = opts || {};
  popClose();
  var p = document.createElement('div');
  p.className = 'popup';
  p.id = 'popup';
  p.innerHTML = '<div class="popup-box">' +
    (opts.icon ? '<div class="popup-icon">' + opts.icon + '</div>' : '') +
    (opts.title ? '<div class="popup-title">' + esc(opts.title) + '</div>' : '') +
    '<div class="popup-msg" style="margin-bottom:8px;">' + esc(msg) + '</div>' +
    '<input id="popupInput" type="text" placeholder="' + esc(placeholder || '') + '" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:4px;" onkeydown="if(event.key===\'Enter\'){document.querySelector(\'#popup .popup-btn.main\').click();}">' +
    '<div id="popupInputError" style="color:#e34;font-size:12px;min-height:20px;margin-bottom:8px;"></div>' +
    '<div class="popup-btns">' +
      '<button class="popup-btn sub" onclick="popClose()">' + (opts.cancel || '取消') + '</button>' +
      '<button class="popup-btn main" onclick="var v=document.getElementById(\'popupInput\').value.trim();if(!v){document.getElementById(\'popupInputError\').textContent=\'请填写内容\';document.getElementById(\'popupInput\').style.borderColor=\'#e34\';return;}popClose();if(window._popPromptYes)window._popPromptYes(v);">' + (opts.ok || '确定') + '</button>' +

function attachLongPress(){
  document.querySelectorAll('#content .msg').forEach(function(el){
    if(el._sw)return;el._sw=true;
    var id=el.dataset.mid;var isMe=el.classList.contains('me');
    var sx=0,horiz=null,fired=false,sy=0;
    el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;horiz=null;fired=false;});
    el.addEventListener('pointermove',function(e){
      if(!sx||fired)return;
      var mx=e.clientX-sx,my=e.clientY-sy;
      if(horiz===null){if(Math.abs(mx)>10||Math.abs(my)>10)horiz=Math.abs(mx)>Math.abs(my);}
      if(!horiz)return;
      if(mx<-45){fired=true;sx=0;openMsgMenu(id,isMe);}
    });
    var clr=function(){sx=0;};
    el.addEventListener('pointerup',clr);
    el.addEventListener('pointercancel',clr);
    el.addEventListener('pointerleave',clr);
    el.addEventListener('contextmenu',function(e){e.preventDefault();});
  });
}
// ===== 编辑 AI 回复消息 =====
function editMessage(msgId) {
    var arr = DB.chats[view.id];
    if (!arr) return;
    var m = arr.find(function(x) { return x.id === msgId; });
    if (!m || m.recalled || m.type !== 'text' || m.role !== 'assistant') {
        popTip('该消息不可编辑', {icon:'🚫', title:'提示'});
        return;
    }

    var currentText = m.editedContent || m.content;
    closeModal();

    var mo = document.createElement('div');
    mo.className = 'modal';
    mo.id = 'modal';
    mo.innerHTML =
        '<div class="sheet-box">' +
        '<h3 style="text-align:center;">✏️ 编辑消息</h3>' +
        '<textarea id="editMsgInput" style="width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;background:var(--bg);color:var(--text);line-height:1.6;resize:vertical;">' + esc(currentText) + '</textarea>' +
        '<button class="btn" style="width:100%;margin:10px 0 4px;" onclick="saveEditedMessage(\'' + msgId + '\')">💾 保存</button>' +
        '<button class="btn gray" style="width:100%;margin:0;" onclick="closeModal()">取消</button>' +
        '</div>';
    mo.onclick = function(e) { if (e.target === mo) closeModal(); };
    phone.appendChild(mo);

    setTimeout(function() {
        var el = document.getElementById('editMsgInput');
        if (el) { el.focus(); el.select(); }
    }, 100);
}
function saveEditedMessage(msgId) {
    var el = document.getElementById('editMsgInput');
    if (!el) return;
    var newText = el.value.trim();
    if (!newText) {
        popTip('内容不能为空', {icon:'⚠️', title:'提示'});
        return;
    }
    var arr = DB.chats[view.id];
    if (!arr) return;
    var m = arr.find(function(x) { return x.id === msgId; });
    if (!m || m.recalled || m.type !== 'text' || m.role !== 'assistant') {
        popTip('消息已不可编辑', {icon:'🚫', title:'提示'});
        closeModal();
        return;
    }
    m.editedContent = newText;
    m.editedAt = Date.now();
    save();
    closeModal();

    if (view.type === 'chat') {
        renderChat(true);
    } else if (view.type === 'groupChat') {
        renderGroupChat(true);
    }
    popTip('消息已更新', {icon:'✅', title:'编辑完成'});
}
function openMsgMenu(id, isMe){
  var arr = DB.chats[view.id];
  if (!arr) return;
  var m = arr.find(function(x){ return x.id === id; });
  if (!m || m.recalled) return;
  
  var btns = '';
  if (isMe) {
    var isRecallable = (Date.now() - (m.time || 0)) < 300000;
    if (isRecallable) {
      btns += '<button class="btn" onclick="closeModal();recallMsg(\'' + id + '\')">↩️ 撤回（5分钟内）</button>';
    } else {
      btns += '<div style="text-align:center;color:var(--sub);font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);">已超过5分钟，无法撤回</div>';
    }
    btns += '<button class="btn gray" onclick="closeModal();delMsg(\'' + id + '\', true)">🗑️ 删除本条</button>';
    btns += '<button class="btn gray" onclick="closeModal();delMsg(\'' + id + '\')">🧹 删除此条及以后</button>';
  } else {
    btns += '<button class="btn" onclick="closeModal();regenMsg(\'' + id + '\')">🔄 让TA重新回复</button>';
    // ★ 新增：编辑按钮（仅纯文本且未撤回）
    if (m.type === 'text' && !m.recalled) {
        btns += '<button class="btn" onclick="closeModal();editMessage(\'' + id + '\')">✏️ 编辑</button>';
    }
    btns += '<button class="btn gray" onclick="closeModal();delMsg(\'' + id + '\', true)">🗑️ 删除本条</button>';
    btns += '<button class="btn gray" onclick="closeModal();delMsg(\'' + id + '\')">🧹 删除此条及以后</button>';
  }
  
  var mo = document.createElement('div');
  mo.className = 'modal';
  mo.id = 'modal';
  mo.innerHTML = '<div class="sheet-box">' + btns + '<button class="btn gray" style="margin-top:0" onclick="closeModal()">取消</button></div>';
  mo.onclick = function(e){ if (e.target === mo) closeModal(); };
  phone.appendChild(mo);
}
function delMsg(id, singleOnly) {
  var arr = DB.chats[view.id];
  if (!arr) return;
  var idx = arr.findIndex(function(x) { return x.id === id; });
  if (idx < 0) return;
  
  if (singleOnly) {
    // 单条删除：只删这一条
    popConfirm('只删除这一条消息？', function(){
      arr.splice(idx, 1);
      save();
      renderChat();
    }, {icon:'🗑️', title:'单条删除'});
  } else {
    // 原有的“删除当前及之后全部”逻辑（供重新回复使用）
    popConfirm('删除这条消息及其后面的所有对话？', function(){
      arr.splice(idx, arr.length - idx);
      save();
      renderChat();
    }, {icon:'🗑️', title:'删除消息'});
  }
}
function regenMsg(id) {
  var arr = DB.chats[view.id];
  if (!arr) return;
  var idx = arr.findIndex(function(x) { return x.id === id; });
  if (idx < 0 || arr[idx].role !== 'assistant') return;
  popConfirm('将删除这条消息及其后面的所有对话，AI会重新回复，确定吗？', function(){
    arr.splice(idx, arr.length - idx);
    save();
    renderChat();
    aiReply();
  }, {icon:'🔄', title:'重新回复'});
}
function recallMsg(id){const arr=DB.chats[view.id];const m=arr&&arr.find(x=>x.id===id);if(!m||m.recalled)return;popConfirm('撤回这条消息？',function(){m.recalledContent=(m.type==='text'||m.type==='voice')?m.content:'['+(m.type||'消息')+']';m.recalled=true;m.reveal=false;save();renderChat();},{icon:'↩️',title:'撤回消息'});}
function peekRecall(id){
  const m=DB.chats[view.id].find(x=>x.id===id);if(!m)return;
  if(!m.reveal){
    const isAi=m.role==='assistant';
    if(isAi){
      popConfirm('偷看 TA 撤回的内容？将消耗 5 💗（看过后永久解锁）', function(){
        if(!spendHeart(getC(view.id),5,'偷看'+((getC(view.id)||{}).nick||(getC(view.id)||{}).name||'')+'的撤回'))return;
        m.reveal=true;save();renderChat();
      }, {icon:'👀', title:'偷看撤回'});
      return;
    }
  }

      });

        } else {
            return [{ type: 'text', content: raw }];
        }
    }

      if (m) {

      if (m) {
        markers.push({ type: 'sticker', content: m[3].trim() });

        found = true;

      }

        matched = true;
      }

    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[心声[：|]([^\]]+)\]([\s\S]*)$/);

      m = clean.match(/^([\s\S]*?)\[拉黑玩家[：|]([^\]]+)\]([\s\S]*)$/);

        found = true;
        matched = true;

function handleTransferAction(msgId, action, silent) {
  closeModal(); // 关掉弹窗
  var arr = DB.chats[view.id];
  if (!arr) return;
  var msg = arr.find(function(m) { return m.id === msgId; });
  if (!msg || msg.type !== 'transfer') return;
  if (msg.status === 'accepted' || msg.status === 'refunded') return;

  var amount = parseFloat(msg.amount) || 0;
  var isFromAI = (msg.from === 'ai');
  var c = getC(view.id);
  var name = (c ? c.nick || c.name : '对方');

  if (action === 'accept') {
    msg.status = 'accepted';
    if (!isFromAI) {
      // 用户→AI 转账：AI接收后，钱归AI（不涉及金币）
    } else {
      DB.coins = (DB.coins || 0) + amount;
    }
    var sysMsg = isFromAI ? '你已接收来自 ' + name + ' 的转账 ¥' + amount.toFixed(2) : name + ' 已接收你的转账 ¥' + amount.toFixed(2);
    insertSystemMessage(sysMsg);
  } else {
    msg.status = 'refunded';
    var sysMsg = isFromAI ? '你已退回 ' + name + ' 的转账 ¥' + amount.toFixed(2) : name + ' 已退回你的转账 ¥' + amount.toFixed(2);
    insertSystemMessage(sysMsg);
    if (c) {
      c.status.好感度 = clamp(c.status.好感度 - 3);
      c.status.信任度 = clamp(c.status.信任度 - 2);
      c.status.紧张感 = clamp(c.status.紧张感 + 2);
	  syncClinginess(c);
    }
  }
  save();
  if (!silent) renderChat();
}

function c2cShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function collectC2CCommenters(poster){
  var list=[];
  DB.contacts.forEach(function(other){
    if(other.id===poster.id||other._draft) return;
    var rel=(other.relations||[]).find(function(r){return r.targetId===poster.id;});
    if(rel) list.push({kind:'char',id:other.id,name:(other.nick||other.name),rel:rel,char:other});
  });
  (poster.relations||[]).forEach(function(r){
    if(r.targetId&&r.targetId!=='npc'){
      if(!list.some(function(x){return x.id===r.targetId;})){
        var ch=getC(r.targetId);
        if(ch) list.push({kind:'char',id:ch.id,name:(ch.nick||ch.name),rel:r,char:ch});
      }
    }else if(r.targetName){
      list.push({kind:'npc',id:'npc',name:r.targetName,rel:r,char:null});
    }
  });
  return list;
}

function c2cShouldComment(commenter,moment){
  var type=(commenter.rel.relationType||'').trim();
  var p=0.15;
  if(/恋人|夫妻|情侣|男女朋友/.test(type)) p=0.4;
  else if(/闺蜜|挚友|兄弟|好友/.test(type)) p=0.3;
  else if(/家人|父|母|哥|弟|姐|妹|亲/.test(type)) p=0.3;
  else if(/朋友|同学|同事|同伴/.test(type)) p=0.2;
  else if(/敌|仇|前任|讨厌/.test(type)) p=0.18;
  if(moment.images&&moment.images.length) p+=0.03;
  return Math.random()<p;
}

function c2cBrief(char,fallbackName){
  if(!char) return fallbackName||'某人';
  var s=(char.nick||char.name||fallbackName||'某人');
  if(char.pKeywords) s+='（性格：'+String(char.pKeywords).slice(0,40)+'）';
  if(char.pStyle) s+='（说话风格：'+String(char.pStyle).slice(0,30)+'）';
  return s;
}

async function c2cGenerateBundle(commenter,poster,moment){
  var model=DB.settings.auxModel||DB.settings.chatModel;
  if(!model) return null;
  var relType=commenter.rel.relationType||'朋友';
  var relDesc=commenter.rel.description||'';
  var commenterBrief=(commenter.kind==='char')?c2cBrief(commenter.char,commenter.name):commenter.name+(commenter.rel.targetJob?'（'+commenter.rel.targetJob+'）':'');
  var task='【微信朋友圈评论区，请分别扮演两个人各说一句】\n'
    +'发布者：'+c2cBrief(poster)+'，发了动态：“'+(moment.text||'（一张图片）')+'”\n'
    +'评论者：'+commenterBrief+'，与发布者的关系是【'+relType+'】。'+(relDesc?'关系补充：'+relDesc+'。':'')+'\n\n'
    +'请生成：\n1) 评论者以自己性格和这段关系为基调，对这条动态写一句自然简短的评论（15字左右）。\n'
    +'2) 发布者是否回复：合适就回一句简短的（20字内），不回复则留空。\n'
    +'严格只输出JSON：{"comment":"评论内容","reply":"回复内容或空字符串"}，不要任何多余文字。';
  var messages=[{role:'system',content:'你在模拟朋友圈评论区的自然互动，只输出要求的JSON。'},{role:'user',content:task}];
  try{
    var out=await callAI(messages,model);
    out=out.replace(/```json/gi,'').replace(/```/g,'').trim();
    var mm=out.match(/\{[\s\S]*\}/); if(mm) out=mm[0];
    var obj=JSON.parse(out);
    if(obj.comment) obj.comment=String(obj.comment).replace(/^["'“”\s]+|["'“”\s]+$/g,'').slice(0,60);
    if(obj.reply) obj.reply=String(obj.reply).replace(/^["'“”\s]+|["'“”\s]+$/g,'').slice(0,60); else obj.reply='';
    return obj.comment?obj:null;
  }catch(e){ console.error('c2c生成失败',e); return null; }
}

async function triggerC2CInteractions(moment){
  try{
    if(DB.settings.c2cEnabled===false) return;
    if(!moment||moment.author==='me') return;
    if(moment._c2cDone) return;
    if(DB._c2cLastRun&&Date.now()-DB._c2cLastRun<20*60*1000) return; // 20分钟全局冷却
    var poster=getC(moment.author);
    if(!poster) return;
    moment._c2cDone=true;

    var pool=c2cShuffle(collectC2CCommenters(poster));
    var chosen=null;
    for(var i=0;i<pool.length;i++){ if(c2cShouldComment(pool[i],moment)){ chosen=pool[i]; break; } }
    if(!chosen) return;

    DB._c2cLastRun=Date.now();
    var bundle=await c2cGenerateBundle(chosen,poster,moment);
    if(!bundle||!bundle.comment) return;

    moment.comments=moment.comments||[];
    moment.comments.push({by:(chosen.kind==='char'?chosen.id:'npc'),name:chosen.name,text:bundle.comment,to:null,toName:null,ts:Date.now(),src:'c2c'});
    pushRecentC2C((poster.nick||poster.name),poster.id,chosen.name,(chosen.kind==='char'?chosen.id:'npc'),moment,bundle.comment,'comment');
    if(bundle.reply){
      moment.comments.push({by:poster.id,name:(poster.nick||poster.name),text:bundle.reply,to:(chosen.kind==='char'?chosen.id:'npc'),toName:chosen.name,ts:Date.now(),src:'c2c'});
      pushRecentC2C((poster.nick||poster.name),poster.id,chosen.name,(chosen.kind==='char'?chosen.id:'npc'),moment,bundle.reply,'reply');
    }
    save();
    if(typeof renderMoments==='function') renderMoments();
  }catch(e){ console.error('c2c互动失败',e); }
}

/* ===== API / 备份 ===== */
async function callAI(messages, model, _retry){
  const s = DB.settings;
  if(!s.apiUrl || !s.apiKey) throw new Error('请先在设置里填写API');
  _retry = _retry || 0;

  try{
    const res = await fetch(s.apiUrl + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + s.apiKey
      },
      body: JSON.stringify({ model: model || s.chatModel, messages })
    });

    if(!res.ok){
      // 把服务器返回的具体错误也读出来，方便看原因
      var errText = '';
      try { errText = await res.text(); } catch(e){}
      // 5xx（服务器抽风）或 429（限流）→ 自动重试，最多3次
      if((res.status >= 500 || res.status === 429) && _retry < 2){
        await sleep(1500 * (_retry + 1));   // 等一下再重试（越试越久）
        return callAI(messages, model, _retry + 1);
      }
      throw new Error('HTTP ' + res.status + (errText ? '：' + errText.slice(0,300) : ''));
    }

    const d = await res.json();
    if(!d.choices || !d.choices[0]){
      throw new Error('返回格式异常：' + JSON.stringify(d).slice(0,300));
    }
    return d.choices[0].message.content;

  }catch(e){
    // 网络层面的错误（断网、超时等）也重试
    if(_retry < 2 && /fetch|network|timeout|Failed/i.test(e.message||'')){
      await sleep(1500 * (_retry + 1));
      return callAI(messages, model, _retry + 1);
    }
    throw e;
  }
}

// ===== 全屏自适应缩放 =====
function applyPhoneScale() {
  var phone = document.getElementById('phone');
  if (!phone) return;

  // 屏幕宽度小于 420px 时，手机已经自适应，不做缩放
  if (window.innerWidth < 420) {
    phone.style.transform = 'scale(1)';
    return;
  }

  var designWidth = 400;      // 与 CSS 中的 width 一致
  var designHeight = 880;     // 与 CSS 中的 max-height 一致
  var padding = 24;           // 四周留一点边距，不贴边

  var availW = window.innerWidth - padding;
  var availH = window.innerHeight - padding;

  var scaleX = availW / designWidth;
  var scaleY = availH / designHeight;
  var scale = Math.min(scaleX, scaleY, 1); // 最大不超过 1，避免放大变模糊

  phone.style.transform = 'scale(' + scale + ')';
}

  applyPhoneScale();

// ===== 图片仓库（IndexedDB）带收藏 & 自动清理 =====
const IMG_DB_NAME = 'myrp_images';
const IMG_KEEP_DAYS = 7;              // 未收藏的图保留天数
let _imgDB = null;

function _openImgDB(){
  return new Promise(function(resolve, reject){
    if(_imgDB) return resolve(_imgDB);
    const req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains('imgs')) db.createObjectStore('imgs');
    };
    req.onsuccess = function(e){ _imgDB = e.target.result; resolve(_imgDB); };
    req.onerror = function(e){ reject(e); };
  });
}
// ===== 如果其他地方需要 deleteImage，保留这个（但 delPhoto 不再使用它） =====
function deleteImage(id) {
  return new Promise(function(resolve, reject) {
    _openImgDB()
      .then(function(db) {
        var tx = db.transaction('imgs', 'readwrite');
        var req = tx.objectStore('imgs').delete(id);
        req.onsuccess = function() { resolve(); };
        req.onerror = function(e) { reject(e.target.error); };
      })
      .catch(function(e) { reject(e); });
  });
}
// 存图：传入 b64 和可选的 roleId（图片属于哪个角色），返回图片 id
async function saveImage(b64, roleId){
  const db = await _openImgDB();
  const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const record = { 
    b64: b64, 
    createdAt: Date.now(), 
    fav: false,
    roleId: roleId || null   // 新增字段：关联角色ID
  };
  return new Promise(function(resolve, reject){
    const tx = db.transaction('imgs','readwrite');
    tx.objectStore('imgs').put(record, id);
    tx.oncomplete = function(){ resolve(id); };
    tx.onerror = function(e){ reject(e); };
  });
}
// 取图：传入 id，返回可直接放进 <img src> 的 b64（取不到返回空）
async function getImage(id){
  const db = await _openImgDB();
  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readonly');
    const r = tx.objectStore('imgs').get(id);
    r.onsuccess = function(){ resolve(r.result ? r.result.b64 : ''); };
    r.onerror = function(){ resolve(''); };
  });
}

// 收藏 / 取消收藏：fav 传 true 或 false
async function favImage(id, fav){
  const db = await _openImgDB();
  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readwrite');
    const store = tx.objectStore('imgs');
    const r = store.get(id);
    r.onsuccess = function(){
      const rec = r.result; if(!rec) return resolve(false);
      rec.fav = !!fav;
      store.put(rec, id);
      resolve(true);
    };
    r.onerror = function(){ resolve(false); };
  });
}

// 手动删图
async function deleteImage(id){
  const db = await _openImgDB();
  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readwrite');
    tx.objectStore('imgs').delete(id);
    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ resolve(); };
  });
}

// 自动清理：删掉"没收藏 且 超过 N 天"的图
async function cleanupImages(){
  const db = await _openImgDB();
  const limit = Date.now() - IMG_KEEP_DAYS*24*60*60*1000;
  const tx = db.transaction('imgs','readwrite');
  const store = tx.objectStore('imgs');
  store.openCursor().onsuccess = function(e){
    const cur = e.target.result;
    if(!cur) return;
    const rec = cur.value;
    if(!rec.fav && rec.createdAt < limit) store.delete(cur.key);  // 没收藏且过期→删
    cur.continue();
  };
}

// 列出图片（相册用）：可传 {favOnly:true} 只看收藏
async function listImages(opts){
  opts = opts || {};
  const db = await _openImgDB();
  return new Promise(function(resolve){
    const tx = db.transaction('imgs','readonly');
    const store = tx.objectStore('imgs');
    const out = [];
    const kr = store.getAllKeys();
    kr.onsuccess = function(){
      const keys = kr.result || [];
      const vr = store.getAll();
      vr.onsuccess = function(){
        const vals = vr.result || [];
        for(let i=0;i<keys.length;i++){
          if(opts.favOnly && !vals[i].fav) continue;
          out.push({ 
            id: keys[i], 
            createdAt: vals[i].createdAt, 
            fav: vals[i].fav,
            roleId: vals[i].roleId || null   // ← 新增
          });
        }
        out.sort((a,b)=>b.createdAt-a.createdAt);
        resolve(out);
      };
    };
  });
}

function extractImage(text){
  if(!text) return '';
  // 匹配 data:image/xxx;base64,.... 这一整串
  const m = text.match(/data:image\/[a-zA-Z]+;base64,[A-Za-z0-9+/=]+/);
  return m ? m[0] : '';
}

  var q = getImgQuota(cid);
  if(q === '0') return false;      // 不发
  if(q === 'every') return true;   // 每条都发
  // 数字限额：看今天发了几张
  DB.imgUsage = DB.imgUsage || {date:'', counts:{}};
  if(DB.imgUsage.date !== _todayStr()){   // 跨天了，清零

  var used = DB.imgUsage.counts[cid] || 0;
  return used < parseInt(q);
}

function fillChatImages(){

    if(img.src) return;
    var id = img.getAttribute('data-imgid');
    getImage(id).then(function(b64){
      if(!b64) return;

      // 关键：先判断"设置图片之前"用户是不是贴在底部
      // 容差 60px：只要接近底部就算"在底部"
      var wasAtBottom = content.scrollHeight - content.scrollTop - content.clientHeight < 60;

      // onload：图片真正显示、撑开高度后触发
      img.onload = function(){
        if(wasAtBottom){
          content.scrollTop = content.scrollHeight;  // 图片撑高后，补滚到底
        }
      };

      img.src = b64;  // 赋值放在 onload 绑定之后
    });
  });
}

// 生成图片：传入提示词、模型、所属角色ID（可选）
async function generateImage(prompt, model, roleId){
  const s = DB.settings;
  if(!s.apiUrl || !s.apiKey) throw new Error('请先在设置里填写API');

  // 复用聊天接口，让它画图
  const reply = await callAI(
    [{ role:'user', content: prompt }],
    model || s.auxModel
  );

  const b64 = extractImage(reply);
  if(!b64) throw new Error('没生成出图片，换个提示词或模型试试');

  // 存进 IndexedDB，同时记录属于哪个角色
  const id = await saveImage(b64, roleId);
  return id;
}

// ===== 公共：生成一张"随手拍"，返回图片id（失败返回null）=====
async function makeSnapshot(cid, moodText){
  var c = getC(cid);
  if(!c || !DB.settings.imageModel) return null;
  var who = c.nick || c.name;

  // 世界观
  var worldDesc = '';
  if(c.worldId){ var w=(DB.worlds||[]).find(function(x){return x.id===c.worldId;}); if(w) worldDesc=(w.name||'')+'：'+(w.desc||''); }
  // 行程
  var cur = findCurrentScheduleItem(c);
  var nowDoing = cur ? (cur.content||'') : '';
  var nowPlace = cur ? (cur.location||'') : '';
  // 最近聊天
  var msgs = (DB.chats[cid]||[]).filter(function(m){return m.type==='text'&&m.content&&!m.recalled;});
  var recentChat = msgs.length ? msgs.slice(-4).map(function(m){return (m.role==='user'?'我':who)+'：'+m.content;}).join('；') : '';
  // 人设
  var persona=''; try{ persona=buildSystem(c); }catch(e){ persona='角色：'+who; }
  // 时段
  var hh=new Date().getHours();
  var timeCN = hh<5?'深夜（一片黑暗，只有灯光或月光）':hh<8?'清晨（天刚蒙蒙亮，光线柔和）':hh<11?'上午（明亮的日光）':hh<14?'中午（强烈的日光）':hh<17?'下午（偏暖的日光）':hh<19?'傍晚（黄昏，橙色暮光）':hh<23?'夜晚（天已经黑了，室内灯光或城市灯光）':'深夜（一片黑暗，只有灯光）';
  var timeEN = hh<5?'deep night, dark, only artificial or moon light':hh<8?'early morning, soft dawn light':hh<11?'morning, bright daylight':hh<14?'noon, strong daylight':hh<17?'afternoon, warm daylight':hh<19?'dusk, orange sunset glow':hh<23?'night, dark sky, indoor or city lights':'deep night, dark, only artificial light';

  var askPrompt = persona +
    '\n\n【任务】你（' + who + '）此刻想随手拍一张照片。' +
    (moodText ? '当前的情境/心情是："' + moodText + '"。' : '') +
    '请结合你的身份、性格、所处世界、此刻在做的事，想一个最符合"此刻的你会拍下来"的画面。' +
    (worldDesc ? '\n【你所处的世界观】' + worldDesc : '') +
    (nowPlace ? '\n【当前地点】' + nowPlace : '') +
    (nowDoing ? '\n【此刻在做】' + nowDoing : '') +
    '\n【现在的时间】' + hh + '点，属于' + timeCN + '，画面的光线和天色必须符合这个时间' +
    (recentChat ? '\n【最近对话】' + recentChat : '') +
    '\n\n【硬性要求】' +
    '\n1. 只描述"画面里有什么"，第一人称视角（你拿手机随手拍下眼前的东西）。' +
    '\n2. 绝对不能有人脸、不能自拍、不能出现完整的人。最多只能露出你自己的一只手（如握杯子、翻书），不许两只手同时出现。' +
    '\n3. 拍环境、物件、景色、食物、手边之物，要符合你的身份和所在世界。' +
    '\n4. 光线天色要符合上面给定的时间段。' +
    '\n5. 只输出一句英文画面描述（给绘图AI用），30词以内，不要解释、不要引号。';

  var sceneDesc = await callAI([{role:'user', content:askPrompt}], DB.settings.lightModel||DB.settings.chatModel);
  sceneDesc = (sceneDesc||'').replace(/["'\n]/g,' ').trim();
  if(!sceneDesc) return null;

  var imgPrompt = sceneDesc +
    '. Time of day: ' + timeEN + ', the lighting and sky must match this time. ' +
    'A real photograph taken on a smartphone camera, authentic photo, ' +
    'extremely ordinary unremarkable phone snapshot: no clear subject, no composition, slight motion blur, ' +
    'uneven natural lighting with mild over/underexposure, awkward angle, messy framing, deliberately plain and mundane, ' +
    'casual point-of-view, real life candid photo, realistic textures, natural grain, shot on iPhone. ' +
    'STRICT: no human face, no selfie, no full person; at most one single hand (never two hands); ' +
    'no text, no watermark, no border, no logo. ' +
    'NOT 3D render, NOT CGI, NOT illustration, NOT painting, NOT cartoon, NOT anime, NOT digital art, no rendered look.';

  return await generateImage(imgPrompt, DB.settings.imageModel, cid);

}
// ===== 聊天随手拍：文字秒回后，后台悄悄配图（不阻塞用户）=====
var _snapLock = {};

function triggerChatSnapshot(c, parts){
  if(!c || c.mode !== 'online') return;
  if(!DB.settings.imageModel) return;
  if(!canSendImage(c.id)) return;
  if(_snapLock[c.id]) return;
  if(Math.random() >= 0.25) return;

  var moodText = (parts||[]).filter(function(p){return p.type==='text';})
                            .map(function(p){return p.content;}).join(' ');
  moodText = stripStateTag(moodText);
  var cid = c.id;

  _snapLock[cid] = true;
  (async function(){
    try{
      var picId = await makeSnapshot(cid, moodText);
      if(!picId) return;
      var imgMsg = { id:newId(), role:'assistant', type:'image', content:picId, time:Date.now() };
      DB.chats[cid] = DB.chats[cid] || [];
      DB.chats[cid].push(imgMsg);
      recordImageSent(cid);
      save();
      if(view.type==='chat' && view.id===cid){
        appendBubble(getC(cid), imgMsg);
        fillChatImages();
        scrollBottom();
      } else {
        markChatUnread(cid, 1);
      }
    }catch(e){ console.warn('聊天配图失败', e); }
    finally{ _snapLock[cid] = false; }
  })();
}

function delPhoto(id) {
  if (!id) {
    console.error('删除失败：id 为空');
    popTip('图片ID无效', {icon:'⚠️'});
    return;
  }
  popConfirm('确定删除这张图片？删除后无法恢复。', function(){
    _openImgDB()
      .then(function(db) {
        var tx = db.transaction('imgs', 'readwrite');
        var req = tx.objectStore('imgs').delete(id);
        req.onsuccess = function() {
          popTip('已删除', {icon:'🗑️'});
          if (view.type === 'album') render();
        };
        req.onerror = function(e) {
          console.error('删除请求失败:', e);
          popTip('删除失败', {icon:'⚠️'});
        };
      })
      .catch(function(e) {
        console.error('打开数据库失败:', e);
        popTip('数据库打开失败', {icon:'⚠️'});
      });
  }, {icon:'🗑️', title:'删除图片'});
}

  });
}

// 收藏/取消
function togglePhotoFav(id, fav){
  favImage(id, fav).then(function(){
    popClose();
    popTip(fav?'已收藏，永久保存 ❤️':'已取消收藏', {icon: fav?'❤️':'🤍'});
    if(view.type==='album') render();
  });
}

setTimeout(function(){ 
  try { cleanupImages(); } catch(e) { console.log('清理跳过', e); }
}, 3000);

</script>
