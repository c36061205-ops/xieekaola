      ];

      var out = await callAI(messages, model);
      out = out.trim().replace(/^["「”]+|["」”]+$/g, '').replace(/<state>[\s\S]*?<\/state>/g, '').trim();

      if (!out || out.length < 3) {
        out = '… 这个人，我好像越来越看不懂了。';
      }

      c.hearts = (c.hearts || 0) - cost;
      c.voiceLog = c.voiceLog || [];
      c.voiceLog.unshift({ t: Date.now(), content: out });
      c.heartLog = c.heartLog || [];
      c.heartLog.unshift({ t: Date.now(), n: -cost, reason: '💭 聆听了一次心声' });
      if (c.heartLog.length > 200) c.heartLog.pop();
      save();

        render();
      }

    }
  })();

    var messages = [
      { role: 'system', content: system },
      { role: 'system', content: '以下是最近的对话记录：\n' + convo },

// ----- 2. 存储操作 -----
function getFloatingCache(worldId) {
  if (!DB.floating) DB.floating = {};
  if (!DB.floating[worldId]) DB.floating[worldId] = [];
  return DB.floating[worldId];
}

function saveFloatingCache(worldId, posts) {
  if (!DB.floating) DB.floating = {};
  DB.floating[worldId] = posts;
  save();
}

function trimFloatingCache(worldId) {
  var posts = getFloatingCache(worldId);
  if (posts.length > 30) {
    posts.sort(function(a, b) { return b.time - a.time; });
    posts = posts.slice(0, 30);
    saveFloatingCache(worldId, posts);
  }
  return posts;
}

// ----- 4. AI 生成帖子（自带点赞和评论）-----
async function generateFloatingPosts(worldId, count) {
  count = count || 5;

  if (!world) return [];

  var model = DB.settings.auxModel || DB.settings.chatModel;
  if (!model) {
    console.warn('浮光：没有可用模型');
    return [];
  }

  var now = new Date();
  var timeStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' +
    String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

  var typesList = FLOATING_TYPES.map(function(t) {
    return '- ' + t + '：' + FLOATING_TYPE_META[t].vibe;
  }).join('\n');

var prompt = '你是一个活跃在「' + world.name + '」的普通居民，正在刷这个世界的本地社区。这里的帖子都是普通人随手发的日常分享，风格轻松口语化。\n\n' +

  '【当前时间】\n' + timeStr + '\n\n' +
  '【发帖类型】（每条选一个，不要重复）\n' + typesList + '\n\n' +
  '【生成要求】\n' +
  '1. 生成 ' + count + ' 条帖子，每条用不同的类型\n' +
  '2. 用第一人称"我"（公告可用"我们"）\n' +
  '3. 口语化、简短、有信息量，字数 10~30 字\n' +
  '4. 每条帖子带 1~2 条评论，评论者网名自拟，评论内容简短真实\n' +
  '5. 点赞数 2~10 之间浮动\n' +
  '6. 帖子内容必须简短，一句话说清楚，不要写长段叙事\n' +
  '7. 发帖人网名 2~5 个字，符合世界观风格，自拟，不重复\n' +
  '8. 【可选配图】如果觉得这条帖子配一张图会更生动，在内容末尾加上 *[图片：xxx]*（一句话描述画面，不是必须的，有的帖子纯文字就好）\n' +
  '9. 不要标题、不要引号、不要解释\n\n' +
  '【格式示范】（以下只是格式参考，内容必须换成符合「' + world.name + '」世界观的题材）\n' +
  '✅ 纯文字示例格式：「[一句符合世界观的吐槽/分享/碎碎念]」\n' +
  '✅ 带图示例格式：「[一句符合世界观的内容] *[图片：符合世界观的画面描述]*」\n\n' +
  '【错误示范】\n' +
  '❌ 内容太长太碎，写成了观察日记\n' +
  '❌ 「生活不易，大家都要加油」（空洞，没有信息量）\n' +
  '❌ 每条都强行加 *[图片：xxx]*（图片描述是可选的，不是必须的）\n' +
  '❌ 出现与世界观不符的现代词汇（除非世界观本身是现代背景）\n\n' +
  '【输出格式】只输出 JSON 数组：\n' +
  '[{"type":"吐槽","author":"网名","content":"帖子内容（可含图片描述）","likes":5,"comments":[{"author":"评论者网名","content":"评论内容"}]}]\n' +
  '只输出 JSON，不要其他文字。';
  
  try {
    var out = await callAI([{ role: 'user', content: prompt }], model);
    out = out.replace(/```json/gi, '').replace(/```/g, '').trim();
    var match = out.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('AI 返回格式不正确');
    var data = JSON.parse(match[0]);
    if (!Array.isArray(data)) throw new Error('不是数组');

    var posts = [];
    var nowTs = Date.now();
    var roleNames = (DB.contacts || []).filter(function(c) { return c.worldId === worldId && !c._draft; });
    var roleNameList = roleNames.map(function(c) { return c.nick || c.name; });

    data.forEach(function(item, idx) {
      if (!item.type || !item.content) return;
      if (FLOATING_TYPES.indexOf(item.type) === -1) return;

      var author = item.author || '路人';
      // 10% 概率替换为世界观内的角色名
      if (roleNameList.length && Math.random() < 0.10) {
        author = roleNameList[Math.floor(Math.random() * roleNameList.length)];
      }

      var likes = item.likes || Math.floor(Math.random() * 5) + 1;  // 1~5

      // 处理评论：补 time
      var comments = [];
      if (Array.isArray(item.comments) && item.comments.length) {
comments = item.comments.slice(0, 3).map(function(c, j) {
    var author = (c.author && c.author.trim()) ? c.author.trim() : '路人';
    var text = (c.content && c.content.trim()) ? c.content.trim() : '好帖';
    // 如果评论内容少于2个字，补一个兜底
    if (text.length < 2) text = '确实是这样';
    return {
        author: author,
        text: text,
        time: nowTs + idx * 1000 + j * 10000 + Math.random() * 5000
    };
});
      } else {
        // 兜底生成几条
        var fallbackComments = [
          { author: '过客', text: '有点意思' },
          { author: '小确幸', text: '真实' }
        ];
        comments = fallbackComments.slice(0, Math.floor(Math.random() * 2) + 1).map(function(c, j) {
          return {
            author: c.author,
            text: c.text,
            time: nowTs + idx * 1000 + j * 10000 + Math.random() * 5000
          };
        });
      }

      posts.push({
        id: 'fp_' + nowTs + '_' + idx,
        worldId: worldId,
        type: item.type,
        content: item.content.trim(),
        author: author,
        time: nowTs + idx * 1000,
        likes: likes,
        godComment: '',
        comments: comments,
        _userLiked: false,
        _commentOpen: false,
        _aiCommentTriggered: false
      });
    });

    return posts;

  } catch (e) {
    console.error('浮光生成失败:', e);
    return [];
  }
}

async function triggerAIComment(postId) {
  var posts = getFloatingCache(_floatingWorldId);

  if (!p) return;

  var world = (DB.worlds || []).find(function(w) { return w.id === _floatingWorldId; });

  var myLastComment = '';
  for (var i = (p.comments || []).length - 1; i >= 0; i--) {
    if (p.comments[i].author === myName) { myLastComment = p.comments[i].text; break; }
  }

  // 选回复者：绑定本世界观的角色优先（60%概率），否则用路人
  var boundChars = (DB.contacts || []).filter(function(c) {
    return c.worldId === _floatingWorldId && c.activity !== '关' && !c._draft;
  });
  var replier = null;
  if (boundChars.length && Math.random() < 0.6) {
    replier = boundChars[Math.floor(Math.random() * boundChars.length)];
  }

  var messages, replierName;
  if (replier) {
    replierName = replier.nick || replier.name;
    var sys;
    try { sys = buildSystem(replier); }
    catch (e) { sys = '你扮演「' + replierName + '」，完全代入其性格与说话口吻。'; }
    var task = '【场景：浮光社区】有人在「' + world.name + '」发了一条帖子，' + myName + '在评论区说了话。请你以「' + replierName + '」的身份，用你的人设和说话风格回一条评论。\n\n' +
      '【帖子】' + p.content + '\n\n' +
      (myLastComment ? '【' + myName + '刚说】' + myLastComment + '\n\n' : '') +
      '【要求】简短10~25字，接住话头、别答非所问，像真人评论区聊天，直接输出内容，不要引号、不要旁白。';
    messages = [
      { role: 'system', content: sys },
      { role: 'user', content: task }
    ];
  } else {
    var _nickPool = ['夜色温柔','路过的猫','07号观察员','晚风','匿名旅人','街角咖啡','沉默的鱼','雾里看花','一只柠檬','深夜不睡','旧巷微光','随风','看客甲','南方以南','银河碎片','橙子汽水','屋顶的猫','失眠患者','薄荷味','无名氏'];
    replierName = _nickPool[Math.floor(Math.random() * _nickPool.length)];

    var prompt = '【场景】有人在「' + world.name + '」发了一条帖子，' + myName + '评论了它。请你以路人身份回一条评论。\n\n' +
      '【帖子】\n' + p.content + '\n\n' +
      (myLastComment ? '【' + myName + '刚说】' + myLastComment + '\n\n' : '') +
      '【要求】简短10~25字，接住情绪，像真人说话，直接输出内容';
    messages = [{ role: 'user', content: prompt }];
  }

  try {
    var out = await callAI(messages, model);
    out = out.replace(/["「」“”]/g, '').trim();
    if (out && out.length > 2) {
      posts = getFloatingCache(_floatingWorldId);
      p = posts.find(function(x) { return x.id === postId; });
      if (!p) return;
      if (!p.comments) p.comments = [];
      if (p.comments.length >= 5) p.comments.shift();
      var newComment = {
        id: 'c_ai_' + Date.now(),
        author: replierName,
        text: out,
        time: Date.now(),
        replyTo: myName
      };
      p.comments.push(newComment);
      saveFloatingCache(_floatingWorldId, posts);

      // 用户还在浮光页面 → 直接显示；否则红点+1提醒
      if (view && view.type === 'floating') {
        insertComment(postId, newComment);
      } else {
        DB.floatingUnread = (DB.floatingUnread || 0) + 1;
        save();
        refreshFloatingBadge();
      }
    }
  } catch (e) {
    console.warn('AI评论彩蛋失败:', e);
  }
}

// 插入神评
function insertGodComment(postId, godText) {
  var card = document.querySelector('.floating-post[data-id="' + postId + '"]');
  if (!card) return;
  // 移除旧神评（如果有）
  var oldGod = card.querySelector('.floating-god');
  if (oldGod) oldGod.remove();

  var godDiv = document.createElement('div');
  godDiv.className = 'floating-god show';
  godDiv.innerHTML = '<div class="floating-god-label">✦ 神评</div>' +
                     '<div class="floating-god-text">' + esc(godText) + '</div>';
  // 插入到评论区之前
  var wrap = card.querySelector('.floating-comments-wrap');
  if (wrap) {
    card.insertBefore(godDiv, wrap);
  } else {
    // 如果没有评论区，追加在footer之后
    var footer = card.querySelector('.floating-footer');
    if (footer) {
      footer.after(godDiv);
    } else {
      card.appendChild(godDiv);
    }
  }
}

// 插入评论（AI评论或用户自己的评论）
function insertComment(postId, comment) {
  var card = document.querySelector('.floating-post[data-id="' + postId + '"]');
  if (!card) return;
  var wrap = card.querySelector('.floating-comments-wrap');
  if (!wrap) return;
  // 如果评论区未展开，自动展开
  wrap.classList.add('show');
  // 创建评论元素
  var cmtDiv = document.createElement('div');
  var _myName = (DB.me && DB.me.name) ? DB.me.name : '我';
  cmtDiv.className = (comment.author === _myName) ? 'floating-comment mine' : 'floating-comment';
  var now = new Date();
  var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  var replyHint = comment.replyTo ? '<span style="color:var(--sub);opacity:0.7;"> 回复 ' + esc(comment.replyTo) + '</span>' : '';
  cmtDiv.innerHTML = '<span class="floating-cauthor">' + esc(comment.author) + '</span>' + replyHint + '：' +
                     esc(comment.text) + '<span class="floating-ctime">' + timeStr + '</span>';
  // 插入到输入框之前
  var inputRow = wrap.querySelector('.floating-comment-input');
  if (inputRow) {
    wrap.insertBefore(cmtDiv, inputRow);

    wrap.appendChild(cmtDiv);

function showFloatingSplash(callback) {
  var old = document.getElementById('floatingSplash');
  if (old) old.remove();

  var splash = document.createElement('div');
  splash.id = 'floatingSplash';
  splash.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;';

  var glows = '';
  for (var i = 0; i < 8; i++) {
    var l = 15 + Math.random() * 70;
    var t = 15 + Math.random() * 70;
    var s = 3 + Math.random() * 6;
    var d = 0.1 + Math.random() * 0.8;
    glows += '<div class="splash-glow" style="left:' + l + '%;top:' + t + '%;width:' + s + 'px;height:' + s + 'px;animation-delay:' + d + 's;"></div>';
  }

  splash.innerHTML =
    '<style>' +
    '@keyframes splashFloat { 0%{opacity:0;transform:translate(0,0) scale(0.3)} 40%{opacity:1;transform:translate(-20px,-30px) scale(1.2)} 100%{opacity:0;transform:translate(-50px,-80px) scale(0.8)} }' +
    '@keyframes splashFade { 0%{opacity:0} 30%{opacity:1} 70%{opacity:1} 100%{opacity:0} }' +

    '.splash-glow{position:absolute;border-radius:50%;background:var(--theme);box-shadow:0 0 30px var(--theme),0 0 80px rgba(179,74,106,0.15);opacity:0;animation:splashFloat 1.6s ease-out forwards}' +
    '.splash-title{font-size:40px;font-weight:300;color:var(--text);letter-spacing:6px;animation:splashTitle 1.4s ease forwards;position:relative;z-index:1}' +
    '.splash-title span{color:var(--theme);font-weight:700}' +
    '.splash-sub{font-size:12px;color:var(--sub);opacity:0;animation:splashTitle 1.4s ease 0.3s forwards;margin-top:8px;letter-spacing:4px;position:relative;z-index:1}' +
    '</style>' +
    glows +
    '<div class="splash-title">浮<span>光</span></div>' +
    '<div class="splash-sub">✦ 世界碎影 ✦</div>';

  document.body.appendChild(splash);
  splash.style.animation = 'splashFade 1.8s ease forwards';

  var isDone = false;
  function done() {
    if (isDone) return;
    isDone = true;
    var el = document.getElementById('floatingSplash');
    if (el) el.remove();
    if (callback) callback();
  }

  splash.addEventListener('animationend', done);
  // 超时保护，最多等 2.5 秒
  setTimeout(done, 2500);
}

function floatingSwitch(worldId) {
  _floatingWorldId = worldId;
  renderFloating();

function floatingShuffle() {
  var posts = getFloatingCache(_floatingWorldId);
  if (posts.length < 2) return;
  for (var i = posts.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = posts[i];
    posts[i] = posts[j];
    posts[j] = temp;
  }
  saveFloatingCache(_floatingWorldId, posts);
  renderFloating();
}
window.floatingShuffle = floatingShuffle;

var _floatingLikeCooldown = {};

function floatingLike(postId) {
  var posts = getFloatingCache(_floatingWorldId);
  var p = posts.find(function(x) { return x.id === postId; });
  if (!p) return;

  if (_floatingLikeCooldown[postId] && Date.now() - _floatingLikeCooldown[postId] < 500) return;
  _floatingLikeCooldown[postId] = Date.now();

  p._userLiked = !p._userLiked;
  if (p._userLiked) p.likes = (p.likes || 0) + 1;
  else p.likes = Math.max(0, (p.likes || 0) - 1);

  saveFloatingCache(_floatingWorldId, posts);

  // 更新当前卡片的点赞按钮（局部）
  var card = document.querySelector('.floating-post[data-id="' + postId + '"]');
  if (card) {
    var numEl = card.querySelector('.floating-like .num');
    if (numEl) numEl.textContent = p.likes;

    var likeBtn = card.querySelector('.floating-like');
    if (likeBtn) {
      likeBtn.innerHTML = '';
      var iconSpan = document.createElement('span');
      iconSpan.textContent = p._userLiked ? '❤️' : '✨';
      var numSpan = document.createElement('span');
      numSpan.className = 'num';
      numSpan.textContent = p.likes;
      likeBtn.appendChild(iconSpan);
      likeBtn.appendChild(numSpan);
      if (p._userLiked) likeBtn.classList.add('active');
      else likeBtn.classList.remove('active');
    }
  }

  // 神评触发：点赞数 ≥ 6，未生成过，且未在生成中，且 50% 概率
  if (p.likes >= 6 && !p.godComment && !p._godPending && Math.random() < 0.5) {
    p._godPending = true;
    generateGodComment(p, _floatingWorldId).then(function(god) {
      if (god) {
        p.godComment = god;
        saveFloatingCache(_floatingWorldId, posts);
        insertGodComment(postId, god);
      }
      p._godPending = false;
    });
  }
}
window.floatingLike = floatingLike;

function floatingToggleComments(postId) {
  var posts = getFloatingCache(_floatingWorldId);
  var p = posts.find(function(x) { return x.id === postId; });
  if (!p) return;
  p._commentOpen = !p._commentOpen;
  saveFloatingCache(_floatingWorldId, posts);

  // 局部切换显示
  var wrap = document.getElementById('fc_wrap_' + postId);
  if (wrap) {
    wrap.classList.toggle('show');
    // 切换后自动聚焦输入框
    var inp = document.getElementById('fc_input_' + postId);
    if (inp && wrap.classList.contains('show')) {
      setTimeout(function() { inp.focus(); }, 100);
    }
  }
}
window.floatingToggleComments = floatingToggleComments;

function floatingComment(postId) {
  var inp = document.getElementById('fc_input_' + postId);
  if (!inp) return;
  var text = inp.value.trim();
  if (!text) return;

  var posts = getFloatingCache(_floatingWorldId);
  var p = posts.find(function(x) { return x.id === postId; });
  if (!p) return;

  if (!p.comments) p.comments = [];
  if (p.comments.length >= 5) p.comments.shift();

  var myName = (DB.me && DB.me.name) ? DB.me.name : '我';
  p.comments.push({
    id: 'c_' + Date.now(),
    author: myName,
    text: text,
    time: Date.now()
  });

  saveFloatingCache(_floatingWorldId, posts);
  inp.value = '';

  // ===== 只更新当前卡片的 DOM =====
  var card = document.querySelector('.floating-post[data-id="' + postId + '"]');
  if (card) {
    // 更新评论数
    var countEl = card.querySelector('.floating-cmtbtn .cmt-count');
    if (countEl) countEl.textContent = p.comments.length;

    // 追加新评论到评论区
    var wrap = card.querySelector('.floating-comments-wrap');
    if (wrap) {
      var newCmt = document.createElement('div');
      newCmt.className = 'floating-comment mine';

      var now = new Date();
      var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      newCmt.innerHTML = '<span class="floating-cauthor">' + esc(myName) + '</span>' + esc(text) + '<span class="floating-ctime">' + timeStr + '</span>';
      var inputRow = wrap.querySelector('.floating-comment-input');
      if (inputRow) {
        wrap.insertBefore(newCmt, inputRow);
      } else {
        wrap.appendChild(newCmt);
      }
      // 自动展开评论区
      wrap.classList.add('show');
    }
  }

  // AI 评论：每次评论独立判定，约55%概率收到回复（延迟3~10秒，更像真人）
  if (Math.random() < 0.55) {
    var delay = 3000 + Math.random() * 7000;
    setTimeout(function() { triggerAIComment(postId); }, delay);
  }
}
window.floatingComment = floatingComment;

      '- 当前背景状态（可选）：描述世界当下的基本面貌。可以是平静的日常、也可以是某种缓慢的变化，不强制要求存在冲突或危机。\n' +

      '- 结构清晰，用 Markdown 格式输出（## 标题、- 列表）。\n\n' +

      '【地点描述规则】\n' +
      '地点描述必须包含可供 AI 编写日常剧情使用的具体信息，例如：\n' +

      '- 建筑或场所的具体规格（几层楼、大致面积、独栋还是公寓、店铺还是住宅）\n' +
      '- 关键配置或常驻特征（有哪些房间/设施、通常什么时候有人、平时做什么用）\n' +
      '- 禁止使用纯氛围词堆砌（"宁静的""充满故事的""神秘而迷人的"等不含实际信息的形容词一律不用）\n\n' +
      '【地点归属标注规则（硬性要求）】\n' +
      '- AI 角色经常去的地方：必须用角色名称标注，例如「杨深的住所」「杨深的公司」\n' +
      '- 用户经常去的地方：必须用"用户"标注，例如「用户常去的便利店」「用户的住所」\n' +
      '- 双方共同活动的地方：标注为「共同地点」\n' +
      '- 绝对不允许出现"你常去的地方""你的秘密基地"这类模糊表述\n\n';

    if (climate) {
      prompt += '【🔴 用户强制指定的气候要求（必须严格遵守，优先级最高）】\n' + climate + '\n\n';
    } else {
      prompt += '【🔵 气候自动推断规则】根据世界观类型推断合理气候，例如：\n' +
        '- 现代都市（北方）：四季分明，秋冬干燥，偶有大雪\n' +
        '- 现代都市（南方）：湿润多雨，夏季闷热，冬季少雪\n' +
        '- 妖怪/古风世界：可设定为山间盆地、江南水乡等有地域感的气候\n' +
        '- 废土/末日世界：干旱少雨，沙尘暴偶发\n' +
        '请根据世界观风格自行判断，不要默认选择"台风频发""终年暴雨"等极端气候。\n\n';
    }

    prompt += '输出格式：先写世界观正文（Markdown 格式），然后单独列出关键地点。\n\n关键词：' + keyword;

    if (places) {

    }

  }

function lastText(m){
  if(!m)return'';
  if(m.recalled)return'[有一条消息被撤回]';
  if(m.type==='image')return'[图片]';
  if(m.type==='transfer')return'[转账]';
  if(m.type==='redpacket')return'[红包]';
  if(m.type==='voice')return'[语音]';
  if(m.type==='sticker')return'[表情]';
  if(m.type==='shop_item')return'[礼物] '+(m.content||'');
  if(m.type==='share'){
    if(m.shareType==='image')return'[图片]';
    if(m.shareType==='video'||m.shareType==='clip')return'[视频]';
    if(m.shareType==='music')return'[音乐]';
    return'[分享]';
  }
  return m.content;
}

  .map(function(c){ return { kind:'private', id:c.id, time:lastMsgTime(c.id), c:c }; });

  var groupItems = (DB.groups||[]).filter(function(g){ return !g.hideInChats; })

  var arr = DB.chats[view.id]; if(!arr) return;

function groupPush(m){
  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });

  m.id = newId();
  m.time = Date.now();
  if(!DB.chats[g.id]) DB.chats[g.id] = [];
  DB.chats[g.id].push(m);

  if(m.type==='text') preview = m.content;
  else if(m.type==='image') preview = '[图片]';

  g.lastMsg = { text:preview, time:m.time, senderId:(m.role==='user'?'user':m.charId) };

function buildGroupHistory(g){
  var msgs = DB.chats[g.id] || [];

  if (lim>0 && msgs.length>lim) msgs = msgs.slice(-lim);
  var meName = DB.me.name || '我';
  var lines = msgs.map(function(m){

    var who = (m.role==='user') ? meName : (function(){ var mc=getC(m.charId); return mc?(mc.nick||mc.name):'某人'; })();
    var content;
    if (m.type==='image') content = '[图片]';

    else if (m.type==='voice') content = '[语音]' + (m.content||'');
    else content = m.content || '';
    if (!content) return null;
    return who + '：' + content;
  }).filter(Boolean);

// ===== 群聊·把历史转成标准多轮对话（自己说的算 assistant）=====
function buildGroupMessages(g, c){
  var msgs = DB.chats[g.id] || [];
  var lim = parseInt(DB.settings.ctxLimit);
  if (lim>0 && msgs.length>lim) msgs = msgs.slice(-lim);
  var meName = DB.me.name || '我';
  var out = [];
  msgs.forEach(function(m){
    if (m.recalled) return;
    var content;
    if (m.type==='image') content = '[图片]';
    else if (m.type==='sticker') content = '[表情：' + (m.content||'') + ']';
    else if (m.type==='voice') content = '[语音]' + (m.content||'');
    else content = m.content || '';
    if (!content) return;
    if (m.role !== 'user' && m.charId === c.id){
      out.push({ role:'assistant', content: content });
    } else {
      var who = (m.role==='user') ? meName : (function(){ var mc=getC(m.charId); return mc?(mc.nick||mc.name):'某人'; })();
      out.push({ role:'user', content: who + '：' + content });
    }
  });
  var merged = [];
  out.forEach(function(x){
    if (merged.length && merged[merged.length-1].role === x.role){
      merged[merged.length-1].content += '\n' + x.content;
    } else {
      merged.push({ role:x.role, content:x.content });
    }
  });
  return merged;
}

// ==================== 群聊AI·触发调度 ====================
var groupReplying = false;

function triggerGroupAI(){
  if (groupReplying) return;
  var g = (DB.groups||[]).find(function(x){ return x.id===view.id; });
  if(!g) return;
  if(!DB.settings.chatModel){ alert('请先在 设置 里选择模型'); return; }

  // 找出被@的成员
  var msgs = DB.chats[g.id] || [];
  var lastUserMsg = null;
  for(var i=msgs.length-1;i>=0;i--){ if(msgs[i].role==='user'){ lastUserMsg=msgs[i]; break; } }
  var atText = (lastUserMsg && lastUserMsg.type==='text') ? lastUserMsg.content : '';

  // 计算每个成员权重
  var pool = g.members.map(function(cid){
    var c = getC(cid);
    if(!c) return null;

    // 活动度
    var actMap = { '关':0, '低':0.2, '中':0.6, '高':1.0 };
    var wAct = (actMap[c.activity]!==undefined) ? actMap[c.activity] : 0.6;

    // 粘人度 0~100 → 0.2~1.0
    var cling = (c.clinginess===undefined?50:c.clinginess);
    var wCling = 0.2 + (cling/100)*0.8;

    // 好感度 0~100 → 0.2~1.0
    var fav = (c.status && c.status.好感度!==undefined) ? c.status.好感度 : 50;
    var wFav = 0.2 + (fav/100)*0.8;

    // 对"用户"的关系系数
    var relCoef = 1.0;
    var curRel = (c.status && c.status.当前关系) ? c.status.当前关系 : '';
    if(/恋|爱人|喜欢|暧昧/.test(curRel)) relCoef = 1.3;
    else if(/敌|讨厌|仇/.test(curRel)) relCoef = 0.5;

    var weight = wAct * wCling * wFav * relCoef;

    // 被@ +0.5
    var atMe = atText && atText.indexOf('@'+(c.nick||c.name)) >= 0;
    if(atMe) weight += 0.5;

    return { cid:cid, c:c, weight:weight, atMe:!!atMe };
  }).filter(Boolean);

  // 筛选 + 选人
  var candidates = pool.filter(function(p){ return p.weight > 0.1; });
  if(!candidates.length){
    // 保底：选权重最高的1人
    pool.sort(function(a,b){ return b.weight-a.weight; });
    candidates = pool.slice(0,1);
  }

  // 被@的必选；其余按权重比例随机，总共1~3人
  var chosen = [];
  candidates.forEach(function(p){ if(p.atMe) chosen.push(p); });

  var rest = candidates.filter(function(p){ return !p.atMe; });
  // 按权重加随机扰动排序
  rest.sort(function(a,b){ return (b.weight*Math.random()) - (a.weight*Math.random()); });

  var maxSpeakers = 3;
  for(var j=0; j<rest.length && chosen.length<maxSpeakers; j++){
    // 权重越高越可能入选
    var p = rest[j];
    var prob = Math.min(0.9, p.weight);
    if(chosen.length===0 || Math.random() < prob) chosen.push(p);
  }
  if(!chosen.length && candidates.length) chosen.push(candidates[0]);

  // 限制最多3人
  chosen = chosen.slice(0,3);

  groupAISpeak(chosen);

}

function attachSwipe() {
  var cells = document.querySelectorAll('.swipe-cell');
  cells.forEach(function(el) {
    if (el._swipeAttached) return;
    el._swipeAttached = true;

    var startX = 0, startY = 0, curX = 0, open = false, moved = false;
    var delWidth = 74;
    var isVertical = false;

    el.addEventListener('touchstart', function(e) {
      var t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      moved = false;
      isVertical = false;
      el.style.transition = 'none';
    }, { passive: true });

    el.addEventListener('touchmove', function(e) {
      var t = e.touches[0];
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      
      // 如果已经判定为垂直滑动，直接放行不拦截
      if (isVertical) return;
      
      // 初次判断：垂直偏移明显大于水平，判定为垂直滚动
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
        isVertical = true;
        return;
      }
      
      // 水平偏移太小，还在犹豫区，不做任何操作
      if (Math.abs(dx) < 10) return;
      
      // 确定是水平滑动，拦截默认滚动
      e.preventDefault();
      moved = true;
      
      var target = open ? dx - delWidth : dx;
      if (target > 0) target = 0;
      if (target < -delWidth) target = -delWidth;
      curX = target;
      el.style.transform = 'translateX(' + target + 'px)';
    }, { passive: false });

    el.addEventListener('touchend', function(e) {
      isVertical = false;
      if (!moved) return;
      
      el.style.transition = 'transform .2s';
      var shouldOpen = curX < -delWidth * 0.4;
      if (shouldOpen) {
        el.style.transform = 'translateX(-' + delWidth + 'px)';
        open = true;
        curX = -delWidth;
      } else {
        el.style.transform = 'translateX(0)';
        open = false;
        curX = 0;
      }
    }, { passive: true });

    el.addEventListener('click', function(e) {
      if (moved) {
        e.stopPropagation();
        e.preventDefault();
        if (open) {
          el.style.transition = 'transform .2s';
          el.style.transform = 'translateX(0)';
          open = false;
          curX = 0;
        }
      }
    }, true);
  });
}

// 性别显示：男女出图标，其他（韩吉/不明等）原样显示文字
function relGenderIcon(g){
  g = (g || '').trim();
  if (!g) return '';
  if (g === '男' || /^male$/i.test(g))   return '♂';
  if (g === '女' || /^female$/i.test(g)) return '♀';
  return '⚧' + esc(g); // 其他性别，原样带出
}

function relInfo(r){

      gender: r.targetGender || '',
      job: r.targetJob || '',

// 把角色的社会关系整理成一段给 AI 看的"人物清单"
function buildRelationBrief(c){
  var rels = (c.relations || []);
  if (!rels.length) return '';
  var lines = [];
  rels.forEach(function(r){
    var name, gender, job;
    if (r.targetId === 'npc') {
      name   = r.targetName || '(未命名)';
      gender = r.targetGender || '';
      job    = r.targetJob || '';
    } else {
      var t = getC(r.targetId);
      if (!t) return; // 已删除的角色跳过
      name   = t.name || t.nick || '?';   // 真名优先
      gender = t.gender || '';
      job    = t.job || '';
    }
    var parts = [];
    if (gender) parts.push(gender);
    if (job)    parts.push(job);
    var meta = parts.length ? '（' + parts.join('，') + '）' : '';
    var rel  = r.relationType ? ('，与你的关系：' + r.relationType) : '';
    var desc = r.description ? ('，' + r.description) : '';
    lines.push('· ' + name + meta + rel + desc);
  });
  if (!lines.length) return '';
  return '\n\n【你生活中已存在的人物（剧情需要时优先让他们登场，别另起炉灶）】\n' + lines.join('\n');
}

// 折叠切换函数（放在全局，和 renderCharEdit 平级）
function toggleFold(header) {
  var body = header.nextElementSibling;
  var arrow = header.querySelector('.fold-arrow');
  if (!body || !body.classList.contains('fold-body')) return;
  var isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    if (arrow) arrow.classList.remove('open');
  } else {
    body.classList.add('open');
    if (arrow) arrow.classList.add('open');
  }
}

let _settling=false;
async function settleMoments() {
  if (_settling) return;
  _settling = true;

  var now = Date.now();
  var dirty = false;
  var gained = 0;

  try {
    var targets = DB.moments.filter(function(m) {
      return m.author === 'me' && !m._settled;
    }).map(function(m) { return m.id; });

    for (var idx = 0; idx < targets.length; idx++) {
      var pid = targets[idx];
      var m = DB.moments.find(function(x) { return x.id === pid; });
      if (!m || m._settled) continue;

      if (!m._due) {
        m._due = now + (20000 + Math.random() * 100000);
        dirty = true;
        continue;
      }

      if (Date.now() < m._due) continue;

      m._settled = true;
      dirty = true;

      var pool = DB.contacts.filter(function(c) {
        return !c._draft && c.activity !== '关';
      });
      if (!pool.length) {
        save();
        continue;
      }

      var n = Math.min(pool.length, 1 + Math.floor(Math.random() * 2));
      var picked = pool.slice().sort(function() {
        return Math.random() - 0.5;
      }).slice(0, n);

      for (var j = 0; j < picked.length; j++) {
        var c = picked[j];
        try {
          var r = await aiReactMoment(c, m);
          var ch = false;

          if (r && r.like) {
            m.likes = m.likes || [];
            if (!m.likes.includes(c.id)) {
              m.likes.push(c.id);
              ch = true;
            }
          }

          if (r && r.comment) {
            m.comments = m.comments || [];
            m.comments.push({ by: c.id, text: r.comment });
            ch = true;
          }

          if (ch) {
            gained++;
            // ---- 新增：回复未读计数（用 momentReplyUnread） ----
            DB.momentReplyUnread = (DB.momentReplyUnread || 0) + 1;
            refreshMomentBadge();
            save();

            if (view.type === 'moments') renderMoments();
          }
        } catch (e) {
          // 静默失败
        }
      }
    }
  } finally {
    _settling = false;
    if (dirty) save();
    // ---- 移除原 markMomentUnread(gained)，因为已改用 momentReplyUnread ----
    // if (gained > 0 && view.type !== 'moments') markMomentUnread(gained);
    refreshMomentBadge();
  }
}
async function aiReactMoment(c, m) {
  // 【模型选择】评论回复(_isReply)是用户会看到的对话，用主模型更有人设味；
  // 自动点赞/评论量大，维持辅助模型省钱。
  var model = m._isReply
    ? (DB.settings.chatModel || DB.settings.auxModel)   // 评论回复 → 主模型优先
    : (DB.settings.auxModel || DB.settings.chatModel);  // 自动互动 → 辅助模型优先
  if (!model) return {};

  // 构建角色人设（失败则用兜底提示）
  var sys;
  try {
    sys = buildSystem(c);
  } catch (e) {
    sys = '你扮演「' + (c.nick || c.name) + '」，完全代入其身份、性格与说话口吻，绝不出戏。';
  }

  // 根据场景组织任务提示
  var task;
  if (m._isReply) {
    // 场景一：回复用户在评论区对你说的话
    task = '【场景：微信朋友圈评论区对话】\n' + m.text +
      '\n\n请严格以你（' + (c.nick || c.name) + '）的人设、性格、说话风格来回应，务必承接上文、别答非所问。回复要短，一句话即可。' +
      '只输出JSON，不要解释或代码块：{"like":false,"comment":"你的回复"}';
  } else {
    // 场景二：刷朋友圈看到别人动态，决定是否点赞/评论
    task = '【场景：你正在刷微信朋友圈，看到对方发了一条动态】\n内容：「' + (m.text || '(纯图片)') + '」' +
      (m.images && m.images.length ? '（附带图片，请结合图片内容）' : '') +
      '\n\n请严格按你上面的人设与说话风格，决定是否点赞、是否评论。评论要求：①短，一般不超过15字；②完全贴合你的性格口吻；③【底线】即使性格毒舌/傲娇/爱说反话，也绝不能否定核心关系、不能说"不爱你/讨厌你/分手"这类崩人设的伤人话，反话只停在打趣。\n' +
      '只输出JSON，不要解释或代码块：{"like":true或false,"comment":"评论内容，不评论就填空字符串"}';
  }

  // 组装消息（自动互动场景才带图片给模型看）
  var content = [{ type: 'text', text: task }];
  if (m.images && m.images.length && !m._isReply) {
    content.push({ type: 'image_url', image_url: { url: m.images[0] } });
  }
  var messages = [
    { role: 'system', content: sys },
    { role: 'system', content: '现在是朋友圈场景，只输出要求的那个JSON，不要任何多余文字、不要小说旁白、不要动作神态描写。' },
    { role: 'user', content: content }
  ];

  // 调用AI并解析JSON（解析失败时安静返回空对象，避免整个流程报错）
  try {
    var out = await callAI(messages, model);
    out = out.replace(/```json/gi, '').replace(/```/g, '').trim();
    var mm = out.match(/\{[\s\S]*\}/);
    if (mm) out = mm[0];
    return JSON.parse(out);
  } catch (e) {
    console.error('朋友圈互动解析失败（' + (c.nick || c.name) + '）：', e);
    return {};
  }
}
function maybeAutoPost(){
  var now = Date.now();
  var todayStr = _todayStr();

  // 按角色独立记录冷却时间和每日次数
  DB.settings.momentPerChar = DB.settings.momentPerChar || {};

  var pool = DB.contacts.filter(function(c){
    return !c._draft && (c.activity==='中' || c.activity==='高') && c.mode !== 'offline';
  });
  if(!pool.length) return;

  var c = pool[Math.floor(Math.random()*pool.length)];

  var cfg = c.activity==='高'
    ? { gap: 4*3600000, daily: 2, chance: 0.4 }   // 高：隔4h，每天≤2条，40%
    : { gap: 8*3600000, daily: 1, chance: 0.25 };  // 中：隔8h，每天≤1条，25%

  // 取该角色的独立记录
  var rec = DB.settings.momentPerChar[c.id];
  if(!rec || rec.date !== todayStr){
    rec = { date: todayStr, count: 0, lastPost: 0 };
    DB.settings.momentPerChar[c.id] = rec;
  }

  if(now - rec.lastPost < cfg.gap) return;    // 该角色自己的冷却
  if(rec.count >= cfg.daily) return;           // 该角色自己的每日上限
  if(Math.random() > cfg.chance) return;       // 概率门

  rec.lastPost = now;
  rec.count++;
  save();
  aiPostMoment(c.id, true);
}

function _daySlot(){const h=new Date().getHours();if(h<6)return'深夜';if(h<12)return'早';if(h<18)return'中';return'晚';}
async function checkAutoGreet() {
  if (replying) return;
  if (!DB.settings.chatModel) return;

  const now = new Date();
  const hour = now.getHours();
  let slot = '';
  if (hour >= 6 && hour < 9) slot = '清晨';
  else if (hour >= 9 && hour < 12) slot = '上午';
  else if (hour >= 12 && hour < 14) slot = '中午';
  else if (hour >= 14 && hour < 18) slot = '下午';
  else if (hour >= 18 && hour < 23) slot = '夜晚';
  else slot = '深夜';

  const today = now.toDateString();

  for (const c of DB.contacts) {
    // 离线模式不触发主动问候
    if (c.mode === 'offline') continue;
    // 时间衰减检查
    checkTimeDecay(c);
    // 被角色拉黑或用户拉黑，跳过
    if (c.isBlockedByChar || c.isBlockedByUser) continue;
    // 基本过滤：草稿、不在聊天列表、活跃度关、关闭主动问候
    if (c._draft || !c.inChatList || c.activity === '关' || c.allowAutoGreet === false) continue;

    // 初始化 greetLog
    if (!c.greetLog) c.greetLog = {};

    // 获取最后一条消息
    var msgs = DB.chats[c.id] || [];
    var lastMsg = msgs.length ? msgs[msgs.length - 1] : null;

    // 连吃两次闭门羹就闭嘴
    if (lastMsg && lastMsg.role === 'assistant') {
      if ((c.greetLog.noReplyCount || 0) >= 2) continue;
    } else {
      c.greetLog.noReplyCount = 0;
    }

    // 问候记录：每天重置，每个时段只能发一次
    if (c.greetLog.date !== today) {
      c.greetLog = { date: today, 清晨: false, 上午: false, 中午: false, 下午: false, 夜晚: false, 深夜: false, lastTime: c.greetLog.lastTime || 0, noReplyCount: c.greetLog.noReplyCount || 0 };
    }
    // 当前时段已发过，跳过
    if (c.greetLog[slot]) continue;

    // 深夜不主动打招呼
    if (slot === '深夜') continue;

    // 最近30分钟内有过任何消息（含AI刚回复），说明刚聊过，不主动打招呼
    if (lastMsg && Date.now() - lastMsg.time < 30 * 60 * 1000) continue;

    // 距上次打招呼不足 90 分钟，跳过
    if (c.greetLog.lastTime && Date.now() - c.greetLog.lastTime < 90 * 60 * 1000) continue;

    // 粘人度低于 20，不主动打招呼
    const cling = Math.min(100, Math.max(0, c.clinginess || 50));
    if (cling < 20) continue;

    // 用粘人度 + 好感度计算概率
    const favor = Math.min(100, Math.max(0, c.status.好感度 || 50));
    const base = 0.02;
    const clingBonus = (cling / 100) * 0.6;
    const favorBonus = favor > 20 ? ((favor - 20) / 100) * 0.2 : 0;
    const prob = Math.min(0.9, base + clingBonus + favorBonus);

    if (Math.random() < prob) {
      c.greetLog[slot] = true;
      c.greetLog.lastTime = Date.now();
      save();

      await doAutoGreet(c, slot);
      break; // 一次只发一个角色，防止刷屏
    }
  }
}
async function doAutoGreet(c, slot) {
  // ===== 0. 离线模式绝对禁止 =====
  if (c.mode === 'offline') return;
  // ===== 1. 前置检查 =====
  if (c.isBlockedByChar || c.isBlockedByUser) return;
  const model = DB.settings.lightModel || DB.settings.auxModel || DB.settings.chatModel;
  if (!model) {
    console.warn('自动问候：没有可用模型，跳过');
    return;
  }

  // ===== 2. 构造提示语（含时间段） =====
  const periodTxt = { '清晨': '清晨', '上午': '上午', '中午': '中午', '下午': '下午', '夜晚': '晚上', '深夜': '深夜' }[slot] || '现在';
  const nudge =
    `（现在是${periodTxt}，你主动给对方发微信。要求：\n` +

    `③口语化、自然，符合你的人设与当前作息心情；\n` +
    `④绝对禁止"早上好/晚上好/吃了吗/在吗"这类空洞客套模板。只输出要发的话本身。）`;
  // 提取最近几条有实质内容的消息，作为话题锚点注入 system
  const recentTexts = (DB.chats[c.id] || [])
    .filter(m => m.type === 'text' && m.content && m.content.trim().length > 2)
    .slice(-3)
    .map(m => (m.role === 'user' ? '对方说：' : '你说：') + m.content.trim())
    .join('\n');
  const topicHint = recentTexts ? `\n\n【最近话题参考，续写时优先参考】\n${recentTexts}` : '';
  try {
      let c2cHint = '';
    try {
      const _c2c = getC2CContextFor(c.id);
      if (_c2c) {
        c2cHint = '\n（另外：你最近在朋友圈有一些互动。如果其中有让你想吐槽、告状、分享或安利给对方的事'
                + '——比如和谁在评论区拌了嘴、被安利/发现了什么好东西、被夸得很开心——'
                + '你可以很自然地借这次消息说给对方听，就像朋友随口聊近况。若没什么特别的就别提。）';
      }
    } catch(e) {}

    // ===== 3. 构建历史 + 系统提示 =====
    // ★出发前记录历史快照，用于生成后核对，防止竞态脱节
    const _greetBaseLen = (DB.chats[c.id] || []).length;
    const _greetBaseLastId = _greetBaseLen ? DB.chats[c.id][_greetBaseLen - 1].id : null;
    const hist = (DB.chats[c.id] || []).slice(-10).map(toApiMsg);
    const messages = [
      { role: 'system', content: buildSystem(c, (function(){
        var msgs = DB.chats[c.id] || [];
        var lastMsg = msgs[msgs.length-1];
        if(!lastMsg) return null;
        if(Date.now() - lastMsg.time < 30*60*1000) return null;
        var d = new Date(lastMsg.time);
        var dh = d.getHours();
        var dp = dh<6?'凌晨':dh<9?'清晨':dh<12?'上午':dh<14?'中午':dh<18?'下午':dh<23?'晚上':'深夜';
        var nowD = new Date();
        var diffDays = Math.floor((Date.now() - lastMsg.time)/86400000);
        var timeStr = '';
        if(d.toDateString()===nowD.toDateString()){
          timeStr = '今天 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'（'+dp+'）';
        } else if(diffDays===1){
          timeStr = '昨天 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'（'+dp+'）';
        } else {
          timeStr = diffDays+'天前';
        }
        return '【时间提示】上一条消息发于'+timeStr+'。';
      })()) + topicHint },
      { role: 'system', content: '【立即生效·最高优先级】现在是微信线上打字聊天：只输出口语短句，句子要短，禁止括号里的动作/神态/心理描写，禁止旁白，禁止长段落。多句用换行分隔，且总共不超过2句。' },
      ...hist,
      { role: 'user', content: nudge + c2cHint }

    ];

    // ===== 4. 调用 AI + 应用状态变化 =====
    let out = await callAI(messages, model);
    // ★核对：生成期间历史是否变过（你发了消息 / 主模型回复落库 / 正在生成）？变了就放弃这次打招呼
    const _nowLen = (DB.chats[c.id] || []).length;
    const _nowLastId = _nowLen ? DB.chats[c.id][_nowLen - 1].id : null;
    if (_nowLen !== _greetBaseLen || _nowLastId !== _greetBaseLastId || replying) {

      if (c.greetLog && slot) { c.greetLog[slot] = false; c.greetLog.lastTime = 0; } // 退回配额，稍后可重试

    const parts = parseAIMessage(out);
    if (!parts.length) return;

    // ===== 6. 遍历解析结果，构造消息对象 =====
    DB.chats[c.id] = DB.chats[c.id] || [];

      if (part.type === 'transfer_refund') continue;
      if (part.type === 'block_player') continue;              // 主动问候不拉黑

      switch (part.type) {
        case 'voice':

            id: newId(),
            role: 'assistant',
            type: 'voice',
            content: part.content,
            time: Date.now(),
            voiceExpanded: false
          };
          break;

case 'sticker': {

    } else {
        msgObj = null; // 不存在就丢掉
    }
    break;
}
        case 'transfer':

          msgObj = {
            id: newId(),
            role: 'assistant',
            type: 'transfer',
            from: 'ai',
            amount: part.amount,
            content: part.content || '',
            status: 'pending',
            time: Date.now()
          };
          break;

        case 'text':
          // 普通文本（可能有撤回标记，但主动问候不会主动撤回，忽略 recalled）
          if (part.recalled) {
            // 若真的出现撤回，直接当普通文本显示“撤回了一条消息”？
            // 更合理的是把撤回内容当作普通文本显示（但主动问候极少），我们只发内容。
            const txt = part.recalledContent || '';
            if (txt.trim()) {
              msgObj = {
                id: newId(),
                role: 'assistant',
                type: 'text',
                content: txt.trim(),
                time: Date.now()
              };
            }
          } else if (part.content && part.content.trim()) {
            msgObj = {
              id: newId(),
              role: 'assistant',
              type: 'text',
              content: part.content.trim(),
              time: Date.now()
            };
          }
          break;

        default:
          // 其他类型（如 action）忽略
          break;
      }

      if (msgObj) {
        DB.chats[c.id].push(msgObj);
        // 如果用户正在看这个角色的聊天，实时追加消息，不刷新整个页面
        if (view.type === 'chat' && view.id === c.id) {
          appendBubble(c, msgObj);
        }
        cnt++;
      }
	  }

    if (cnt === 0) return;
	    // 消息确实发出去了，才记一次碰壁待观察
    c.greetLog.noReplyCount = (c.greetLog.noReplyCount || 0) + 1;
    save();
    // ★★ 打招呼随手拍（30%概率 + 限额控制）★★
    if (canSendImage(c.id) && Math.random() < 0.15) {
      try {

      scrollBottom();
    } else {
      markChatUnread(c.id, cnt);
    }
  } catch (e) {
    console.warn('doAutoGreet 出错:', e);
  }

// 【辅助1】找出"此刻"命中的行程条目（没有则返回 null）
function findCurrentScheduleItem(c) {
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  var todaySch = (c.schedules || []).find(function(s) { return s.date === todayStr; });
  if (!todaySch || !todaySch.items || !todaySch.items.length) return null;

  var nowMin = today.getHours() * 60 + today.getMinutes();
  var hit = null;
  todaySch.items.forEach(function(it) {
    var sp = (it.start || '00:00').split(':');
    var startMin = parseInt(sp[0]) * 60 + parseInt(sp[1]);
    if (startMin <= nowMin) hit = it;
  });
  if (!hit) hit = todaySch.items[todaySch.items.length - 1];
  return hit;
}

// 【辅助2】取最近聊天记录 + 距上次消息多久
function getRecentChatForWatch(cid) {
  var msgs = (DB.chats && DB.chats[cid]) ? DB.chats[cid] : [];
  var valid = msgs.filter(function(m) { return m && m.role !== 'system'; });
  var recent = valid.slice(-7);

  var lines = recent.map(function(m) {
    var who = (m.role === 'user') ? '用户' : 'TA';
    var body;
    if (m.type === 'text') body = m.content || '';
    else if (m.type === 'voice') body = '[语音]' + (m.content || '');
    else if (m.type === 'image') body = '[图片]';
    else if (m.type === 'sticker') body = '[表情]';
    else if (m.type === 'transfer') body = '[转账 ' + (m.amount || '') + ']';
    else body = m.content || '[消息]';
    if (m.recalled) body = '[撤回了一条消息]';
    return who + '：' + body;
  }).join('\n');

  var last = valid[valid.length - 1];
  var gapMin = last && last.time ? Math.round((Date.now() - last.time) / 60000) : null;

  return { lines: lines || '（最近没有聊天记录）', gapMin: gapMin };
}

// 【辅助3】清理录像：没收藏的最多留 10 条，收藏的永久保留
function trimWatchLogs(c) {
  var starred = c.watchLogs.filter(function(w) { return w.starred; });
  var normal  = c.watchLogs.filter(function(w) { return !w.starred; });
  normal.sort(function(a, b) { return b.time - a.time; });
  if (normal.length > 10) normal = normal.slice(0, 10);
  c.watchLogs = starred.concat(normal).sort(function(a, b) { return b.time - a.time; });
}

var _scheduleDate = null; // 当前查看的日期字符串 '2026-07-19'

function renderSchedule() {
  var c = getC(view.id);
  if (!c) { goHome(); return; }
  var _cb = document.getElementById('chatBottom'); if (_cb) _cb.remove(); // 清掉残留的聊天输入框

  showChrome(true, false);
  statusbar.classList.add('dark');
  var displayName = (c.name && c.name.trim() && c.name !== '新角色') ? c.name : (c.nick || '未命名');
tbTitle.textContent = displayName + ' 的行程';
  tbLeft.textContent = '‹';
  tbLeft.onclick = function() { 
    if (window._scheduleTimer) { clearTimeout(window._scheduleTimer); window._scheduleTimer = null; }
    if (window._scheduleFrom === 'chat') { window._scheduleFrom = null; view = { type: 'chat', id: c.id }; }
    else view = { type: 'heartDetail', id: c.id }; 
    render(); 
  };
  tbRight.textContent = '';
  tbRight.onclick = null;

  // 初始化日期为今天
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  if (!_scheduleDate) _scheduleDate = todayStr;

  var schedules = c.schedules || [];
  schedules.sort(function(a, b) { return b.date.localeCompare(a.date); });

  var currentDay = schedules.find(function(s) { return s.date === _scheduleDate; });
  var dateNavHtml = buildDateNav(c, schedules, todayStr);

  var html = '<div style="padding:12px 16px 20px;">';
  html += dateNavHtml;
  html += '<div style="height:1px;background:var(--line);margin:8px 0 16px;"></div>';

  var isToday = (_scheduleDate === todayStr);

  // ===== 计算当前进行中的时间段索引（用于高亮） =====
  var now = new Date();
  var nowMinutes = now.getHours() * 60 + now.getMinutes();
  var currentItemIndex = -1;

  if (currentDay && currentDay.items && currentDay.items.length && isToday) {
    var items = currentDay.items;
    for (var i = 0; i < items.length; i++) {
      var startParts = items[i].start.split(':');
      var startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
      if (startMinutes <= nowMinutes) {
        currentItemIndex = i;
      }
    }
  }

  // ===== 渲染卡片 =====
  if (currentDay && currentDay.items && currentDay.items.length) {
    var items = currentDay.items;
    var cardsHtml = items.map(function(item, idx) {
      var startParts = item.start.split(':');
      var startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
      var status = 'future';
      if (isToday) {
        if (startMinutes < nowMinutes) status = 'past';
        else if (startMinutes <= nowMinutes + 60) status = 'current';
        else status = 'future';
      } else {
        status = 'past';
      }
      // 额外标记当前进行中的索引
      var isCurrent = (idx === currentItemIndex && isToday);
      return buildScheduleCard(item, status, isCurrent);
    }).join('');

    html += cardsHtml;

    // ===== 刷新按钮：只有今天且有数据时才显示 =====
    if (isToday) {
      html += '<div style="display:flex;justify-content:center;margin-top:16px;">';
      html += '<button class="btn" style="width:80%;margin:0 auto;display:block;" onclick="generateSchedule(\'' + c.id + '\')">🔄 刷新今日行程（5💗）</button>';
      html += '</div>';
    }

  } else {
    // 没有行程数据
    if (isToday) {
      html += '<div style="text-align:center;padding:40px 0 20px;color:var(--sub);font-size:14px;line-height:2;">';
      html += '🌙 今天还没留下轨迹';
      html += '</div>';
      html += '<div style="display:flex;justify-content:center;">';
      html += '<button class="btn" style="width:80%;margin:0 auto;display:block;" onclick="generateSchedule(\'' + c.id + '\')">✨ 生成今日行程（5💗）</button>';
      html += '</div>';
    } else {
      html += '<div style="text-align:center;padding:50px 0;color:var(--sub);font-size:14px;">📭 这天没有留下行程记录</div>';
    }
  }

  html += '<div style="text-align:center;margin-top:20px;font-size:11px;color:var(--sub);opacity:0.4;">只保留最近 5 天的行程 · 每次生成消耗 5💗</div>';
  html += '</div>';
  content.innerHTML = html;

  // ===== 定时器：计算到下一个时间段的剩余时间，到时自动刷新 =====
  if (window._scheduleTimer) { clearTimeout(window._scheduleTimer); window._scheduleTimer = null; }

  if (isToday && currentDay && currentDay.items && currentDay.items.length) {
    var items = currentDay.items;
    var nextStartMinutes = null;
    var nowMinutesNow = new Date().getHours() * 60 + new Date().getMinutes();

    for (var j = 0; j < items.length; j++) {
      var parts = items[j].start.split(':');
      var startMin = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      if (startMin > nowMinutesNow) {
        nextStartMinutes = startMin;
        break;
      }
    }

    if (nextStartMinutes !== null) {
      var nowMs = Date.now();
      var targetDate = new Date();
      targetDate.setHours(Math.floor(nextStartMinutes / 60), nextStartMinutes % 60, 0, 0);
      var delay = targetDate.getTime() - nowMs + 1000; // 加1秒缓冲
      if (delay > 0 && delay < 24 * 60 * 60 * 1000) {
        window._scheduleTimer = setTimeout(function() {
          if (view.type === 'schedule') {
            renderSchedule();
          }
        }, delay);
      }
    }
  }
}

function buildDateNav(c, schedules, todayStr) {
  // 从 schedules 中提取所有日期，加上今天
  var dates = {};
  schedules.forEach(function(s) { dates[s.date] = true; });
  // 确保今天在列表里（即使没有数据）
  dates[todayStr] = true;

  var dateList = Object.keys(dates).sort();
  // 如果当前日期不在列表中，加入并排序
  if (dateList.indexOf(_scheduleDate) === -1) {
    dateList.push(_scheduleDate);
    dateList.sort();
  }

  var currentIndex = dateList.indexOf(_scheduleDate);
  var prevDate = currentIndex > 0 ? dateList[currentIndex - 1] : null;
  var nextDate = currentIndex < dateList.length - 1 ? dateList[currentIndex + 1] : null;

  var displayDate = _scheduleDate;
  var displayLabel = _scheduleDate;
  if (_scheduleDate === todayStr) {
    displayLabel = '今天';
  } else {
    // 格式化显示
    var parts = _scheduleDate.split('-');
    displayLabel = parts[1] + '月' + parts[2] + '日';
  }

  var hasPrev = prevDate !== null;
  var hasNext = nextDate !== null;

  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;">' +
    '<span style="font-size:20px;cursor:pointer;color:var(--sub);' + (hasPrev ? '' : 'opacity:0.2;pointer-events:none;') + '" onclick="' + (hasPrev ? 'changeScheduleDate(\'' + prevDate + '\')' : '') + '">‹</span>' +
    '<span style="font-size:16px;font-weight:500;color:var(--text);">' + displayLabel + '</span>' +
    '<span style="font-size:20px;cursor:pointer;color:var(--sub);' + (hasNext ? '' : 'opacity:0.2;pointer-events:none;') + '" onclick="' + (hasNext ? 'changeScheduleDate(\'' + nextDate + '\')' : '') + '">›</span>' +
    '</div>';
}

function changeScheduleDate(dateStr) {
  _scheduleDate = dateStr;
  renderSchedule();
}

// 展示结果（当天缓存或刚生成，都走这里）
function showMoodResult(c, mood){
  var name = c.name || c.nick;
  var msg = mood.emoji + ' 今天：' + mood.label + '\n\n' +
            '「' + (c.todayMood.note||'') + '」' +
            (c.todayMood.whisper ? '\n\n💭 没说出口的话：\n' + c.todayMood.whisper : '');

}

async function generateSchedule(cid) {
  var c = getC(cid);
  if (!c) return;
  var userName = DB.me.realName || DB.me.name || '对方';

  // ── 1. 前置检查：心动值、模型 ──
  if ((c.hearts || 0) < 5) {
    popTip('当前 ' + (c.hearts || 0) + '💗，需要 5💗\n多和 ' + (c.nick || c.name) + ' 聊天可以增加哦～', { icon: '💔', title: '💗 不足' });
    return;
  }
  var model = DB.settings.chatModel || DB.settings.auxModel;
  if (!model) {
    popTip('请先在设置里选择模型', { icon: '⚙️', title: '提示' });
    return;
  }

  var displayName = (c.name && c.name.trim() && c.name !== '新角色') ? c.name : (c.nick || '未命名');
popLoading('正在调取 ' + displayName + ' 的今日行程…');

  try {
    // ── 2. 准备时间信息 ──
    var now = new Date();
    var dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
    var weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    var weekday = weekdays[now.getDay()];
    var persona = buildSystem(c); // 复用已有的人设构建

    // ── 3. 组装提示词（核心：时间连续 + 一句话带萌感/小走神） ──
    var prompt =
      '【任务】你是「' + (c.nick || c.name) + '」本人。今天是 ' + dateStr + ' ' + weekday + '。\n' +
      '请根据你的性格、身份、日常习惯，生成你今天一整天的行程记录。\n\n' +

      '【时间连续 · 硬性规则】\n' +
      '1. 从早上起床到深夜睡觉，时间段必须【首尾相接】：上一条的 end 就是下一条的 start，不允许出现超过 30 分钟的空白。\n' +
      '2. 除了上班、开会这种"正事"，中间的过渡时段（通勤、吃饭、发呆、休息、做家务、刷手机等）也要如实填上，这些琐碎才是真实生活。\n' +
      '3. 全天只生成 4~5 个时段，每段跨度大一点，别切太碎。\n\n' +

'【内容风格 · 要有真实的生活质感】\n' +
'★【重要·独立生活】你有自己的生活，不要每条都提到 ' + userName + '、不要满脑子都是 ' + userName + '。全天最多只有 1 条可以和 ' + userName + ' 有关，其余都写你自己的事（工作、吃饭、爱好、发呆、烦心事等），像一个有独立日常的真实的人。\n' +
      '1. 每条 15~35 字，一句话生活记录，不要大段内心独白。\n' +
      '2. 大部分平实即可，别每条都卖萌走神。\n' +
      '3. 【关键·不确定感】行为不用写死，可以像真人一样带点摇摆：用"也可能""或者""大概率"来给出另一种可能。例如"吃午饭，边吃边刷剧，也可能就单纯吃饭"。\n' +
      '4. 【关键·具体落地】能具体就别抽象——写"点杯霸王茶姬提神"而不是"喝饮料"，写"啃小龙虾追剧"而不是"吃夜宵"。用具体的东西带出烟火气（结合角色所在世界观，现代就用现代的东西）。\n' +
      '5. 【关键·心口不一的自嘲】偶尔来一条"说一套做一套"的：嘴上打算做A，括号里自己拆穿大概率会变成B。例如"洗漱准备睡觉（不过大概率还是熬夜刷手机）"。\n' +
      '6. 有地点就写(location)，没有留空。要贴合身份、性格、世界观。\n\n' +

      '【正确示例（体会那股"真实、具体、带点自嘲"的味道）】\n' +
      '07:30 起床，磨蹭着洗漱，脑子还没开机\n' +
      '08:30 通勤路上，随便刷刷手机\n' +
      '10:00 开会，正事听着，忍不住的时候就盯着窗外发呆\n' +
      '12:30 吃午饭，边吃边刷剧，也可能就单纯吃个饭\n' +
      '15:00 处理杂事，有点犯困但不能睡，强忍，或者点杯霸王茶姬提神\n' +
      '19:00 瘫沙发上，可能找人聊聊天，或者一边啃小龙虾一边追剧\n' +
      '22:30 洗漱收拾明天要用的东西，收拾完就睡（不过大概率还是熬夜刷手机😪）\n\n' +

      '【错误示例】\n' +
      '❌ "参加部门会议"（太干，没有生活感）\n' +
      '❌ "蜷缩在缓存里偷偷看主人的睡眠数据，纠结要不要唤醒"（太长、太像心理小作文）\n\n' +

      '【输出格式】只输出一个 JSON 数组，不要任何解释：\n' +
      '[{"start":"09:30","end":"10:00","location":"卧室","content":"赖床刷手机，纠结早饭吃不吃"}, ...]\n\n' +

      '你的人设参考：\n' + persona;

    var messages = [
      { role: 'system', content: '你是一个角色扮演助手，请完全代入角色视角。只输出 JSON 数组，不要任何其他文字。' },
      { role: 'user', content: prompt }
    ];

    // ── 4. 调用 AI 并解析 ──
    var out = await callAI(messages, model);
    out = out.replace(/```json/gi, '').replace(/```/g, '').trim();
    var match = out.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('AI 返回格式不正确');
    var items = JSON.parse(match[0]);
    if (!Array.isArray(items) || items.length < 3) throw new Error('生成的数据太少');

    // ── 5. 扣心动值 ──
    c.hearts = (c.hearts || 0) - 5;
    c.heartLog = c.heartLog || [];
    c.heartLog.unshift({ t: Date.now(), n: -5, reason: '📅 生成今日行程' });
    if (c.heartLog.length > 200) c.heartLog.pop();

    // ── 6. 存储行程（同一天覆盖旧的，只留最近 5 天） ──
    var todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    c.schedules = (c.schedules || []).filter(function(s) { return s.date !== todayStr; });
    c.schedules.push({ date: todayStr, items: items });
    c.schedules.sort(function(a, b) { return b.date.localeCompare(a.date); });
    if (c.schedules.length > 5) c.schedules = c.schedules.slice(0, 5);

    // ── 7. 收尾：保存、刷新视图 ──
    save();
    popClose();
    _scheduleDate = todayStr;
    renderSchedule();
    popTip('✨ 已生成 ' + (c.nick || c.name) + ' 的今日行程', { icon: '📅', title: '生成完成' });

  } catch (e) {
    popClose();
    popTip('生成失败：' + e.message, { icon: '⚠️', title: '出错了' });
  }
}
function buildScheduleCard(item, status, isCurrent) {
  var statusIcon = '';
  var statusColor = '';
  var statusLabel = '';
  var cardStyle = '';
  var timeColor = '';
  var contentStyle = '';
  var timeDisplay = '';

  // 确保时间段显示
  var startDisplay = item.start || '--:--';
  var endDisplay = item.end || '--:--';
  timeDisplay = startDisplay + ' — ' + endDisplay;

  if (status === 'past') {
    statusIcon = '✅';
    statusColor = 'var(--sub)';
    statusLabel = '已完成';
    timeColor = 'var(--sub)';
    cardStyle = 'opacity:0.65;';
    contentStyle = 'text-decoration:line-through;text-decoration-color:var(--sub);';
  } else if (status === 'current' || isCurrent) {
    statusIcon = '◀';
    statusColor = 'var(--theme)';
    statusLabel = '进行中';
    timeColor = 'var(--theme)';
    // 修复：使用 rgba 正确处理背景色
    var themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme').trim() || '#B34A6A';
    cardStyle = 'border-left:3px solid ' + themeColor + ';background:' + themeColor + '08;';
    contentStyle = '';
  } else {
    statusIcon = '⏳';
    statusColor = 'var(--sub)';
    statusLabel = '即将开始';
    timeColor = 'var(--text)';
    cardStyle = '';
    contentStyle = '';
  }

  return '<div style="margin:10px 0;padding:14px 16px;background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,0.06);' + cardStyle + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
      '<span style="font-size:14px;font-weight:600;color:' + timeColor + ';">' + timeDisplay + '</span>' +
      '<span style="font-size:12px;color:' + statusColor + ';font-weight:500;">' + statusIcon + ' ' + statusLabel + '</span>' +
    '</div>' +
    (item.location ? '<div style="font-size:13px;color:var(--sub);margin-bottom:4px;' + contentStyle + '">📍 ' + esc(item.location) + '</div>' : '') +
    '<div style="font-size:15px;color:var(--text);line-height:1.6;white-space:pre-wrap;' + contentStyle + '">' + esc(item.content) + '</div>' +
    '</div>';
}
/* ===== 备忘录 ===== */
function fmtDate(t) {
  var d = new Date(t);
  var Y = d.getFullYear();
  var M = String(d.getMonth() + 1).padStart(2, '0');
  var D = String(d.getDate()).padStart(2, '0');
  var h = String(d.getHours()).padStart(2, '0');
  var m = String(d.getMinutes()).padStart(2, '0');
  return Y + '-' + M + '-' + D + ' ' + h + ':' + m;
}
function renderMemoMain() {
  showChrome(true, false);
  statusbar.classList.add('dark');
  tbTitle.textContent = '📒 备忘录';
  tbLeft.textContent = '‹';
  tbLeft.onclick = goHome;
  tbRight.textContent = '';
  tbRight.onclick = null;

  var cs = DB.contacts.filter(function(c) { return !c._draft; });
  if (!cs.length) {
    content.innerHTML = '<div class="empty">还没有角色，先去通讯录创建一个吧～</div>';
    return;
  }

  var html = '<div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;">';

function addMemo(cid, content, priority, type) {
  var c = getC(cid);
  if (!c) return;
  if (!c.memories) c.memories = [];
  var mem = {
    id: 'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    time: Date.now(),
    content: content,
    type: type || 'manual',     // 'manual' | 'auto'
    priority: priority || 'important',
    edited: false
  };
  c.memories.push(mem);
  // 同时写入 chapters（供 AI 使用）
  if (!c.chapters) c.chapters = [];
  var dateStr = new Date().toISOString().slice(0,10);
  c.chapters.push({ date: dateStr, content: '[记忆] ' + content });
  save();
}

function deleteMemo(cid, mid) {
  var c = getC(cid);
  if (!c) return;
  var mem = c.memories.find(function(m) { return m.id === mid; });
  if (!mem) return;
  popConfirm('确定要删除这条记忆吗？', function() {
    c.memories = c.memories.filter(function(m) { return m.id !== mid; });
    // 同步从 chapters 中移除对应的条目（按内容匹配，不精确则跳过）
    // 简单起见，我们按日期和内容前缀删除最近一条匹配的章节
    var idx = c.chapters.findIndex(function(ch) { return ch.content === '[记忆] ' + mem.content; });
    if (idx > -1) c.chapters.splice(idx, 1);
    save();
    renderMemoDetail(cid);
  }, { icon: '🗑️', title: '删除确认' });
}

function buildSystem(c, gapInfo){
  const st = c.status;

  const real = DB.me.realName;

  const add = (t, v) => v ? `${t}：${v}\n` : '';

  const wd = ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  const hh = now.getHours();
  const period = hh < 6 ? '凌晨' : hh < 9 ? '清晨' : hh < 12 ? '上午' : hh < 14 ? '中午' : hh < 18 ? '下午' : hh < 23 ? '晚上' : '深夜';

  let s = '';

  // ===== 第1层：预设插槽（写作要求·最高优先级） =====

  } else {
    s += (DB.settings.onlineStyle || DEFAULT_ONLINE) + '\n';
  }

  // ===== 第2层：角色核心身份 =====

  s += add('外貌', c.pLook);
  s += add('性格关键词(最重要)', c.pKeywords);
  s += add('行为模式(高优先级·必须遵循)', c.pBehavior);
  s += add('成长经历(内化,不主动解释,只体现在言行)', c.pBack);
  s += buildRelationBrief(c);

  // ===== 第3层：当前背景 =====
  s += `\n【当前背景】\n`;
  s += `现在是${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${wd} ${String(hh).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}（${period}）。请结合此刻时间与你的作息表现得像真实存在、能感知时间流逝的人。\n`;

  var world = (DB.worlds || []).find(function(w){ return w.id === c.worldId; });

    s += '\n【世界观】' + world.name + '：' + world.desc + '\n';

  // 今日行程

function toApiMsg(m){
  if(m.recalled)return{role:m.role,content:`（${m.role==='user'?'对方':'你'}撤回了一条消息${m.recalledContent?'，原内容是："'+m.recalledContent+'"':''}）`};
  if(m.type==='image'){
    var _isId = m.content && m.content.indexOf('img_')===0;
    if(_isId) return {role:m.role, content: (m.role==='user'?'（对方发来一张图片）':'（你发了一张图片）')};
    return {role:m.role, content:[{type:'text',text:'（发来一张图片，请看图回应）'},{type:'image_url',image_url:{url:m.content}}]};
  }
  if(m.type==='transfer')return{role:m.role,content:`（${m.role==='user'?'对方向你':'你向对方'}转账¥${m.amount}，备注：${m.content||'无'}）`};
  if(m.type==='redpacket')return{role:m.role,content:`（${m.role==='user'?'对方':'你'}发来红包¥${m.amount}：${m.content||'恭喜发财'}）`};
  if(m.type==='voice')return{role:m.role,content:`（语音消息）${m.content}`};
  if(m.type==='sticker')return{role:m.role,content:`（发了个表情：${m.content}）`};
  // ★ 新增：通话记录 —— 把整通电话的对话内容展开给 AI，它才记得聊过啥、谁挂的
  if(m.type==='callLog'){
    var _txt = '（你和对方进行了一次语音通话，时长'+(m.duration||'')+'。通话内容如下：\n';
    if(m.turns && m.turns.length){
      _txt += m.turns.map(function(t){
        return (t.role==='user'?'对方':'你')+'说：'+(t.content||'');
      }).join('\n');
    } else {
      _txt += '（无对话内容）';
    }
    _txt += '\n）';
    return { role:'assistant', content:_txt };   // 用assistant身份陈述这段通话事实
  }
  var content = m.editedContent || m.content;
  return{role:m.role,content:content};
}

function findSticker(name) {
  if (!name) return null;
  name = name.trim();
  var list = DB.stickers || [];

  // 1. 先试完全相等（最精准）
  var hit = list.find(function(s){ return s.name === name; });
  if (hit) return hit;

  // 2. 去掉括号备注再比一次，如 "（小狗）哭泣" → "哭泣"
  var clean = function(str){ return str.replace(/[（(【\[].*?[）)】\]]/g, '').trim(); };
  hit = list.find(function(s){ return clean(s.name) === clean(name); });
  if (hit) return hit;

  // 3. 互相包含就算命中，如 AI 说"哭" 命中 "（小狗）哭泣"
  hit = list.find(function(s){
    var a = clean(s.name), b = clean(name);
    return a && b && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0);
  });
  if (hit) return hit;

  // 4. 实在找不到
  return null;
}
function renderVoiceContent(text) {
  if (!text) return '';
  var out = esc(text);
  // 1. 老格式：中文括号（）里的 → 斜体（兼容旧数据）
  out = out.replace(/（([^）]+)）/g,
    ' <span style="font-style:italic;opacity:0.6;">$1</span> ');
  // 2. 新格式：*星号* 里的 → 斜体（前后加空格区分）
  out = out.replace(/\*([^*]+)\*/g,
    ' <span style="font-style:italic;opacity:0.6;">$1</span> ');
  return out;
}

        }),

      existingPosts.unshift(newPost);
      if (existingPosts.length > 60) existingPosts = existingPosts.slice(0, 60);

    }

    // 释放AI酱说客消息
    var aiChan = getC('c_aichan');
    if (aiChan && !aiChan.isBlockedByUser && Array.isArray(c.blockEventData.aiChanMsgs)) {

    if (view.type === 'chats') renderChats();
  }
}

    '设计这个角色尝试发送但被拦截的消息。\n' +

        '如果会发：内容匿名或用化名，暗戳戳指向这件事但不直接说名字，带1~3条路人评论。\n' +
        '如果不发：floatPost 返回 null。\n'

    '\n【任务三：AI酱说客】\n' +
    (aiChanAvailable
      ? 'AI酱是用户手机里的好朋友，热心肠但不是什么忙都帮。判断她会不会替这个角色来找用户说情。\n' +
        '如果会：写出AI酱发给用户的消息（可以是一条或几条），符合她轻松、不端着、有点碎嘴的风格。每条带 offsetMs。\n' +
        '如果不帮：aiChanMsgs 返回空数组。\n'
      : 'AI酱不可用，aiChanMsgs 直接返回空数组。\n') +
    '\n【输出格式】只输出一个JSON，不要其他文字：\n' +
    '{"intercepts":[{"content":"...","offsetMs":180000}],"floatPost":{"author":"...","content":"...","offsetMs":900000,"comments":[{"author":"...","content":"..."}]},"aiChanMsgs":[{"content":"...","offsetMs":3600000}]}\n' +
    'floatPost 为空时写 "floatPost":null，aiChanMsgs 为空时写 "aiChanMsgs":[]';

  try {
    var out = await callAI([{ role: 'user', content: prompt }], model);
    out = out.replace(/```json/gi, '').replace(/```/g, '').trim();

function checkTimeDecay(c) {
  if (!c || !c.lastActive) return;

  // 释放拉黑联动事件（统一由 flushBlockEvents 处理）
  flushBlockEvents();

  // 【新增】自动解除角色拉黑逻辑
  if (c.isBlockedByChar && c.blockedByCharAt) {
  var now = Date.now();
    var blockDuration = now - c.blockedByCharAt;
    var autoUnblockTime = 0;

    // 小情绪：4-12小时随机，这里取最大值12小时(43200000ms)作为保底自动解除时间
    // 大矛盾：24小时(86400000ms)
    if (c.blockedType === '小情绪') {
      autoUnblockTime = 12 * 60 * 60 * 1000; 
    } else {
      autoUnblockTime = 24 * 60 * 60 * 1000;
    }

    if (blockDuration >= autoUnblockTime) {
      c.isBlockedByChar = false;
      c.blockedByCharAt = 0;
      c.blockedType = '';
      // 如果当前正在聊天界面，插入一条系统提示
      if (view.type === 'chat' && view.id === c.id) {
        insertSystemMessage('🔓 ' + (c.nick || c.name) + ' 气消了，解除了对你的拉黑。');
      }
      save();
    }
  }
  // 【新增结束】

  // 原有的衰减频率限制（每2小时检查一次数值衰减）
  if (c._lastDecayCheck && Date.now() - c._lastDecayCheck < 7200000) return;

  var hours = (Date.now() - c.lastActive) / (1000 * 60 * 60);
  var decay = 0, trustDecay = 0, tensionRise = 0;

  if (hours > 72) { decay = -8; trustDecay = -5; tensionRise = 5; }
  else if (hours > 48) { decay = -5; trustDecay = -3; tensionRise = 3; }
  else if (hours > 24) { decay = -3; trustDecay = -2; tensionRise = 2; }
  else if (hours > 12) { decay = -1; trustDecay = -0.5; tensionRise = 1; }
  else { return; }

  c.status.好感度 = clamp(c.status.好感度 + decay);
  c.status.信任度 = clamp(c.status.信任度 + trustDecay);
  c.status.紧张感 = clamp(c.status.紧张感 + tensionRise);
syncClinginess(c);

  c._lastDecayCheck = Date.now();
  save();

  if (view.type === 'chat' && view.id === c.id) {
    insertSystemMessage('💤 你冷落了 ' + (c.nick || c.name) + ' ' + Math.round(hours) + ' 小时，TA 似乎有些疏远了。');
  }
}

/* 显示浮动小气泡菜单 */
function showBubbleMenu(items, el){
  var old=document.getElementById('popmenu');
  if(old&&old.parentNode) old.parentNode.removeChild(old);

  var pop=document.createElement('div');
  pop.id='popmenu';
  var html='<div class="pop-arrow"></div>';
  items.forEach(function(it,i){
    html+='<div class="pop-item'+(it.danger?' danger':'')+'" data-i="'+i+'">'+
          '<span class="pop-ico">'+it.ico+'</span><span>'+it.txt+'</span></div>';
  });
  pop.innerHTML=html;
  phone.appendChild(pop);

  pop.querySelectorAll('.pop-item').forEach(function(node){
    node.addEventListener('click',function(e){
      e.stopPropagation();
      var i=+node.dataset.i;
      closeBubbleMenu();
      items[i].fn();
    });
  });

  // 找到气泡本体（.msg 行里除头像外的那个元素），对准它而不是整行
  var bodyEl = el;
  var kids = el.children;
  for(var _k=0;_k<kids.length;_k++){
    if(!kids[_k].classList.contains('cavatar')){ bodyEl=kids[_k]; break; }
  }
  var b=bodyEl.getBoundingClientRect(), p=phone.getBoundingClientRect();

  var mw=pop.offsetWidth, mh=pop.offsetHeight;
  var left=(b.left-p.left)+b.width/2-mw/2;
  left=Math.max(8,Math.min(left,phone.clientWidth-mw-8));
  var top=(b.top-p.top)-mh-10;
  if(top<8){ top=(b.bottom-p.top)+10; pop.classList.add('arrow-up'); }
  var arrow=pop.querySelector('.pop-arrow');
  var aL=(b.left-p.left)+b.width/2-left-6;
  arrow.style.left=Math.max(10,Math.min(aL,mw-22))+'px';
  pop.style.left=left+'px'; pop.style.top=top+'px';
  requestAnimationFrame(function(){ pop.classList.add('show'); });

  setTimeout(function(){
    document.addEventListener('click', closeBubbleMenu, {once:true});
    document.addEventListener('touchstart', closeBubbleMenu, {once:true});
  },0);
}

function reduceTension(c) {
  if (!c || !c.status) return;
  if (c.isBlockedByChar) return;
  const tension = c.status.紧张感 || 0;
  if (tension <= 0) return;

  const now = Date.now();
  if (c._lastTensionDrop && (now - c._lastTensionDrop) < 1800000) {
    return; // 不足30分钟，不降
  }
  c.status.紧张感 = Math.max(0, tension - 1);
  c._lastTensionDrop = now;
  save();
}

function applyState(c, text) {
  var re = /<state>([\s\S]*?)<\/state>/g, m;
  while (m = re.exec(text)) {
    m[1].split(/[,，]/).forEach(function(p) {
      p = p.trim();
      var x;
      if (x = p.match(/好感\s*([+\-]?\d+)/)) {
        var d = +x[1];
        if (d > 0) d = Math.round(d * 0.5);   // 加分减半，扣分不变
        c.status.好感度 = clamp(c.status.好感度 + d);
        syncClinginess(c);
      } else if (x = p.match(/信任\s*([+\-]?\d+)/)) {
        c.status.信任度 = clamp(c.status.信任度 + +x[1]);
      } else if (x = p.match(/紧张\s*([+\-]?\d+)/)) {
        c.status.紧张感 = clamp(c.status.紧张感 + +x[1]);
      } else if (x = p.match(/关系[:：]\s*(.+)/)) {
        c.status.当前关系 = x[1].trim();
      }
    });
  }

  // 移除 state 标签本身
  text = text.replace(/<state>[\s\S]*?<\/state>/g, '').trim();

  // 清除残留的旧式心声标记（不管独占一行还是混在文字里，一律清掉）
  text = text.replace(/心声\s*[:：]?\s*[12](?![0-9])/g, '').trim();

  return text;
}

/**
 * 【新解析器】将 AI 原始回复解析为结构化消息数组
 * 兼容旧格式 [xx|xx] 和新格式 <tag>xx</tag>，以及 AI 自创的各种变体
 * 并自动将多行纯文本拆分为多个消息气泡
 */
function cleanLeftoverTags(text) {
    if (!text) return '';
    var t = text;
    t = t.replace(/<(inner|心声|voice|sticker|recall|transfer|block|gift|giftback|state|share|meet)[^>]*>[\s\S]*?<\/\1>/g, '');
    t = t.replace(/<\/?(inner|心声|voice|sticker|recall|transfer|block|gift|giftback|state|share|meet)[^>]*>/g, '');
    t = t.replace(/\[(?:语音|表情|表情包|撤回|转账|拉黑玩家|心声|接收|退回|礼物|见面|回线上)[^\]]*\]/g, '');
    t = t.replace(/[（(]\s*(?:发了个|发送|发)?(?:语音|表情|表情包|撤回|转账|心声|动作|神态|内心|拍了拍)[^）)]*[）)]/g, '');
    
    // ★★★ 彻底抹除残留的“心声1/心声2”文本 ★★★
    t = t.replace(/(?:^|\n|\s)*[【\[（(]?\s*心声\s*[:：|｜]?\s*[12一二]\s*[】\]）)]?/gi, '');
    
    return t.trim();
}
function splitToBubbles(text) {
  var lines = text.split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
  // 模型正常换行了（多行）→ 尊重模型，一行一个气泡，不再细拆
  if (lines.length > 1) return lines;
  // 只有一整段 → 很可能模型忘了换行，按句末标点兜底拆
  var line = lines[0] || '';
  if (line.length <= 25) return lines;  // 太短就不拆，避免误伤
  var segs = line.match(/[^。！？…~～]*[。！？…~～]+["'”’)）】]*|[^。！？…~～]+$/g);
  if (segs && segs.length > 1) {
    return segs.map(function(s){ return s.trim(); }).filter(Boolean);
  }
  return lines;
}

function parseAIMessage(raw) {
    if (!raw) return [{ type: 'text', content: '' }];

    // 1. 预处理：清理 Markdown 代码块标记
    let text = raw.replace(/```[\s\S]*?```/g, function(match) {
        return match.replace(/```(json|xml|text)?\n?/gi, '').replace(/```/g, '');
    }).trim();
    text = text.replace(/[ \u00A0\u3000]{2,}/g, ' ');

    // 2. 归一化：将各种“野生”格式统一转换为标准 XML 标签
    // --- 语音 ---
    text = text.replace(/\[语音[|｜:：]\s*([\s\S]*?)\]/g, '<voice>$1</voice>');
    text = text.replace(/[（(]\s*语音(?:消息)?\s*[）)]\s*[:：]?\s*([\s\S]*?)(?=\n|$|\[)/g, '<voice>$1</voice>');

    // --- 表情（超级兼容版：兼容 [表情:x]、(发了个表情：x)、(发送表情包 x) 等所有野格式） ---
    text = text.replace(/[【\[（(]\s*(?:发了个|发送|发了)?(?:表情|表情包|贴图)\s*[|｜:：\s]\s*([^\]】）)]+)\s*[】\]）)]/g, '<sticker>$1</sticker>');
    // --- 撤回 ---
    text = text.replace(/\[撤回[|｜:：]\s*([\s\S]*?)\]/g, '<recall>$1</recall>');
    text = text.replace(/[（(]\s*撤回\s*[）)]\s*[:：]?\s*([\s\S]*?)(?=\n|$)/g, '<recall>$1</recall>');

    // --- 转账 ---
    text = text.replace(/\[转账[|｜:：]\s*([^\]|]+?)\s*[|｜,，]\s*([^\]]*?)\]/g, '<transfer amount="$1" note="$2"></transfer>');
    text = text.replace(/\[转账[|｜:：]\s*([^\]|]+?)\]/g, '<transfer amount="$1" note=""></transfer>');

    // --- 拉黑 ---
    text = text.replace(/\[拉黑玩家[|｜:：]\s*([^\]]+)\]/g, '<block reason="$1"></block>');

    // --- 心声（全能兼容版） ---
    // 1. 带各类括号的：[心声:xxx]、【内心OS:xxx】、（心里想：xxx）
    text = text.replace(/[【\[（(]\s*(?:心声|内心|内心独白|内心OS|OS|心里想)\s*[|｜:：\s]?\s*([^\]】）)]*)[】\]）)]/gi, function(match, content) {
        return content.trim() ? ('<inner>' + content.trim() + '</inner>') : '<inner></inner>';

function extractMarkers(line) {
  var markers = [];
  var clean = line;
  var found = true;

  // 循环提取，直到没有标记可提取
  while (found) {
    found = false;
    var matched = false;

    // ----- 1. 提取 [语音消息：xxx] 或 [语音消息|xxx] -----
    var m = clean.match(/^([\s\S]*?)\[(语音消息)[：|]([^\]]+)\]([\s\S]*)$/);
    if (m) {
      markers.push({ type: 'voice', content: m[3].trim() });
      clean = (m[1] + m[4]).trim();
      found = true;
      matched = true;
    }

    // ----- 2. 提取 [撤回：xxx] 或 [撤回|xxx] -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[(撤回)[：|]([^\]]+)\]([\s\S]*)$/);
      if (m) {
        markers.push({ type: 'recall', content: m[3].trim() });
        clean = (m[1] + m[4]).trim();
        found = true;
        matched = true;
      }
    }

    // ----- 3. 提取 [表情包：xxx] 或 [表情包|xxx] 或 [表情：xxx] -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[(表情包|表情)[：|]([^\]]+)\]([\s\S]*)$/);
      if (m) {
        markers.push({ type: 'sticker', content: m[3].trim() });
        clean = (m[1] + m[4]).trim();
        found = true;
        matched = true;
      }
    }

    // ----- 4. 提取 [心声:数字] 或 [心声：数字] -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[心声[：|](\d+)\]([\s\S]*)$/);
      if (m) {
        var level = parseInt(m[2]) || 1;
        markers.push({ type: 'heart', level: level, content: null });
        clean = (m[1] + m[3]).trim();
        found = true;
        matched = true;
      }
    }

    // ----- 5. 提取 [心声：xxx] 或 [心声|xxx]（带内容） -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[心声[：|]([^\]]+)\]([\s\S]*)$/);
      if (m) {
        markers.push({ type: 'heart', level: 1, content: m[2].trim() });
        clean = (m[1] + m[3]).trim();
        found = true;
        matched = true;
      }
    }

    // ----- 6. 提取 [心声]xxx（标记后面直接跟文字） -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[心声\]\s*(.+)$/);
      if (m) {
        markers.push({ type: 'heart', level: 1, content: m[2].trim() });
        clean = m[1].trim();
        found = true;
        matched = true;
      }
    }

    // ----- 7. 提取 [拉黑玩家：xxx] 或 [拉黑玩家|xxx] -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[拉黑玩家[：|]([^\]]+)\]([\s\S]*)$/);
      if (m) {
        markers.push({ type: 'block_player', reason: m[2].trim() });
        clean = (m[1] + m[3]).trim();
        found = true;
        matched = true;
      }
    }

    // ----- 8. 提取 [转账：金额|备注] 或 [转账|金额|备注] -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[转账[：|]([^\]|]+)(?:[|｜,，]([^\]]*))?\]([\s\S]*)$/);
      if (m) {
        markers.push({ type: 'transfer', amount: m[2].trim(), content: (m[3] || '').trim() });
        clean = (m[1] + m[4]).trim();
        found = true;
        matched = true;
      }
    }

    // ----- 9. 提取单独的 [接收] 或 [退回] -----
    if (!matched) {
      m = clean.match(/^([\s\S]*?)\[(接收|退回)\]([\s\S]*)$/);
      if (m) {
        markers.push({ type: m[2] === '接收' ? 'transfer_accept' : 'transfer_refund' });
        clean = (m[1] + m[3]).trim();
        found = true;
        matched = true;
      }
    }

    // 如果本轮没有匹配到任何标记，退出循环
    if (!matched) break;
  }

  return { markers: markers, cleanText: clean };
}

// ----- 3. 心声处理 -----
