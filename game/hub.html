<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>游戏</title>
<style>
  :root{--theme:#ff6b81;--bg:#1c1c1e;--card:#2c2c2e;--text:#fff;--sub:#8e8e93;--line:rgba(255,255,255,.08);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#000;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC",sans-serif;color:var(--text);}

  /* ===== 手机边框(与主App一致) ===== */
  #phone{width:400px;height:100vh;height:100dvh;max-height:880px;max-width:100vw;
    transform-origin:top center;background:var(--bg);position:relative;overflow:hidden;
    display:flex;flex-direction:column;border-radius:32px;border:2px solid rgba(255,255,255,0.06);}
  @media(max-width:420px){#phone{width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;border:0;}}

  /* 状态栏 */
  #statusbar{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px 0 18px;font-size:14px;font-weight:600;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.4);
    flex-shrink:0;z-index:50;position:relative;pointer-events:none;}
  #statusbar.dark{color:var(--theme);text-shadow:none;}
  #island{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:100px;height:22px;
    background:#000;border-radius:14px;z-index:60;pointer-events:none;}
  .sb-right{display:flex;align-items:center;gap:6px;font-size:12px;}
  .batt{width:24px;height:12px;border:1px solid currentColor;border-radius:3px;position:relative;padding:1px;opacity:.9;}
  .batt::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:6px;background:currentColor;border-radius:0 1px 1px 0;}
  .batt i{display:block;height:100%;background:currentColor;border-radius:1px;}

  /* 内容区(可滚动) */
  #content{flex:1;overflow-y:auto;}

  .topbar{position:sticky;top:0;z-index:10;height:52px;display:flex;align-items:center;
    padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line);}
  .topbar .back{font-size:24px;cursor:pointer;width:32px;}
  .topbar .title{flex:1;text-align:center;font-size:17px;font-weight:600;}
  .topbar .right{width:32px;}

  .wallet{display:flex;gap:10px;padding:14px;}
  .wallet .w-card{flex:1;background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:8px;}
  .wallet .w-ico{font-size:22px;}
  .wallet .w-num{font-size:18px;font-weight:700;}
  .wallet .w-label{font-size:11px;color:var(--sub);}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:12px 14px 30px;}
  .game{background:var(--card);border-radius:18px;padding:22px 14px 16px;display:flex;flex-direction:column;
    align-items:center;gap:10px;position:relative;cursor:pointer;overflow:hidden;transition:transform .12s;box-shadow:0 3px 12px rgba(0,0,0,.14);}
  .game:active{transform:scale(.95);}
  .game .cover{width:92px;height:92px;display:flex;align-items:center;justify-content:center;font-size:44px;}
  .game .cover img{width:100%;height:100%;object-fit:contain;}
  .game .g-name{font-size:14px;font-weight:600;}
  .game .g-desc{font-size:11px;color:var(--sub);text-align:center;line-height:1.4;}
  .game.soon{opacity:.6;}
  .game .badge{position:absolute;top:8px;right:8px;font-size:9px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.4);color:#fff;z-index:2;}
  .game .badge.hot{background:var(--theme);}
  .section-title{padding:8px 16px 4px;font-size:12px;color:var(--sub);}
</style>
</head>
<body>
<div id="phone">

  <!-- 状态栏 -->
  <div id="statusbar" class="dark">
    <span id="sbTime">00:00</span>
    <div id="island"></div>
    <span class="sb-right">
      <span>5G</span>
      <span style="display:inline-flex;align-items:center;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="14" width="3" height="6" rx="1" fill="currentColor"/>
          <rect x="7" y="10" width="3" height="10" rx="1" fill="currentColor"/>
          <rect x="12" y="5" width="3" height="15" rx="1" fill="currentColor"/>
          <rect x="17" y="1" width="3" height="19" rx="1" fill="currentColor"/>
        </svg>
      </span>
      <span class="batt"><i id="battLvl" style="width:80%"></i></span>
    </span>
  </div>

  <!-- 内容 -->
  <div id="content">
    <div class="topbar">
      <div class="back" onclick="goHome()">‹</div>
      <div class="title">游戏</div>
      <div class="right"></div>
    </div>

    <div class="wallet">
      <div class="w-card">
        <span class="w-ico">🪙</span>
        <div><div class="w-num" id="coinNum">--</div><div class="w-label">金币</div></div>
      </div>
    </div>

    <div class="section-title">和 TA 一起玩</div>

    <div class="grid">
      <div class="game" onclick="openGame('pet')">
        <span class="badge hot">NEW</span>
        <div class="cover"><img src="https://s1.imagehub.cc/images/2026/08/15/95013345ba6d3dfca176d37889a18aa0.png"></div>
        <div class="g-name">崽崽</div>
        <div class="g-desc">和 TA 一起养的小家伙</div>
      </div>
      <div class="game soon" onclick="openGame('tarot')">
        <span class="badge">敬请期待</span>
        <div class="cover"><img src="https://s1.imagehub.cc/images/2026/08/15/c45993c44ae33c1c46c5baec56408a41.png"></div>
        <div class="g-name">塔罗占卜</div>
        <div class="g-desc">让 TA 为你解读今日</div>
      </div>
      <div class="game soon" onclick="openGame('turtle')">
        <span class="badge">敬请期待</span>
        <div class="cover"><img src="https://s1.imagehub.cc/images/2026/08/15/c6b7c3199bf6f4eec5a1c27600ee3ce3.png"></div>
        <div class="g-name">海龟汤</div>
        <div class="g-desc">和 TA 一问一答猜谜</div>
      </div>
      <div class="game soon">
        <span class="badge">敬请期待</span>
        <div class="cover">✨</div>
        <div class="g-name">更多</div>
        <div class="g-desc">还在路上…</div>
      </div>
    </div>
  </div>
</div>

<script>
  var DB_KEY='myrp_data_v1';var DB=null;
  function loadDB(){try{DB=JSON.parse(localStorage.getItem(DB_KEY))||{};}catch(e){DB={};}}
  function refreshWallet(){if(!DB)return;var coins=(DB.coins!=null?DB.coins:(DB.settings&&DB.settings.coins))||0;
    var el=document.getElementById('coinNum');if(el)el.textContent=coins;}
  function goHome(){location.href='../index.html';}
  function openGame(key){if(key==='pet'){location.href='pet.html';}else{alert('这个还在做，敬请期待～');}}
  function applyTheme(){try{var c=JSON.parse(localStorage.getItem('myrp_theme_colors'));
    if(c)for(var k in c){if(c[k])document.documentElement.style.setProperty(k,c[k]);}}catch(e){}}

  function tick(){var n=new Date();var el=document.getElementById('sbTime');
    if(el)el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}

  var batteryManager=null;
  function updateBatteryUI(b){var el=document.getElementById('battLvl');if(!el)return;
    el.style.width=(b?Math.round(b.level*100):80)+'%';}
  function initBattery(){if(!navigator.getBattery)return;
    navigator.getBattery().then(function(b){batteryManager=b;updateBatteryUI(b);
      b.addEventListener('levelchange',function(){updateBatteryUI(b);});
      b.addEventListener('chargingchange',function(){updateBatteryUI(b);});}).catch(function(){});}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&batteryManager)updateBatteryUI(batteryManager);});

  loadDB();applyTheme();refreshWallet();tick();setInterval(tick,1000);initBattery();
</script>
</body>
</html>
