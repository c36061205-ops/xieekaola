<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>崽崽</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--theme:#5bc8a8;--bg:#14161c;--card:#1e2129;--text:#fff;--sub:#8a8f9c;--line:rgba(255,255,255,.07);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;
    font-family:-apple-system,"PingFang SC",sans-serif;color:var(--text);}
  .px{font-family:'Press Start 2P',monospace;}
  #phone{width:400px;height:100vh;height:100dvh;max-height:860px;max-width:100vw;background:var(--bg);
    position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:32px;border:2px solid rgba(255,255,255,.06);}
  @media(max-width:420px){#phone{width:100vw;height:100vh;max-height:none;border-radius:0;border:0;}}

  #statusbar{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px 0;font-size:14px;font-weight:600;color:var(--theme);flex-shrink:0;z-index:50;position:relative;}
  #island{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:100px;height:22px;background:#000;border-radius:14px;}
  .sb-right{display:flex;align-items:center;gap:6px;font-size:12px;}
  .batt{width:24px;height:12px;border:1px solid currentColor;border-radius:3px;position:relative;padding:1px;}
  .batt::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:6px;background:currentColor;border-radius:0 1px 1px 0;}
  .batt i{display:block;height:100%;width:75%;background:currentColor;border-radius:1px;}

  .topbar{height:46px;display:flex;align-items:center;padding:0 14px;flex-shrink:0;}
  .topbar .back{font-size:26px;width:30px;cursor:pointer;}
  .topbar .title{flex:1;text-align:center;font-size:15px;font-weight:700;}
  .topbar .gear{width:30px;text-align:right;font-size:16px;opacity:.6;cursor:pointer;}
  .body{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0 16px 12px;}

  /* 像素窝 */
  .lcd{width:100%;height:236px;flex-shrink:0;border-radius:16px;position:relative;overflow:hidden;
    border:3px solid rgba(0,0,0,.5);image-rendering:pixelated;
    box-shadow:inset 0 0 24px rgba(0,0,0,.55),0 0 0 3px color-mix(in srgb,var(--theme) 20%,#000),0 5px 16px rgba(0,0,0,.5);
    background:linear-gradient(180deg,#2a2540 0%,#3a3358 45%,#4a4268 62%);}
  .lcd.day{background:linear-gradient(180deg,#8ec5e8 0%,#b8d8ec 45%,#d0e4f0 62%);}
  .wall{position:absolute;top:0;left:0;width:100%;height:164px;z-index:0;
    background:linear-gradient(rgba(255,255,255,.03) 0 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px);background-size:28px 28px;}
  .wstar{position:absolute;width:4px;height:4px;background:#fff5c0;opacity:.85;z-index:1;animation:twk 2.5s ease-in-out infinite;}
  @keyframes twk{0%,100%{opacity:.3;}50%{opacity:1;}}
  .lcd.day .wstar{display:none;}
  .lights{position:absolute;top:6px;left:0;width:100%;height:18px;z-index:2;}
  .lights i{position:absolute;top:0;width:7px;height:7px;animation:glow 2s ease-in-out infinite;}
  @keyframes glow{0%,100%{opacity:.5;box-shadow:0 0 3px currentColor;}50%{opacity:1;box-shadow:0 0 8px currentColor;}}
  .window{position:absolute;top:22px;right:22px;width:56px;height:56px;z-index:2;background:#24406e;border:5px solid #6b5842;
    box-shadow:0 0 12px rgba(120,150,220,.4),inset 0 0 0 2px #1a2a4a,inset -26px 0 0 -24px #6b5842,inset 0 -26px 0 -24px #6b5842;}
  .lcd.day .window{background:#7ec8f0;}
  .moon{position:absolute;top:6px;right:8px;width:14px;height:14px;background:#fff5c0;box-shadow:0 0 10px #fff5c0;}
  .lcd.day .moon{background:#ffd24a;box-shadow:0 0 12px #ffd24a;}
  .floor{position:absolute;bottom:0;left:0;width:100%;height:72px;z-index:1;
    background:linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px),linear-gradient(rgba(0,0,0,.28) 0 2px,transparent 2px),
      repeating-linear-gradient(90deg,#5a4632 0 24px,#63503a 24px 48px);background-size:24px 24px,24px 24px,auto;box-shadow:inset 0 3px 0 #7a6248;}
  .rug{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:150px;height:30px;z-index:2;
    background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.15) 12px 14px),color-mix(in srgb,var(--theme) 42%,#2a2a3a);
    border:3px solid color-mix(in srgb,var(--theme) 55%,#000);box-shadow:0 0 0 2px rgba(0,0,0,.3);}
  .bed{position:absolute;bottom:18px;left:12px;width:60px;height:30px;z-index:2;background:#5a4278;border:4px solid #8a6caa;box-shadow:inset 0 4px 0 #7a5c9a;}
  .bed:before{content:'';position:absolute;top:-8px;left:6px;right:6px;height:12px;background:#a888c8;border:3px solid #8a6caa;}
  .bowl{position:absolute;bottom:20px;right:20px;width:26px;height:14px;z-index:2;background:#c47a4a;border:3px solid #8a5232;box-shadow:inset 0 4px 0 #e89a6a;}
  .ball{position:absolute;bottom:20px;right:58px;width:18px;height:18px;z-index:2;background:#ff6b81;border:3px solid #c04a5e;box-shadow:inset 4px 4px 0 rgba(255,255,255,.4);}

  .withwho{position:absolute;top:8px;left:10px;z-index:6;font-size:8px;color:#fff;opacity:.9;text-shadow:0 1px 2px #000;}
  .moodtag{position:absolute;top:34px;right:8px;z-index:6;font-size:8px;padding:4px 7px;border-radius:6px;
    background:rgba(0,0,0,.55);border:1px solid color-mix(in srgb,var(--theme) 40%,transparent);color:#ffd98a;display:none;}
  .bubble{position:absolute;top:14%;left:50%;transform:translateX(-50%);z-index:7;background:#fff;color:#333;
    padding:5px 11px;border-radius:12px;font-size:11px;max-width:74%;text-align:center;opacity:0;transition:opacity .3s;}
  .bubble.show{opacity:1;}
  .bubble:after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;border-bottom:0;}

  #petImg{position:absolute;left:50%;bottom:20px;width:118px;height:118px;object-fit:contain;z-index:5;cursor:pointer;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));transform-origin:bottom center;}

  /* 幼年:走→到头停顿张望→返回 */
    .anim-idle{animation:idleStand 3.2s ease-in-out infinite;}
  @keyframes idleStand{0%,100%{transform:translateX(-50%) translateY(0) rotate(0);}50%{transform:translateX(-50%) translateY(-3px) rotate(1deg);}}

  .anim-baby{animation:babyWalk 18s ease-in-out infinite;}
  @keyframes babyWalk{
    0%{transform:translateX(-118%) scaleX(1) rotate(0);}
    3%{transform:translateX(-118%) scaleX(1) rotate(-5deg);}
    7%{transform:translateX(-118%) scaleX(1) rotate(3deg);}
    10%{transform:translateX(-118%) scaleX(1) rotate(0);}
    42%{transform:translateX(-18%) scaleX(1) rotate(0);}
    45%{transform:translateX(-18%) scaleX(1) rotate(5deg);}
    49%{transform:translateX(-18%) scaleX(1) rotate(-3deg);}
    52%{transform:translateX(-18%) scaleX(-1) rotate(0);}
    92%{transform:translateX(-118%) scaleX(-1) rotate(0);}
    100%{transform:translateX(-118%) scaleX(1) rotate(0);}}
  /* 青年:走+偶尔小跳 */
  .anim-teen{animation:teenWalk 15s ease-in-out infinite;}

  @keyframes teenWalk{
    0%{transform:translateX(-115%) scaleX(1) translateY(0);}
    18%{transform:translateX(-78%) scaleX(1) translateY(0);}
    22%{transform:translateX(-72%) scaleX(1) translateY(-16px);}
    26%{transform:translateX(-66%) scaleX(1) translateY(0);}
    46%{transform:translateX(-18%) scaleX(1) translateY(0);}
    50%{transform:translateX(-18%) scaleX(-1) translateY(0);}
    72%{transform:translateX(-70%) scaleX(-1) translateY(0);}
    76%{transform:translateX(-72%) scaleX(-1) translateY(-14px);}
    80%{transform:translateX(-74%) scaleX(-1) translateY(0);}
    96%{transform:translateX(-115%) scaleX(-1) translateY(0);}
    100%{transform:translateX(-115%) scaleX(1) translateY(0);}}
  /* 成年:稳重站立·呼吸+点头摆动 */
  .anim-adult{animation:adultIdle 4.5s ease-in-out infinite;}
  @keyframes adultIdle{
    0%,100%{transform:translateX(-50%) translateY(0) rotate(0);}
    20%{transform:translateX(-50%) translateY(-4px) rotate(-2deg);}
    40%{transform:translateX(-50%) translateY(0) rotate(0);}
    55%{transform:translateX(-50%) translateY(-2px) rotate(0) scaleY(.97);}
    70%{transform:translateX(-50%) translateY(-3px) rotate(2deg);}}
  /* 完全体:威严悬浮+轻微展翅感 */
  .anim-final{animation:finalFloat 5.5s ease-in-out infinite;}
  @keyframes finalFloat{
    0%,100%{transform:translateX(-50%) translateY(0) scale(1) rotate(-1deg);}
    50%{transform:translateX(-50%) translateY(-14px) scale(1.035) rotate(1deg);}}
  .anim-sleep{animation:sleepbr 3.8s ease-in-out infinite;}
  @keyframes sleepbr{0%,100%{transform:translateX(-50%) scaleY(1);}50%{transform:translateX(-50%) scaleY(1.03) translateY(-2px);}}
  .anim-unhappy{animation:tremble .28s linear infinite;}
  @keyframes tremble{0%{transform:translateX(-50%) translateX(-.8px);}50%{transform:translateX(-50%) translateX(.8px);}100%{transform:translateX(-50%) translateX(-.8px);}}
  .anim-react{animation:react .5s ease;}
  @keyframes react{0%{transform:translateX(-50%) translateY(0);}40%{transform:translateX(-50%) translateY(-20px);}100%{transform:translateX(-50%) translateY(0);}}
  .zzz{position:absolute;z-index:6;color:#fff;font-size:14px;opacity:0;display:none;text-shadow:0 1px 2px #000;}
  .zzz.show{display:block;animation:zzz 2.5s ease-in-out infinite;}
  @keyframes zzz{0%{opacity:0;transform:translateY(0) scale(.6);}30%{opacity:.9;}100%{opacity:0;transform:translateY(-24px) scale(1.1);}}
  #fx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden;}
  .drop{position:absolute;font-size:22px;top:-30px;animation:fall 1.1s ease-in forwards;}
  @keyframes fall{0%{top:-30px;opacity:1;}100%{top:60%;opacity:0;}}
  .rise{position:absolute;bottom:40%;font-size:18px;animation:rise 1.3s ease-out forwards;}
  @keyframes rise{0%{opacity:0;transform:scale(.4);}30%{opacity:1;}100%{opacity:0;transform:translateY(-60px) scale(1.1);}}

  .stats{flex-shrink:0;padding:12px 2px 4px;}
  .srow{display:flex;align-items:center;gap:7px;margin:6px 0;}
  .srow .ic{width:18px;height:18px;flex-shrink:0;color:var(--theme);}
  .seg{flex:1;display:flex;gap:2px;}
  .seg span{flex:1;height:9px;background:rgba(150,150,160,.22);border-radius:1px;transition:background .3s;}
  .seg span.on{background:var(--theme);box-shadow:0 0 4px color-mix(in srgb,var(--theme) 55%,transparent);}
  .seg span.low{background:#ff6b6b;box-shadow:0 0 4px rgba(255,107,107,.5);}

  .pad{flex-shrink:0;display:flex;gap:8px;padding:6px 0 10px;}
  .pbtn{flex:1;background:var(--card);border:1px solid color-mix(in srgb,var(--theme) 25%,transparent);
    border-radius:11px;padding:9px 2px 7px;text-align:center;cursor:pointer;transition:transform .1s;box-shadow:0 2px 0 color-mix(in srgb,var(--theme) 22%,#000);}
  .pbtn:active{transform:translateY(2px);box-shadow:none;}
  .pbtn svg{width:22px;height:22px;color:var(--theme);}
  .pbtn .pl{font-size:7px;margin-top:3px;color:var(--sub);}

  .log-head{flex-shrink:0;font-size:8px;color:var(--sub);padding:4px 2px;display:flex;justify-content:space-between;}
  .log{flex:1;overflow-y:auto;background:var(--card);border-radius:12px;padding:10px;border:1px solid var(--line);}
  .log::-webkit-scrollbar{width:0;}
  .entry{margin:7px 0;font-size:11px;line-height:1.5;display:flex;gap:6px;}
  .entry .who{flex-shrink:0;font-weight:700;}
  .entry.sys{color:var(--sub);font-size:10px;justify-content:center;}
  .entry.pet .who{color:var(--theme);}
  .entry.me .who{color:#e0a44a;}
  .entry.char .who{color:#4a90d9;}
  .entry .txt{opacity:.92;color:var(--text);}

  .inputbar{flex-shrink:0;display:flex;gap:8px;padding-top:8px;}
  .inputbar input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:9px 14px;font-size:13px;outline:none;}
  .inputbar .send{width:42px;background:var(--theme);border:0;border-radius:20px;color:#111;font-size:16px;cursor:pointer;}

  #loader{position:absolute;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s;}
  #loader.hide{opacity:0;pointer-events:none;}
  .egg{font-size:60px;animation:eggshake 1.1s ease-in-out infinite;}
  @keyframes eggshake{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  .load-text{font-size:9px;color:var(--theme);letter-spacing:1px;}
  .dots{display:flex;gap:6px;}
  .dots i{width:8px;height:8px;background:var(--theme);border-radius:1px;opacity:.25;animation:dot 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;}.dots i:nth-child(3){animation-delay:.4s;}
  @keyframes dot{0%,100%{opacity:.25;}40%{opacity:1;}}

  .mask{position:absolute;inset:0;z-index:150;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;}
  .mask.show{display:flex;}
  .panel{width:100%;background:var(--card);border-radius:20px;padding:20px;max-height:82%;overflow-y:auto;}
  .panel h3{font-size:16px;margin-bottom:14px;text-align:center;}
  .panel label{font-size:12px;color:var(--sub);display:block;margin:10px 0 5px;}
  .panel input,.panel select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:14px;}
  .panel .btn{width:100%;background:var(--theme);color:#111;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;}
  .panel .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);margin-top:8px;font-weight:400;}
  .dev-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .dev-row .dbtn{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .dev-row .dbtn.on{background:var(--theme);border-color:var(--theme);color:#111;}
  .dev-title{font-size:12px;color:var(--sub);margin:10px 0 5px;}
  #toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(0,0,0,.85);color:#fff;
    padding:9px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="phone">
  <div id="loader"><div class="egg">🥚</div><div class="load-text px" id="loadTxt">正在连接崽崽...</div><div class="dots"><i></i><i></i><i></i></div></div>

  <div id="statusbar">
    <span id="sbTime">00:00</span><div id="island"></div>
    <span class="sb-right"><span>5G</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="2" y="14" width="3" height="6" rx="1" fill="currentColor"/><rect x="7" y="10" width="3" height="10" rx="1" fill="currentColor"/><rect x="12" y="5" width="3" height="15" rx="1" fill="currentColor"/><rect x="17" y="1" width="3" height="19" rx="1" fill="currentColor"/></svg>
      <span class="batt"><i id="battLvl"></i></span></span>
  </div>

  <div class="topbar"><div class="back" onclick="goHome()">‹</div><div class="title" id="topTitle" onclick="devTap()">崽崽</div><div class="gear" onclick="openSet()">⚙</div></div>

  <div class="body">
    <div class="lcd" id="lcd">
      <div class="wall"></div><div class="lights" id="lights"></div>
      <div class="window"><div class="moon"></div></div>
      <div class="floor"></div><div class="rug"></div><div class="bed"></div><div class="bowl"></div><div class="ball"></div>
      <div class="withwho px" id="withwho"></div>
      <div class="moodtag px" id="moodtag"></div>
      <div class="bubble" id="bubble"></div>
      <div class="zzz" id="zzz">z Z</div>
      <div id="fx"></div>
      <img id="petImg" onclick="pokePet()" src="">
    </div>

    <div class="stats">
      <div class="srow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16a8 8 0 01-16 0z" fill="currentColor" stroke="none"/><path d="M3 12h18" stroke-linecap="round"/><path d="M9 8s-.5-2 .5-3M12 8s-.5-2 .5-3M15 8s-.5-2 .5-3" stroke-linecap="round"/></svg><div class="seg" id="segHunger"></div></div>
      <div class="srow"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s6 7 6 12a6 6 0 01-12 0c0-5 6-12 6-12z"/></svg><div class="seg" id="segClean"></div></div>
      <div class="srow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M8 14c1 2 7 2 8 0" stroke-linecap="round"/></svg><div class="seg" id="segMood"></div></div>
      <div class="srow"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 6-8 11-8 11z"/></svg><div class="seg" id="segInt"></div></div>
    </div>

    <div class="pad">
      <div class="pbtn" onclick="doFeed()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16a8 8 0 01-16 0z" fill="currentColor" stroke="none"/><path d="M3 12h18" stroke-linecap="round"/><path d="M9 8s-.5-2 .5-3M12 8s-.5-2 .5-3M15 8s-.5-2 .5-3" stroke-linecap="round"/></svg><div class="pl px">FEED</div></div>
      <div class="pbtn" onclick="doClean()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s6 7 6 12a6 6 0 01-12 0c0-5 6-12 6-12z"/></svg><div class="pl px">WASH</div></div>
      <div class="pbtn" onclick="doPlay()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="10" rx="4"/><path d="M7 13h3M8.5 11.5v3M15 12h.01M18 14h.01"/></svg><div class="pl px">PLAY</div></div>
      <div class="pbtn" onclick="openMemorial()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M9 3v18"/></svg><div class="pl px">BOOK</div></div>
    </div>

    <div class="log-head px"><span>📖 崽崽日志</span><span id="logDay">今天</span></div>
    <div class="log" id="log"></div>
    <div class="inputbar"><input id="msgInput" placeholder="和崽崽说说话…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">➤</button></div>
  </div>

  <div id="toast"></div>

  <!-- 领养 -->
  <div class="mask" id="createMask"><div class="panel">
    <h3>🥚 领养一只崽崽</h3>
    <label>给它起个名字</label><input id="inpName" placeholder="崽崽" maxlength="8">
    <label>性格</label>
    <select id="inpPerso">
      <option value="clingy">黏人撒娇 · 爱蹭你</option>
      <option value="naughty">调皮捣蛋 · 精力旺</option>
      <option value="lazy">慵懒安静 · 爱睡觉</option>
      <option value="glutton">小吃货 · 满脑子吃</option>
    </select>
    <label>和谁一起养?(喂食从 TA 的心动值扣)</label><select id="inpChar"></select>
    <label>崽崽怎么称呼 TA?(留空=直接叫名字)</label><input id="inpCallChar" placeholder="如:酱酱 / 姐姐（留空叫名字）" maxlength="8">
    <label>崽崽怎么称呼你?(留空=叫“你”)</label><input id="inpCallUser" placeholder='如:妈妈 / 主人（留空叫“你”）' maxlength="8">
    <button class="btn" onclick="createPet()">领养 🐉</button>
  </div></div>

  <!-- 设置 -->
  <div class="mask" id="setMask"><div class="panel">
    <h3>⚙ 设置</h3>
    <label>崽崽的名字</label><input id="setName" maxlength="8">
    <label>崽崽怎么称呼 <span id="setCharTip">TA</span>?(留空=叫名字)</label><input id="setCallChar" maxlength="8">

    <label>崽崽怎么称呼你?(留空=叫“你”)</label><input id="setCallUser" maxlength="8">
    <button class="btn" onclick="saveSettings()">保存</button>

function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function applyTheme(){try{var c=JSON.parse(localStorage.getItem('myrp_theme_colors'));if(c)for(var k in c){if(c[k])document.documentElement.style.setProperty(k,c[k]);}}catch(e){}}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}
function getChars(){for(var i=0;i<CHAR_LIST_FIELDS.length;i++){var a=DB[CHAR_LIST_FIELDS[i]];if(Array.isArray(a)&&a.length)return a;}return [];}
function getCharById(id){var l=getChars();for(var i=0;i<l.length;i++){if((l[i].id||l[i].name)==id)return l[i];}return null;}
function charName(c){return c?(c.name||c.nickname||c.remark||'TA'):'TA';}
function getHeart(c){if(!c)return 0;for(var i=0;i<HEART_FIELDS.length;i++){if(typeof c[HEART_FIELDS[i]]==='number')return c[HEART_FIELDS[i]];}return 0;}
function setHeart(c,v){if(!c)return;for(var i=0;i<HEART_FIELDS.length;i++){if(typeof c[HEART_FIELDS[i]]==='number'){c[HEART_FIELDS[i]]=v;return;}}c[HEART_FIELDS[0]]=v;}

function fill(t){return (t||'').replace(/{c}/g,pet.callChar||pet.bindCharName||'TA').replace(/{u}/g,pet.callUser||'你');}

function addLog(type,who,txt,save){pet.log=pet.log||[];pet.log.push({t:type,who:who,x:txt});if(pet.log.length>50)pet.log=pet.log.slice(-50);if(save!==false)saveDB();}

function initPet(){
  loadDB();applyTheme();pet=DB.pet||null;buildDeco();

function catchUp(){
  var now=Date.now(),hrs=(now-(pet.lastUpdate||now))/3600000;
  if(hrs>0){
    pet.stats.hunger=clamp(pet.stats.hunger-hrs*2.5);pet.stats.clean=clamp(pet.stats.clean-hrs*1.4);pet.stats.mood=clamp(pet.stats.mood-hrs*1.4);
    if(pet.stats.hunger<15||pet.stats.clean<15||pet.stats.mood<15)pet.neglect=(pet.neglect||0)+Math.min(hrs,24);
    if(hrs>=2&&pet.bindCharId){
      addLog('sys','','— 你不在的时候 —',false);
      addLog('char',pet.bindCharName,fill(rand(VISIT)),false);
      pet.stats.hunger=clamp(pet.stats.hunger+18);pet.stats.clean=clamp(pet.stats.clean+15);pet.stats.mood=clamp(pet.stats.mood+15);
      addLog('pet','崽崽',fill(rand(VISIT_REPLY[pet.perso]||VISIT_REPLY.clingy)),false);
      addLog('sys','','— 现在 —',false);
    }
    pet.lastUpdate=now;saveDB();
  }
}
function checkGrow(){
  var days=(Date.now()-pet.bornAt)/86400000;pet.days=days;
  if(pet.stage==='baby'&&days>=GROW.baby.days&&pet.stats.intimacy>=GROW.baby.int){pet.stage='teen';grew('青年');}
  else if(pet.stage==='teen'&&days>=GROW.teen.days&&pet.stats.intimacy>=GROW.teen.int){pet.stage='adult';grew('成年');}
  else if(pet.stage==='adult'&&days>=GROW.adult.days&&pet.stats.intimacy>=GROW.adult.int){pet.stage='final';pet.finalForm=(pet.neglect||0)<15?'star':'dark';grew(STAGE_NAME['final_'+pet.finalForm]);}
  saveDB();
}
function grew(n){setTimeout(function(){toast('🎉 崽崽长大成「'+n+'」了!');addLog('sys','','🎉 崽崽进化为 '+n+' 了!');renderLog();},600);}

function formKey(){if(pet._devForm)return pet._devForm;if(pet.stage==='final')return 'final_'+pet.finalForm;return pet.stage;}
function isNight(){var h=new Date().getHours();return h>=22||h<7;}
function stateKey(){if(pet._devState)return pet._devState;var s=pet.stats;if(s.hunger<30||s.clean<30||s.mood<30)return 'unhappy';if(isNight()||napping)return 'sleep';return 'normal';}
function unhappyReason(){var s=pet.stats,a=[['hunger',s.hunger],['clean',s.clean],['mood',s.mood]];a.sort(function(x,y){return x[1]-y[1];});return a[0][0];}

function render(){
  var fk=formKey(),sk=stateKey();
  var img=document.getElementById('petImg');

  if(img.getAttribute('src')!==url)img.setAttribute('src',url);
  document.getElementById('lcd').classList.toggle('day',!isNight());

  var anim;
  if(sk==='sleep')anim='anim-sleep';
  else if(sk==='unhappy')anim='anim-unhappy';
  else{
    // 大部分时间待在原地,只偶尔(约25%)走一走
    if(fk==='baby')anim=(Math.random()<0.25?'anim-baby':'anim-idle');
    else if(fk==='teen')anim=(Math.random()<0.25?'anim-teen':'anim-idle');
    else if(fk==='adult')anim='anim-adult';
    else anim='anim-final';
  }
  // 同一状态下保持当前动作,不每次重随机(避免频繁切换/跳动)
  if(!img.className||!img.classList.contains(anim.split(' ')[0])||pet._animState!==sk){
    img.className=anim;pet._animState=sk;
  }

  }else{img.style.left='50%';img.style.bottom='20px';zzz.classList.remove('show');}

  var tag=document.getElementById('moodtag');

function buildDeco(){var lcd=document.getElementById('lcd');for(var i=0;i<7;i++){var st=document.createElement('div');st.className='wstar';st.style.left=(8+Math.random()*55)+'%';st.style.top=(10+Math.random()*30)+'%';st.style.animationDelay=(Math.random()*2.5)+'s';lcd.appendChild(st);}var lg=document.getElementById('lights');var cols=['#ff6b81','#5bc8a8','#ffd98a','#7fb4ff','#c88ad8'];for(var i=0;i<8;i++){var b=document.createElement('i');b.style.left=(6+i*12)+'%';b.style.background=cols[i%cols.length];b.style.color=cols[i%cols.length];b.style.animationDelay=(i*.2)+'s';lg.appendChild(b);}}

function petReplyLocal(userText){var s=pet.stats;if(s.hunger<30)return fill(rand(LINES.hungry));if(s.clean<30)return fill(rand(LINES.dirty));if(s.mood<30)return fill(rand(LINES.sad));if(/爱|喜欢|想你|乖|棒|可爱/.test(userText))return fill(rand(LINES.love));if(/吃|饿|饭/.test(userText))return fill(rand(LINES.feed[pet.perso]||LINES.feed.clingy));if(/玩|无聊/.test(userText))return fill(rand(LINES.play[pet.perso]||LINES.play.clingy));return fill(rand(LINES.chat));}

/* 崽崽专用:复刻主App的callAI(读同一份DB.settings) */
async function petCallAI(messages,_retry){
  var s=DB.settings||{};
  if(!s.apiUrl||!s.apiKey)throw new Error('no-api');
  _retry=_retry||0;
  // 崽崽用轻量模型(快速回应)
  var model=s.lightModel||s.chatModel;
  try{
    var res=await fetch(s.apiUrl+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
      body:JSON.stringify({model:model,messages:messages,temperature:0.9,max_tokens:120})});
    if(!res.ok){if((res.status>=500||res.status===429)&&_retry<2){await new Promise(function(r){setTimeout(r,1200*(_retry+1));});return petCallAI(messages,_retry+1);}throw new Error('HTTP '+res.status);}
    var d=await res.json();
    if(!d.choices||!d.choices[0])throw new Error('bad-format');
    return d.choices[0].message.content;
  }catch(e){if(_retry<2&&/fetch|network|timeout|Failed/i.test(e.message||'')){await new Promise(function(r){setTimeout(r,1200*(_retry+1));});return petCallAI(messages,_retry+1);}throw e;}
}

  var stageDesc=stageMap[formKey()]||'';
  var callUser=pet.callUser||'你';
  var callChar=pet.callChar||pet.bindCharName||'';

  var txt='你现在扮演一只名叫「'+pet.name+'」的小龙宠物,类似无牙仔那种可爱的龙。';
  txt+='性格:'+persoDesc+'。';
  txt+='成长阶段:'+stageDesc+'。';
  txt+='你的主人是'+callUser+'。';
  if(callChar)txt+='和主人一起照顾你的还有'+callChar+',你称呼这位为「'+callChar+'」。';
  txt+='你称呼主人为「'+callUser+'」。';
  txt+='当前状态:'+(moodDesc.length?moodDesc.join('、'):'状态正常、很舒服')+'。';
  txt+='要求:①用第一人称,像真的小宠物一样奶萌、口语化;②只说1到2句短话,不超过30字;③不要旁白、不要括号里的动作神态、不要任何标记符号;④紧扣你当前的状态和性格来回应主人的话;⑤只说话,不描写动作。';
  return txt;
}

/* 说话主流程 */
async function petReply(userText){
  try{
    var msgs=[{role:'system',content:buildPetSystem()}];
    // 带上最近几条对话,让崽崽有短期记忆
    (pet.log||[]).slice(-6).forEach(function(e){
      if(e.t==='me')msgs.push({role:'user',content:e.x});
      else if(e.t==='pet')msgs.push({role:'assistant',content:e.x});
    });
    msgs.push({role:'user',content:userText});
    var out=await petCallAI(msgs);
    out=(out||'').replace(/[\[<][^\]>]*[\]>]/g,'').replace(/[（(][^）)]*[）)]/g,'').trim();
    return out||petReplyLocal(userText);
  }catch(e){
    return petReplyLocal(userText);  // AI失败→本地话术,不报错、不卡住
  }
}

function showCreate(){var sel=document.getElementById('inpChar'),chars=getChars();sel.innerHTML='';if(chars.length){chars.forEach(function(c){var o=document.createElement('option');o.value=c.id||c.name;o.textContent=charName(c);sel.appendChild(o);});}else{var o=document.createElement('option');o.value='';o.textContent='(暂无角色·先不绑定)';sel.appendChild(o);}document.getElementById('createMask').classList.add('show');}
function createPet(){
  var name=document.getElementById('inpName').value.trim()||'崽崽';
  var perso=document.getElementById('inpPerso').value;
  var cid=document.getElementById('inpChar').value,c=cid?getCharById(cid):null;
  var callChar=document.getElementById('inpCallChar').value.trim()||charName(c);
  var callUser=document.getElementById('inpCallUser').value.trim()||'你';
  pet={exists:true,species:'dragon',name:name,perso:perso,bindCharId:cid||null,bindCharName:charName(c),
    callChar:callChar,callUser:callUser,stage:'baby',finalForm:null,
    stats:{hunger:80,clean:80,mood:80,intimacy:0},bornAt:Date.now(),lastUpdate:Date.now(),neglect:0,days:0,log:[]};
  addLog('sys','','🥚 你领养了「'+name+'」,性格:'+PERSO_NAME[perso],false);
  DB.pet=pet;saveDB();document.getElementById('createMask').classList.remove('show');
  render();renderLog();sayLine('你好呀~我是'+name+'!');fxRise('💗');
}

/* 设置 */
function openSet(){if(!pet){toast('先领养一只');return;}document.getElementById('setName').value=pet.name||'';document.getElementById('setCharTip').textContent=pet.bindCharName||'TA';document.getElementById('setCallChar').value=pet.callChar||'';document.getElementById('setCallUser').value=pet.callUser||'';document.getElementById('setMask').classList.add('show');}

function closeSet(){document.getElementById('setMask').classList.remove('show');}
function saveSettings(){pet.name=document.getElementById('setName').value.trim()||'崽崽';pet.callChar=document.getElementById('setCallChar').value.trim()||pet.bindCharName;pet.callUser=document.getElementById('setCallUser').value.trim()||'你';saveDB();closeSet();toast('已保存~');render();}

function sendOff(){DB.petMemorial=DB.petMemorial||[];DB.petMemorial.push({name:pet.name,form:formKey(),days:Math.floor(pet.days||0),charName:pet.bindCharName});DB.pet=null;pet=null;saveDB();toast('🌙 崽崽出门远行了~');setTimeout(function(){location.reload();},1500);}
function askSendOff(){if(confirm('确定送崽崽远行吗?它会进入纪念册。'))sendOff();}
function openMemorial(){var l=DB.petMemorial||[];var t=l.length?l.map(function(m){return '🐉 '+m.name+' · '+(STAGE_NAME[m.form]||m.form)+' · 陪伴'+m.days+'天';}).join('\n'):'还没有远行的崽崽~';alert('📖 纪念册\n\n'+t);}

var dc=0,dtm;function devTap(){dc++;clearTimeout(dtm);dtm=setTimeout(function(){dc=0;},1500);if(dc>=5){dc=0;openDev();}}
function openDev(){if(!pet){toast('先领养一只');return;}var forms=['baby','teen','adult','final_star','final_dark'];document.getElementById('devForms').innerHTML=forms.map(function(f){return '<span class="dbtn'+(pet._devForm===f?' on':'')+'" onclick="devForm(\''+f+'\')">'+STAGE_NAME[f]+'</span>';}).join('')+'<span class="dbtn'+(!pet._devForm?' on':'')+'" onclick="devForm(\'\')">真实</span>';var st=[['normal','正常'],['sleep','睡觉'],['unhappy','不开心'],['','真实']];document.getElementById('devStates').innerHTML=st.map(function(s){return '<span class="dbtn'+((pet._devState||'')===s[0]?' on':'')+'" onclick="devState(\''+s[0]+'\')">'+s[1]+'</span>';}).join('');document.getElementById('btnFree').textContent='免费:'+(FREE?'开':'关');document.getElementById('btnFree').classList.toggle('on',FREE);document.getElementById('devMask').classList.add('show');}
function closeDev(){document.getElementById('devMask').classList.remove('show');}
function devForm(f){pet._devForm=f||null;saveDB();render();openDev();}
function devState(s){pet._devState=s||null;lastSk='';saveDB();render();openDev();}
function devSet(k,v){if(k==='all'){pet.stats.hunger=v;pet.stats.clean=v;pet.stats.mood=v;}else pet.stats[k]=v;saveDB();render();openDev();}
function devFF(h){pet.lastUpdate-=h*3600000;catchUp();render();renderLog();openDev();toast('快进'+h+'h');}
function devAddDay(d){pet.bornAt-=d*86400000;checkGrow();render();openDev();toast('养育+'+d+'天');}
function devGrow(){checkGrow();render();openDev();}
function toggleFree(){FREE=!FREE;openDev();}
function devVisit(){if(!pet.bindCharId){toast('没绑定角色');return;}addLog('char',pet.bindCharName,fill(rand(VISIT)),false);addLog('pet','崽崽',fill(rand(VISIT_REPLY[pet.perso]||VISIT_REPLY.clingy)));renderLog();closeDev();}
function devNap(){napping=true;lastSk='';render();closeDev();setTimeout(function(){napping=false;render();},16000);}
function devReset(){if(confirm('删除重开?')){DB.pet=null;saveDB();location.reload();}}

function goHome(){if(history.length>1)history.back();else location.href='hub.html';}
function tick(){var n=new Date();var el=document.getElementById('sbTime');if(el)el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
var batteryManager=null;
function updateBatteryUI(b){var el=document.getElementById('battLvl');if(!el)return;el.style.width=(b?Math.round(b.level*100):80)+'%';}
function initBattery(){if(!navigator.getBattery){updateBatteryUI(null);return;}navigator.getBattery().then(function(b){batteryManager=b;updateBatteryUI(b);b.addEventListener('levelchange',function(){updateBatteryUI(b);});}).catch(function(){});}
function preload(){for(var f in IMG)for(var s in IMG[f]){var i=new Image();i.src=IMG[f][s];}}

/* 白天打盹(随机) + 正常时的情绪浮标(减少死板) */
setInterval(function(){if(!pet||pet._devState||isNight()||napping)return;var s=pet.stats;if(s.hunger<30||s.clean<30||s.mood<30)return;if(Math.random()<0.18){napping=true;lastSk='';render();setTimeout(function(){napping=false;render();},16000);}},22000);
setInterval(function(){if(!pet)return;if(stateKey()==='normal'&&Math.random()<0.5)floatEmote();},6000);

preload();tick();setInterval(tick,1000);initBattery();initPet();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&pet){loadDB();pet=DB.pet;if(pet){catchUp();checkGrow();render();renderLog();}}});
</script>
